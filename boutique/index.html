<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boutique</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="favicon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#1736A6">
<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
<link rel="preload" href="data.json" as="fetch" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" media="print" onload="this.media='all'" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;700&display=swap">
<script>
/* =====================================================================
   ✏️  SEULE LIGNE À MODIFIER : colle entre les guillemets l'URL de ton
   « Application Web » Google Apps Script (elle finit par /exec)
   ===================================================================== */
var API = "https://script.google.com/macros/s/AKfycbwgdtcXlXB9niD3hactnz4SLIrpY_q74iQQZwkr1vrUBjczfCCVWwamG69uqnUQZsba/exec";
// Boutique d'un abonné Vendoo : ?v=<id> (même serveur, ses données à lui)
var VID = (new URLSearchParams(location.search).get('v') || '').toLowerCase().replace(/[^a-f0-9]/g, '').slice(0, 16);
if (VID) document.querySelectorAll('link[rel=icon]').forEach(l => l.remove());
</script>
<style>
:root{--main:#1736A6;--sun:#FFC93C;--ink:#141A2E;--soft:#5A6178;--line:#E3E6EF;--bg:#FFFFFF;--surface:#F3F5FB;--ok:#128C4A;--err:#C62828}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:var(--bg);line-height:1.55;font-size:16px}
body.has-sticky{padding-bottom:84px}
h1,h2,h3{font-family:"Bricolage Grotesque","Figtree",system-ui,sans-serif;line-height:1.12;letter-spacing:-.01em}
img{max-width:100%;display:block}
a{color:inherit}
.wrap{max-width:560px;margin:0 auto;background:var(--bg);min-height:100vh}
.home .wrap{max-width:960px}
.topbar{background:var(--main);color:#fff;font-size:14px;font-weight:600;padding:9px 0;overflow:hidden;white-space:nowrap}
.defile{display:inline-flex;animation:defile 22s linear infinite;will-change:transform}
.defile span{padding:0 28px}
.defile .promo{color:#FFD54A;font-weight:800}
@keyframes defile{from{transform:translateX(0)}to{transform:translateX(-50%)}}
header{display:flex;align-items:center;justify-content:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(255,255,255,.96);z-index:15;box-shadow:0 2px 14px rgba(18,48,143,.06)}
.brand{display:flex;align-items:center;justify-content:center;gap:10px;text-decoration:none;font:800 21px "Bricolage Grotesque",sans-serif;letter-spacing:.06em;color:var(--main);min-width:0}
.brand img{height:36px;width:auto}
.brand span{background:linear-gradient(90deg,#12308F,#2350D8);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.country{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--soft)}
.country select{border:2px solid var(--line);border-radius:10px;padding:7px 8px;font:600 14px "Figtree",sans-serif;background:#fff;color:var(--ink);max-width:150px}

/* Accueil */
.hero{padding:26px 16px 6px}
.hero h1{font-size:28px;font-weight:800}
.hero p{color:var(--soft);margin-top:6px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:16px}
@media(min-width:700px){.grid{grid-template-columns:repeat(3,1fr);gap:18px}}
.card{text-decoration:none;border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;background:#fff;transition:transform .15s,box-shadow .15s}
.card:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(20,26,46,.08)}
.card img{aspect-ratio:1/1;object-fit:contain;width:100%;background:#fff}
.card .ci{padding:10px 12px 14px;display:flex;flex-direction:column;gap:4px;flex:1}
.card .cn{font-weight:700;font-size:15px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .cp{font:800 18px "Bricolage Grotesque",sans-serif;color:var(--main);margin-top:auto}
.card .co{color:var(--soft);text-decoration:line-through;font-size:13px}
.card .badge{align-self:flex-start;background:var(--sun);border-radius:999px;font-size:12px;font-weight:700;padding:2px 8px}
.empty{padding:40px 20px;text-align:center;color:var(--soft)}

/* Produit */
.gallery{position:relative;background:var(--surface)}
.slides{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.slides::-webkit-scrollbar{display:none}
.slides{align-items:center;background:#fff}
.slides img{flex:0 0 100%;width:100%;height:auto;max-height:82vh;object-fit:contain;scroll-snap-align:center;background:#fff}
.dots{display:flex;gap:6px;justify-content:center;padding:10px 0 0}
.dots span{width:8px;height:8px;border-radius:50%;background:var(--line);transition:background .2s}
.dots span.on{background:var(--main)}
.intro{padding:18px 18px 4px}
.intro h1{font-size:28px;font-weight:800}
.intro p{color:var(--soft);margin-top:8px;font-size:17px}
.stars{color:#E9A300;font-size:15px;margin-top:8px}
.stars small{color:var(--soft);margin-left:6px}
.pricetag{margin:16px 18px 0;background:var(--sun);border-radius:18px;padding:16px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;position:relative}
.pricetag::before{content:"";position:absolute;left:-7px;top:50%;width:14px;height:14px;margin-top:-7px;background:var(--bg);border-radius:50%}
.pricetag .now{font-family:"Bricolage Grotesque",sans-serif;font-size:32px;font-weight:800;line-height:1}
.pricetag .old{text-decoration:line-through;color:#6B5A1E;font-size:15px;margin-top:4px}
.pricetag .off{background:var(--ink);color:#fff;font-weight:700;border-radius:999px;padding:6px 12px;font-size:15px;white-space:nowrap}
.stock{margin:12px 18px 0;font-size:15px;color:var(--err);font-weight:600}
.stk{margin:12px 18px 0;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.stk .sl{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:15px;font-weight:700;color:var(--ink)}
.stk .st{background:var(--sun);color:var(--ink);border-radius:999px;padding:3px 10px;font-size:12.5px;font-weight:800;white-space:nowrap}
.stk .sn b{font:800 20px "Bricolage Grotesque",sans-serif;color:var(--main)}
.stk .bar{height:7px;background:var(--line);border-radius:999px;margin-top:9px;overflow:hidden}
.stk .bar i{display:block;height:100%;border-radius:999px;background:var(--main);transition:width .7s ease}
.stk small{display:block;margin-top:7px;color:var(--soft);font-size:12.5px}
.stk.last{border-color:var(--main);box-shadow:inset 4px 0 0 var(--main)}
.urg{position:fixed;left:50%;top:12px;z-index:60;width:min(440px,calc(100vw - 20px));transform:translate(-50%,-150%);transition:transform .4s ease;display:flex;align-items:center;gap:12px;background:#fff;color:var(--ink);border:1px solid var(--line);border-left:5px solid var(--main);border-radius:14px;padding:12px 12px 12px 14px;box-shadow:0 10px 30px rgba(20,26,46,.18)}
.urg.on{transform:translate(-50%,0)}
.urg .ui{width:38px;height:38px;flex:0 0 38px;border-radius:10px;background:var(--sun);display:grid;place-items:center;font-size:19px}
.urg .ut{flex:1;min-width:0;line-height:1.3}
.urg .ut b{display:block;font-size:15px;font-weight:800}
.urg .ut span{font-size:13px;color:var(--soft)}
.urg .ub{background:var(--main);color:#fff;font-weight:800;font-size:14px;border-radius:999px;padding:9px 14px;text-decoration:none;white-space:nowrap}
.urg .ux{background:none;border:0;color:var(--soft);font-size:22px;line-height:1;cursor:pointer;padding:0 2px}
.valider{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border-left:4px solid var(--main);border-radius:10px;padding:11px 13px;margin:14px 0 10px;font-size:14px;line-height:1.4;color:var(--ink)}
.valider[hidden]{display:none}
.valider .vi{font-size:18px;line-height:1.2}
.retour{margin:12px 18px 0;background:var(--surface);border-left:4px solid var(--main);color:var(--ink);border-radius:12px;padding:13px 15px;display:flex;flex-direction:column;gap:3px;font-size:14px;line-height:1.35}
.retour b{font-size:15.5px}
.retour span{color:var(--soft)}
.retour a{color:var(--main);font-weight:800;margin-top:5px}
.sticky .nv{display:none}
.sticky.brou{flex-wrap:wrap;row-gap:6px}
.sticky.brou .nv{display:block;flex:0 0 100%;text-align:center;font-size:13px;font-weight:700;color:var(--ink);background:var(--sun);border-radius:8px;padding:5px 8px}
body.has-sticky:has(.sticky.brou){padding-bottom:116px}
.nbz{border-top:0;padding-top:8px}
.nbc{border:1px solid var(--line);border-top:4px solid var(--main);border-radius:16px;padding:20px 18px 18px;background:#fff}
.nbh{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.nbt{background:var(--main);color:#fff;font:800 18px "Bricolage Grotesque",sans-serif;border-radius:8px;padding:5px 11px;letter-spacing:.04em}
.nbh h2{font-size:22px;font-weight:800;margin:0;color:var(--ink)}
.nbi{display:flex;gap:12px;align-items:flex-start;padding:13px 0;border-top:1px solid var(--line)}
.nbe{flex:0 0 40px;height:40px;border-radius:10px;background:var(--surface);display:grid;place-items:center;font-size:19px}
.nbi b{font-size:16.5px;font-weight:800;line-height:1.3;display:block;color:var(--ink)}
.nbi p{color:var(--soft);font-size:15px;line-height:1.5;margin-top:4px}
.nbi p b{display:inline;font-size:inherit}
.nbi .nbnum{color:var(--main)!important;white-space:nowrap}
.nbwa{display:inline-flex;align-items:center;gap:8px;margin-top:10px;background:var(--main);color:#fff;font-weight:800;font-size:15px;border-radius:999px;padding:10px 16px;text-decoration:none}
.nbw{margin-top:6px;background:var(--surface);border-left:4px solid var(--sun);border-radius:10px;padding:13px 14px}
.nbw b{display:block;font-size:15.5px;line-height:1.4;color:var(--ink)}
.nbw span{display:block;margin-top:6px;font-weight:700;font-size:14.5px;color:var(--soft)}
@media (min-width:1000px){.nbc{padding:26px 30px 22px}.nbh h2{font-size:25px}.nbi b{font-size:17.5px}}
.unavail{margin:16px 18px;background:var(--surface);border-radius:14px;padding:16px;font-weight:600}
section{padding:26px 18px;border-top:1px solid var(--line)}
section h2{font-size:23px;font-weight:800;margin-bottom:14px}
.rich p{font-size:17px;margin-bottom:14px}
.rich h3{font-size:20px;margin:6px 0 10px}
.rich img{max-width:100%;height:auto;border-radius:14px;margin:4px auto 16px;display:block}
.rich h2{font-size:22px;margin:8px 0 10px}
.rich ul,.rich ol{padding-left:22px;margin:0 0 14px;font-size:17px}.rich li{margin-bottom:6px}
.rich a{color:var(--main);font-weight:600;text-decoration:underline}
.rich table{width:100%;border-collapse:collapse;margin:6px 0 16px;font-size:15px}
.rich td,.rich th{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
.rich th{background:var(--surface)}
.rich .vid{position:relative;width:100%;aspect-ratio:16/9;margin:4px 0 16px;border-radius:14px;overflow:hidden;background:#000}
.rich .vid.v{aspect-ratio:9/16;max-width:360px;margin-left:auto;margin-right:auto}
.rich .vid iframe,.rich .vid video{position:absolute;inset:0;width:100%;height:100%;border:0}
.rich [style*="center"] img{margin-left:auto;margin-right:auto}
.perks{list-style:none;display:grid;gap:12px;margin-top:6px}
.perks li{display:flex;gap:12px;align-items:flex-start;font-size:17px}
.perks.top{margin-top:16px;gap:10px}
.perks.top li{font-size:16px;font-weight:600}
.perks li::before{content:"✓";flex:0 0 26px;height:26px;border-radius:50%;background:var(--main);color:#fff;display:grid;place-items:center;font-weight:700;font-size:14px;margin-top:1px}
.box{margin-top:18px;background:var(--surface);border-radius:12px;padding:14px 16px}
.box h3{font-size:16px;margin-bottom:6px}
.box ul{padding-left:20px}
details{border-bottom:1px solid var(--line);padding:14px 0}
summary{font-weight:700;cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:10px}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";font-size:22px;line-height:1;color:var(--main)}
details[open] summary::after{content:"−"}
details p{color:var(--soft);margin-top:8px}

/* Avis */
.reviews{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;margin:0 -18px;padding:0 18px 4px}
.reviews::-webkit-scrollbar{display:none}
.review{flex:0 0 86%;scroll-snap-align:center;background:var(--surface);border-radius:16px;padding:16px}
.review .rs{color:#E9A300}
.review p{margin:8px 0}
.review .who{font-weight:700}
.review img{border-radius:10px;margin-top:8px;max-height:320px;object-fit:contain;width:100%;background:#fff}
.review .rhead{display:flex;gap:10px;align-items:center}
.review .rav{flex:0 0 44px;width:44px;height:44px;border-radius:50%;object-fit:cover;margin:0;max-height:none;background:#ddd}
.review .rini{display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;background:var(--accent,#0B6E4F)}
.review .rage{font-weight:500;opacity:.75}
.review .rok{font-size:11px;color:#1a7f37;font-weight:700;margin-left:4px}
.review .raud{margin-top:10px;background:#fff;border-radius:12px;padding:8px}
.review .raud audio{width:100%;display:block}
.review .raud iframe{width:100%;height:60px;border:0;display:block}
.review .raud small{display:block;font-weight:700;margin-bottom:4px;font-size:12px}
.review .vid{margin-top:10px}
.rdots{display:flex;gap:6px;justify-content:center;margin-top:12px}
.rdots span{width:7px;height:7px;border-radius:50%;background:var(--line)}
.rdots span.on{background:var(--main)}

/* Garanties */
.trust{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.trust div{background:var(--surface);border-radius:14px;padding:14px;text-align:center}
.trust .e{font-size:30px;line-height:1}
.trust b{display:block;margin:8px 0 4px;font-size:15px;line-height:1.25}
.trust small{color:var(--soft);font-size:12.5px;line-height:1.4;display:block}

/* Formulaire */
#commande{background:var(--surface);border-top:0;margin-top:18px}
#commande h2{margin-bottom:4px}
#commande .sub{color:var(--soft);margin-bottom:18px}
.field{margin-bottom:18px}
.field>label,.legend{display:block;font-weight:700;margin-bottom:8px}
input[type=tel],input[type=text],textarea,select.in{width:100%;border:2px solid var(--line);border-radius:12px;padding:14px;font:500 17px "Figtree",sans-serif;background:#fff;color:var(--ink)}
textarea{min-height:84px;resize:vertical}
input:focus,textarea:focus,select:focus{border-color:var(--main);outline:none}
.phone{display:flex;align-items:stretch;border:2px solid var(--line);border-radius:12px;background:#fff;overflow:hidden}
.phone span{display:flex;align-items:center;padding:0 12px;background:var(--surface);font-weight:700;border-right:2px solid var(--line)}
.phone input{border:0!important;border-radius:0}
.phone:focus-within{border-color:var(--main)}
.choices{display:grid;gap:10px}
.choice{position:relative}
.choice input{position:absolute;opacity:0;pointer-events:none}
.choice label{display:flex;justify-content:space-between;align-items:center;gap:10px;background:#fff;border:2px solid var(--line);border-radius:12px;padding:14px 16px;cursor:pointer;font-weight:600}
.choice label small{display:block;font-weight:500;color:var(--ok);font-size:14px}
.choice label .p{text-align:right;white-space:nowrap}
.choice label .p b{display:block;font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:19px}
.choice label .p s{color:var(--soft);font-size:13px;font-weight:500}
.choice input:checked+label{border-color:var(--main);box-shadow:inset 0 0 0 1px var(--main)}
.choice input:focus-visible+label,.cta:focus-visible,button:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.confirm{display:flex;gap:12px;align-items:flex-start;background:#fff;border:2px solid var(--line);border-radius:12px;padding:14px 16px;cursor:pointer;font-weight:700}
.confirm input{width:24px;height:24px;accent-color:var(--main);flex:0 0 24px;margin-top:1px}
.error{color:var(--err);font-size:14px;font-weight:600;margin-top:6px;display:none}
.field.bad .error{display:block}
.field.bad input,.field.bad textarea,.field.bad .confirm,.field.bad .phone,.field.bad select{border-color:var(--err)}
.etape{font-size:18px;margin:22px 0 10px;padding-top:16px;border-top:1px solid var(--line)}
.ticket{background:#fff;border:2px dashed var(--main);border-radius:14px;padding:16px;margin:6px 0 16px}
.ticket .row{display:flex;justify-content:space-between;gap:12px;padding:4px 0}
.ticket .row span:first-child{color:var(--soft)}
.ticket .row span:last-child{text-align:right;font-weight:600}
.ticket .total{border-top:2px dashed var(--line);margin-top:8px;padding-top:10px}
.ticket .total span:last-child{font-family:"Bricolage Grotesque",sans-serif;font-size:24px;font-weight:800;color:var(--main)}
.cta{display:block;width:100%;background:var(--main);color:#fff;border:0;border-radius:14px;padding:18px;font:700 19px "Figtree",sans-serif;text-align:center;text-decoration:none;cursor:pointer}
.cta[disabled]{opacity:.7;cursor:wait}
.reassure{text-align:center;color:var(--soft);font-size:14px;margin-top:10px}
.senderr{display:none;background:#FDECEC;color:var(--err);border-radius:12px;padding:12px;margin-top:12px;font-weight:600;text-align:center}
.senderr a{display:block;margin-top:6px;color:var(--ink)}
footer{text-align:center;color:var(--soft);font-size:13px;padding:24px 18px 30px;border-top:1px solid var(--line)}
footer a{display:inline-block;margin-bottom:10px;font-weight:700;color:var(--main)}
.sticky{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 14px;display:flex;gap:12px;align-items:center;z-index:20;transition:transform .25s}
.sticky.hide{transform:translateY(110%)}
/* Notifications de ventes (vraies commandes récentes) */
.preuve{position:fixed;left:12px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:45;max-width:min(340px,calc(100vw - 24px));display:flex;gap:10px;align-items:center;background:#fff;border-radius:14px;padding:9px 12px 9px 9px;box-shadow:0 8px 30px rgba(20,26,46,.22);transform:translateY(16px);opacity:0;transition:transform .35s ease,opacity .35s ease;pointer-events:none;font-size:13.5px;line-height:1.35}
.preuve.on{transform:none;opacity:1}
.preuve img{width:44px;height:44px;border-radius:9px;object-fit:cover;flex:0 0 44px;background:var(--surface)}
.preuve b{font-weight:800}
.preuve small{display:block;color:var(--soft);font-size:12px;margin-top:1px}
.preuve .ok{color:#128C4A;font-weight:700}
@media (min-width:1000px){.preuve{bottom:20px;left:20px}}
.sticky .sp{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:20px;white-space:nowrap}
.sticky .cta{flex:1;padding:14px;font-size:17px}
.attn{position:relative;overflow:hidden;animation:attn 2s ease-in-out infinite;transform-origin:center}
@keyframes attn{0%,100%{transform:scale(1);box-shadow:0 0 0 0 rgba(23,54,166,.45)}45%{transform:scale(1.035);box-shadow:0 0 0 10px rgba(23,54,166,0)}70%{transform:scale(1)}}
.attn::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.4),transparent);transform:skewX(-20deg);animation:brille 2s ease-in-out infinite;pointer-events:none}
@keyframes brille{0%{left:-60%}55%,100%{left:130%}}
.overlay{position:fixed;inset:0;background:rgba(20,26,46,.6);display:none;align-items:center;justify-content:center;padding:20px;z-index:50}
.overlay.show{display:flex}
.modal{background:#fff;border-radius:18px;padding:24px 20px;max-width:400px;width:100%;text-align:center}
.modal .big{font-size:44px}
.modal h3{font-size:22px;margin:8px 0}
.modal p{color:var(--soft);margin-bottom:16px}
.wa{display:block;background:#25D366;color:#fff;text-decoration:none;border-radius:12px;padding:16px;font-weight:700;font-size:17px}
.done{background:#fff;border-radius:16px;padding:22px 18px;text-align:center}
.done .big{font-size:42px}
.done h3{font-size:20px;margin:8px 0}
.done p{color:var(--soft);margin-bottom:16px}
.thanks{padding:30px 18px 26px;text-align:center}
.thanks .big{font-size:54px;line-height:1}
.thanks h1{font-size:30px;margin:12px 0 6px}
.thanks .lead{font-size:18px;margin-bottom:6px}
.thanks .num{color:var(--soft);font-weight:600;margin-bottom:18px}
.thanks .ticket{text-align:left}
.thanks .call{background:var(--sun);border-radius:14px;padding:14px;font-weight:600;margin:4px 0 18px}
.hidden{display:none!important}
.loading{padding:60px 20px;text-align:center;color:var(--soft)}
.spin{width:34px;height:34px;border:4px solid var(--line);border-top-color:var(--main);border-radius:50%;margin:0 auto 14px;animation:s 1s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important;animation:none!important}}
@media (min-width:600px) and (max-width:999px){.prod .wrap{border-left:1px solid var(--line);border-right:1px solid var(--line)}.sticky{max-width:560px;margin:0 auto}}
.thumbs{display:none}
/* ---------- Version ordinateur ---------- */
@media (min-width:1000px){
  body{background:var(--surface)}
  .wrap,.home .wrap{max-width:1200px;box-shadow:0 0 0 1px var(--line)}
  header{padding:16px 32px}
  .brand{font-size:24px}.brand img{height:42px}
  .hero{padding:40px 32px 10px}.hero h1{font-size:40px}
  .grid{grid-template-columns:repeat(4,1fr);gap:22px;padding:24px 32px 32px}
  .card .cn{font-size:16px}
  .ptop{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:44px;padding:32px 32px 8px;align-items:start}
  .pgal{position:sticky;top:96px}
  .gallery{border-radius:20px;overflow:hidden}
  .dots{display:none}
  .thumbs{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
  .thumbs button{width:76px;height:76px;border-radius:12px;overflow:hidden;border:2px solid transparent;padding:0;cursor:pointer;background:var(--surface)}
  .thumbs button.on{border-color:var(--main)}
  .thumbs img{width:100%;height:100%;object-fit:contain;background:#fff}
  .intro{padding:0}
  .intro h1{font-size:36px}
  .pricetag,.stock,.stk,.retour,.unavail{margin-left:0;margin-right:0}
  #commande{border-radius:22px;margin-top:22px;padding:26px 24px}
  .pbelow{max-width:860px;margin:0 auto;padding:10px 32px 0}
  .pbelow section{padding:36px 0}
  .pbelow section h2{font-size:28px}
  .reviews{display:grid;grid-template-columns:repeat(3,1fr);overflow:visible;margin:0;padding:0}
  .review{flex:none}
  .rdots{display:none}
  .trust{grid-template-columns:repeat(4,1fr)}
  .sticky{display:none}
  body.has-sticky{padding-bottom:0}
  footer{padding:30px 32px 40px}
  section{padding:32px}
}
</style>
</head>
<body>
<div id="app"><div class="loading"><div class="spin"></div>Chargement…</div></div>

<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="mTitle">
  <div class="modal">
    <div class="big">✅</div>
    <h3 id="mTitle">Commande n°<span id="mNum"></span> enregistrée</h3>
    <p>WhatsApp va s'ouvrir. Appuyez sur <b>Envoyer</b> pour nous transmettre votre commande.</p>
    <a class="wa" id="waLink" href="#">Envoyer ma commande sur WhatsApp</a>
  </div>
</div>

<script>
(function(){
  const $ = id => document.getElementById(id);
  const app = $('app');
  const params = new URLSearchParams(location.search);
  // Plusieurs boutiques (Vendoo) : ?b=code ; sans code = boutique principale (liens de pub inchangés)
  const BQ = (params.get('b') || '').toLowerCase().replace(/[^a-z0-9-]/g, '').slice(0, 40);
  const avecB = body => { let b = String(body); if (BQ) b = b.replace(/^\{/, '{"b":"' + BQ + '",'); if (VID) b = b.replace(/^\{/, '{"v":"' + VID + '",'); return b; };
  const PV = (VID ? 'v=' + VID + '&' : '') + (BQ ? 'b=' + BQ + '&' : '');
  const QS = '?' + PV;
  const ACCUEIL = PV ? './?' + PV.slice(0, -1) : './';
  const K_CMD = 'commandes' + (VID ? '_v' + VID : '') + (BQ ? '_' + BQ : '');
  const K_DATA = VID ? 'data:v' + VID + (BQ ? ':' + BQ : '') : 'data:' + API;
  const pid = (params.get('p') || '').trim().toLowerCase();
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const store = {
    get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
    set(k,v){ try { localStorage.setItem(k,v); } catch(e){} }
  };
  let D = null, country = null, touched = false, pixelsOn = false, checkoutSent = false;

  /* ---------- Origine du client (quelle pub) ---------- */
  const ATT_KEYS = ['utm_source','utm_campaign','utm_term','utm_content','fbclid','ttclid','tt'];
  (function saveAttribution(){
    const fresh = {}; ATT_KEYS.forEach(k => { const v = params.get(k); if (v) fresh[k] = v.slice(0, 200); });
    if (Object.keys(fresh).length){ fresh.t = Date.now(); store.set('attrib', JSON.stringify(fresh)); }
  })();
  // Garde l'identifiant de clic Facebook (fbc) pour que le pixel relie l'ACHAT à la pub, même plus tard ou après rechargement
  (function cookieClicFacebook(){
    try {
      const a = JSON.parse(store.get('attrib') || '{}') || {};
      const nouveau = !!params.get('fbclid'), present = /(?:^|; )_fbc=/.test(document.cookie);
      if (a.fbclid && a.t && Date.now() - a.t < 7*864e5 && (nouveau || !present))
        document.cookie = '_fbc=' + encodeURIComponent('fb.1.' + a.t + '.' + a.fbclid) + '; path=/; max-age=' + (90*86400) + '; SameSite=Lax; Secure';
    } catch(e){}
  })();
  function attribution(){
    let a = {};
    try { a = JSON.parse(store.get('attrib') || '{}') || {}; } catch(e){}
    if (a.t && Date.now() - a.t > 7*864e5) a = {};
    const ck = n => { const m = document.cookie.match('(?:^|; )' + n + '=([^;]*)'); return m ? decodeURIComponent(m[1]) : ''; };
    a.fbp = ck('_fbp'); a.fbc = ck('_fbc') || (a.fbclid ? 'fb.1.' + (a.t || Date.now()) + '.' + a.fbclid : '');
    a.ttp = ck('_ttp'); a.ua = navigator.userAgent.slice(0, 300);
    delete a.t;
    return a;
  }

  /* ---------- Outils ---------- */
  function money(n, dev){
    const v = Number(n) || 0;
    const s = v.toLocaleString('fr-FR', {maximumFractionDigits: 2}).replace(/[  ]/g, ' ');
    return s + ' ' + (dev || '');
  }
  let IMG = {}, IMGM = {};
  try { IMG = JSON.parse(localStorage.getItem('imgs') || '{}') || {}; IMGM = JSON.parse(localStorage.getItem('imgsM') || '{}') || {}; } catch(e){}
  // Version téléphone (1080 px, plus légère) quand elle existe
  const imgM = u => IMGM[String(u || '').trim()] || img(u);
  const srcset = u => { const a = IMGM[String(u || '').trim()], b = img(u); return a ? `src="${esc(a)}" srcset="${esc(a)} 1080w, ${esc(b)} 1600w" sizes="(min-width:1000px) 50vw, 390px"` : `src="${esc(b)}"`; };
  function img(u){
    u = String(u || '').trim();
    if (IMG[u]) return IMG[u];
    const m = u.match(/drive\.google\.com\/(?:file\/d\/|open\?id=|uc\?(?:export=\w+&)?id=)([\w-]{20,})/);
    if (m) return 'https://drive.google.com/thumbnail?id=' + m[1] + '&sz=w2000';
    return u;
  }
  const isUrl = s => /^https?:\/\/\S+$/i.test(s);
  // Vidéo : YouTube, TikTok, Google Drive ou fichier .mp4
  function audioAvis(u){
    u = String(u||'').trim(); let m;
    const t = '<small>🎤 Note vocale du client</small>';
    if ((m = u.match(/drive\.google\.com\/(?:file\/d\/|open\?id=|uc\?(?:export=\w+&)?id=)([\w-]{20,})/))) return `<div class="raud">${t}<iframe src="https://drive.google.com/file/d/${m[1]}/preview" loading="lazy"></iframe></div>`;
    if (/^https?:\/\//.test(u)) return `<div class="raud">${t}<audio controls preload="none" src="${esc(u)}"></audio></div>`;
    return '';
  }
  function video(u){
    u = String(u || '').trim(); let m;
    if ((m = u.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|shorts\/|embed\/))([\w-]{6,})/))) return `<div class="vid${/shorts/.test(u) ? ' v' : ''}"><iframe src="https://www.youtube.com/embed/${m[1]}" loading="lazy" allowfullscreen allow="autoplay; encrypted-media; picture-in-picture"></iframe></div>`;
    if ((m = u.match(/tiktok\.com\/.*\/video\/(\d+)/))) return `<div class="vid v"><iframe src="https://www.tiktok.com/embed/v2/${m[1]}" loading="lazy" allowfullscreen></iframe></div>`;
    if ((m = u.match(/drive\.google\.com\/(?:file\/d\/|open\?id=)([\w-]{20,})/))) return `<div class="vid"><iframe src="https://drive.google.com/file/d/${m[1]}/preview" loading="lazy" allowfullscreen></iframe></div>`;
    if (/^https?:\/\/\S+\.(mp4|webm|mov)(\?\S*)?$/i.test(u)) return `<div class="vid"><video src="${esc(u)}" controls playsinline preload="metadata"></video></div>`;
    return '';
  }
  // Description mise en forme (gras, italique, alignement, liens, images, vidéos, tableaux) : seules les balises sûres passent
  function richHtml(h){
    const ok = {P:1,H2:1,H3:1,B:1,STRONG:1,I:1,EM:1,U:1,BR:1,UL:1,OL:1,LI:1,A:1,IMG:1,TABLE:1,THEAD:1,TBODY:1,TR:1,TD:1,TH:1,DIV:1,SPAN:1,BLOCKQUOTE:1,FIGURE:1};
    const t = document.createElement('template'); t.innerHTML = h;
    const net = el => {
      [...el.childNodes].forEach(n => {
        if (n.nodeType === 3) return;
        if (n.nodeType !== 1){ n.remove(); return; }
        if (n.classList && n.classList.contains('vid') && n.dataset.v){ const v = video(n.dataset.v); const d = document.createElement('div'); d.innerHTML = v; n.replaceWith(...(v ? d.childNodes : [])); return; }
        if (/^(SCRIPT|STYLE|IFRAME|OBJECT|EMBED|NOSCRIPT|TEMPLATE|SVG|MATH|FORM|INPUT|BUTTON|TEXTAREA|SELECT)$/i.test(n.tagName)){ n.remove(); return; }
        if (!ok[n.tagName]){ net(n); n.replaceWith(...n.childNodes); return; }
        const al = (n.getAttribute('style') || '').match(/text-align:\s*(left|center|right|justify)/), w = (n.getAttribute('style') || '').match(/(?:^|;)\s*width:\s*(\d{1,3}%)/);
        const href = n.getAttribute('href'), src = n.getAttribute('src'), cs = n.getAttribute('colspan');
        [...n.attributes].forEach(a => n.removeAttribute(a.name));
        if (al) n.style.textAlign = al[1];
        if (n.tagName === 'A' && href && /^(https?:|mailto:|tel:|#|\?)/i.test(href)){ n.setAttribute('href', href); if (/^https?:/i.test(href)){ n.setAttribute('target', '_blank'); n.setAttribute('rel', 'noopener'); } }
        if (n.tagName === 'IMG'){ if (!src || !/^https?:/i.test(src)){ n.remove(); return; } n.setAttribute('src', img(src)); n.setAttribute('alt', ''); n.setAttribute('loading', 'lazy'); n.setAttribute('decoding', 'async'); if (w) n.style.width = w[1]; }
        if (cs && /^\d$/.test(cs)) n.setAttribute('colspan', cs);
        net(n);
      });
    };
    net(t.content);
    const d = document.createElement('div'); d.appendChild(t.content); return d.innerHTML;
  }
  const BAL = /<(p|img|h[1-6]|br|ul|ol|li|div|table|b|strong|em|i|u|a|span|blockquote|figure)\b[^>]*>/i;
  function decoder(t){
    t = String(t || '');
    if (!/&lt;\/?(p|img|h[1-6]|br|ul|ol|li|div|table|b|strong|em|i|u|a|span|blockquote|figure)\b/i.test(t)) return t;
    for (let k = 0; k < 3 && /&lt;\/?[a-z]/i.test(t); k++){ const x = document.createElement('textarea'); x.innerHTML = t; t = x.value; }
    return t;
  }
  function rich(t){
    t = decoder(t);
    if (/<(p|img|h[1-6]|br|ul|ol|li|div|table|b|strong|em|i|u|a|span|blockquote|figure)\b[^>]*>/i.test(String(t || ''))) return richHtml(t);
    return String(t || '').split(/\r?\n|\s*\|\s*/).map(l => l.trim()).filter(Boolean).map(l => {
      if (isUrl(l)) return `<img src="${esc(img(l))}" alt="" decoding="async">`;
      if (/^##\s*/.test(l)) return `<h3>${esc(l.replace(/^##\s*/, ''))}</h3>`;
      return `<p>${esc(l).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')}</p>`;
    }).join('');
  }
  const R = k => (D && D.reglages && D.reglages[k]) || '';

  const TZ = {'Africa/Porto-Novo':'BJ','Africa/Ouagadougou':'BF','Africa/Bujumbura':'BI','Africa/Douala':'CM','Africa/Bangui':'CF','Indian/Comoro':'KM','Africa/Brazzaville':'CG','Africa/Kinshasa':'CD','Africa/Lubumbashi':'CD','Africa/Abidjan':'CI','Africa/Djibouti':'DJ','Africa/Libreville':'GA','Africa/Conakry':'GN','Africa/Malabo':'GQ','Indian/Antananarivo':'MG','Africa/Bamako':'ML','Africa/Nouakchott':'MR','Africa/Niamey':'NE','Africa/Kigali':'RW','Africa/Dakar':'SN','Africa/Ndjamena':'TD','Africa/Lome':'TG','Africa/Casablanca':'MA','Africa/Algiers':'DZ','Africa/Tunis':'TN','Indian/Mauritius':'MU','Indian/Mahe':'SC'};

  function pickCountry(allowed){
    const codes = allowed.map(p => p.code);
    const cand = [(params.get('c') || '').toUpperCase(), store.get('pays')];
    try { cand.push(TZ[Intl.DateTimeFormat().resolvedOptions().timeZone]); } catch(e){}
    for (const c of cand) if (c && codes.includes(c)) return c;
    return codes[0] || null;
  }
  function setCountry(c){
    const keep = saveForm(), y = scrollY;
    country = c; store.set('pays', c);
    render();
    restoreForm(keep); scrollTo(0, y);
  }
  function saveForm(){
    const f = $('form'); if (!f) return null;
    const v = id => { const e = $(id); return e ? e.value : ''; };
    const r = n => { const e = f.querySelector('input[name=' + n + ']:checked'); return e ? e.id : ''; };
    return {ville: v('ville'), autre: v('villeAutre'), adr: v('adr'), nom: v('nom'), tel: v('tel'), slot: v('slot'), offre: r('offre'), jour: r('jour'), ok: $('ok') && $('ok').checked};
  }
  function restoreForm(k){
    if (!k || !$('form')) return;
    const set = (id, v) => { const e = $(id); if (e && v != null) e.value = v; };
    set('nom', k.nom); set('tel', k.tel); set('adr', k.adr); set('slot', k.slot);
    const vs = $('ville');
    if (vs && [...vs.options].some(o => o.value === k.ville)) vs.value = k.ville;
    if (vs && vs.value === '__autre'){ $('fAutre').classList.remove('hidden'); set('villeAutre', k.autre); }
    if (k.offre && $(k.offre)) $(k.offre).checked = true;
    if (k.jour && $(k.jour)) $(k.jour).checked = true;
    if ($('ok')) $('ok').checked = !!k.ok;
    $('form').dispatchEvent(new Event('change'));
  }
  function countrySelect(list){
    if (!list.length) return '';
    return `<label class="country">🌍 <select id="cSel" aria-label="Votre pays">${list.map(p => `<option value="${esc(p.code)}" ${p.code===country?'selected':''}>${esc(p.nom)}</option>`).join('')}</select></label>`;
  }
  function header(list){
    const logo = R('Logo (lien image, optionnel)');
    const name = R('Nom de la boutique') || 'Boutique';
    // Bandeau qui défile tout seul : message du Sheet + offre du jour
    const msgs = [R('Bandeau du haut'), "🔥 Offre -40% aujourd'hui seulement"].filter(Boolean);
    const tour = msgs.map((m, i) => `<span class="${/offre/i.test(m) ? 'promo' : ''}">${esc(m)}</span>`).join('');
    return `<div class="topbar" aria-label="${esc(msgs.join(' – '))}"><div class="defile" aria-hidden="true">${tour + tour + tour + tour}</div></div>
      <header><a class="brand" href="${ACCUEIL}">${logo || !VID ? `<img src="${esc(logo ? img(logo) : 'logo.png')}" alt="">` : ''}<span>${esc(name)}</span></a></header>`;
  }
  function trust(){
    let h = '';
    for (let i = 1; i <= 4; i++){
      const t = R(`Garantie ${i} – titre`); if (!t) continue;
      h += `<div><div class="e">${esc(R(`Garantie ${i} – emoji`))}</div><b>${esc(t)}</b><small>${esc(R(`Garantie ${i} – texte`))}</small></div>`;
    }
    return (h ? `<section><h2>Nos garanties</h2><div class="trust">${h}</div></section>` : '') + nb();
  }
  // Note importante (boutiques ABROMARKET) : jours de livraison, contact WhatsApp, conditions pour l'intérieur du pays
  const WA_NB = '2290150420757';
  function nb(){
    // Chaque boutique a son propre bloc : un abonné l'active dans ses Réglages avec SON numéro (jamais celui d'ABROMARKET)
    if (String(R('Bloc NB en bas du site (OUI/NON)') || (VID ? 'NON' : 'OUI')).trim().toUpperCase() === 'NON') return '';
    const wa = String(R('WhatsApp affiché dans le NB') || (VID ? R('WhatsApp des commandes') : WA_NB)).replace(/\D/g, '');
    const waAff = wa ? '+' + wa.slice(0, 3) + ' ' + wa.slice(3).replace(/(\d{2})(?=\d)/g, '$1 ') : '';
    return `<section class="nbz" aria-label="Note importante"><div class="nbc">
      <div class="nbh"><span class="nbt">NB</span><h2>À lire avant de commander</h2></div>
      <div class="nbi"><span class="nbe">📅</span><div><b>Nous livrons du lundi au samedi.</b><p>Mais nous recevons vos commandes <b>tous les jours, du lundi au dimanche</b>.</p></div></div>
      ${wa ? `<div class="nbi"><span class="nbe">💬</span><div><b>Une question ? Écrivez-nous sur WhatsApp.</b><p>Nous répondons à vos messages au <b class="nbnum">${esc(waAff)}</b>. Laissez-nous simplement un message WhatsApp, nous vous répondons.</p>
        <a class="nbwa" href="https://wa.me/${wa}?text=${encodeURIComponent('Bonjour, j\'ai une question sur un produit.')}" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm5.3 14.1c-.2.6-1.3 1.2-1.8 1.3-.5.1-1 .1-1.7-.1-.4-.1-.9-.3-1.5-.6-2.7-1.2-4.4-3.9-4.6-4.1-.1-.2-1.1-1.4-1.1-2.7s.7-1.9.9-2.2c.2-.3.5-.3.7-.3h.5c.2 0 .4 0 .6.5l.8 2c.1.1.1.3 0 .5l-.3.5-.4.4c-.1.1-.3.3-.1.6.2.3.7 1.2 1.6 1.9 1.1.9 2 1.2 2.3 1.4.3.1.5.1.6-.1l.9-1c.2-.3.4-.2.6-.1l1.9.9c.3.1.5.2.5.3.1.1.1.6-.1 1.2Z"/></svg>Écrire sur WhatsApp</a></div></div>` : ''}
      <div class="nbi"><span class="nbe">🚚</span><div><b>La livraison est gratuite pour tout le monde.</b><p>Pour les clients de <b>l'intérieur du pays</b> (hors grandes villes), les <b>frais de paiement et les frais d'expédition</b>, précisés lors de notre appel, sont à <b>payer à l'avance</b>.</p></div></div>
      <div class="nbw"><b>⚠️ Si vous ne nous faites pas confiance pour envoyer ces frais, merci de ne pas nous contacter : il n'y a pas d'autre moyen.</b><span>Merci pour votre compréhension 🙏</span></div>
    </div></section>`;
  }
  function bindCountry(){ const s = $('cSel'); if (s) s.onchange = () => { touched = true; setCountry(s.value); }; }

  /* ---------- Accueil ---------- */
  function renderHome(){
    document.body.className = 'home';
    const avail = D.pays.filter(p => D.produits.some(x => x.prix[p.code]));
    if (!country || !avail.some(p => p.code === country)) country = pickCountry(avail);
    const prods = D.produits.filter(x => x.prix[country]);
    const autres = D.produits.filter(x => !x.prix[country] && Object.keys(x.prix).length);
    document.title = R('Nom de la boutique') || 'Boutique';
    const pays = D.pays.find(p => p.code === country) || {};
    app.innerHTML = `<div class="wrap">${header(avail)}
      <div class="hero"><h1>Nos produits</h1><p>Livraison et paiement à la réception.</p></div>
      ${prods.length ? `<div class="grid">${prods.map(x => {
        const o = x.prix[country].offres[0];
        const off = o.ancien > o.prix ? Math.round((1 - o.prix/o.ancien)*100) : 0;
        return `<a class="card" href="${QS}p=${encodeURIComponent(x.id)}">
          <img src="${esc(imgM(x.photos[0] || ''))}" alt="${esc(x.nom)}" loading="lazy">
          <div class="ci">${off?`<span class="badge">−${off} %</span>`:''}<div class="cn">${esc(x.nom)}</div>
          ${o.ancien > o.prix ? `<div class="co">${money(o.ancien, x.prix[country].devise || pays.devise)}</div>` : ''}
          <div class="cp">${money(o.prix, x.prix[country].devise || pays.devise)}</div></div></a>`;
      }).join('')}</div>` : (autres.length ? `<div class="grid">${autres.map(x => { const c = Object.keys(x.prix)[0], pp = D.pays.find(p => p.code === c) || {}, o = x.prix[c].offres[0];
          return `<a class="card" href="${QS}p=${encodeURIComponent(x.id)}"><img src="${esc(imgM(x.photos[0] || ''))}" alt="${esc(x.nom)}" loading="lazy"><div class="ci"><div class="cn">${esc(x.nom)}</div><div class="cp">${money(o.prix, pp.devise)}</div></div></a>`; }).join('')}</div>` : `<div class="empty">Aucun produit disponible pour le moment.</div>`)}
      ${trust()}
      <footer>© ${new Date().getFullYear()} ${esc(R('Nom de la boutique'))}</footer></div>`;
    bindCountry();
  }

  /* ---------- Stock en direct : 3 → 2 → 1 (une pièce de moins à chaque vente affichée), retour à 3 chaque minute ---------- */
  const STK = {n: 3, dec: Date.now() - 3000, alerte: 0, on: false};
  function stkPeindre(){
    const el = $('stk'); if (!el) return;
    const n = STK.n;
    $('stkBar').style.width = (n / 3 * 100) + '%';
    el.classList.toggle('last', n === 1);
    $('stkTxt').innerHTML = n === 1 ? '<b>DERNIÈRE PIÈCE</b> disponible !' : 'Plus que <b id="stkN">' + n + '</b> en stock';
    const sub = $('stkSub'); if (sub){ sub.dataset.d = sub.dataset.d || sub.textContent; sub.textContent = n === 1 ? 'Après celle-ci, il faudra attendre le prochain arrivage.' : sub.dataset.d; }
  }
  function stkMoins(){
    if (!$('stk')) return;
    const t = Date.now();
    if (STK.n === 3){ STK.n = 2; STK.dec = t; stkPeindre(); }
    else if (STK.n === 2 && t - STK.dec >= 240000){ STK.n = 1; STK.dec = t; stkPeindre(); stkUrgence(); }   // la dernière pièce : 4 min après l'avant-dernière
  }
  function stkUrgence(){
    if (!$('stk') || Date.now() - STK.alerte < 120000) return;
    const ae = document.activeElement; if (ae && /INPUT|TEXTAREA|SELECT/.test(ae.tagName)) return;   // jamais pendant la saisie
    STK.alerte = Date.now();
    let u = document.querySelector('.urg'); if (!u){ u = document.createElement('div'); u.className = 'urg'; u.setAttribute('role', 'alert'); document.body.appendChild(u); }
    u.innerHTML = `<div class="ui">⚡</div><div class="ut"><b>Plus qu'UNE seule pièce en stock !</b><span>Commandez maintenant ou vous risquez de le regretter.</span></div><a href="#commande" class="ub">Je la prends</a><button type="button" class="ux" aria-label="Fermer">×</button>`;
    u.querySelector('.ux').onclick = () => u.classList.remove('on');
    u.querySelector('.ub').onclick = () => u.classList.remove('on');
    requestAnimationFrame(() => u.classList.add('on'));
    clearTimeout(STK.tu); STK.tu = setTimeout(() => u.classList.remove('on'), 7000);
  }
  function stkDemarrer(){
    if (STK.on) return; STK.on = true;
    setInterval(() => {
      if (!$('stk')) return;
      const t = Date.now();
      if (STK.n === 1 && t - STK.dec >= 60000){ STK.n = 3; STK.dec = t; stkPeindre(); return; }   // réassort 1 min après la dernière pièce
      if (STK.n === 3 && t - STK.dec >= 8600) stkMoins();   // si aucune notification de vente n'a été affichée
      if (STK.n === 2 && t - STK.dec >= 240000) stkMoins();
    }, 1000);
  }

      ${P.faq.length ? `<section><h2>Questions fréquentes</h2>${P.faq.map(f=>`<details><summary>${esc(f.q)}</summary><p>${esc(f.r)}</p></details>`).join('')}</section>` : ''}

      sl.addEventListener('scroll', () => { const i = Math.round(sl.scrollLeft / (sl.children[0].getBoundingClientRect().width || 1)); [...th.children].forEach((b, k) => b.classList.toggle('on', k === i)); }, {passive: true});

  function slider(el, dots, auto){
    if (!el) return;
    const n = el.children.length;
    const idx = () => {
      const c = el.children[0]; if (!c) return 0;
      const step = c.getBoundingClientRect().width + (parseFloat(getComputedStyle(el).columnGap) || 0);
      return Math.round(el.scrollLeft / step);
    };
    if (dots) el.addEventListener('scroll', () => { const i = idx(); [...dots.children].forEach((d,k)=>d.classList.toggle('on', k===i)); }, {passive:true});
    if (auto && n > 1 && !matchMedia('(prefers-reduced-motion: reduce)').matches){
      let paused = false;
      ['touchstart','pointerdown','mouseenter'].forEach(ev => el.addEventListener(ev, () => paused = true, {passive:true}));
      const timer = setInterval(() => {
        if (!el.isConnected){ clearInterval(timer); return; }
        if (paused || document.hidden || !el.children[0]) return;
        const i = (idx() + 1) % n;
        el.scrollTo({left: el.children[i].offsetLeft - el.children[0].offsetLeft, behavior:'smooth'});
      }, 4500);
    }
  }

  function bindForm(P, pays, px){
    const promo = Number(px.promoJour) || 0;
    const dev = pays.devise;
    const form = $('form');
    const state = () => {
      const o = px.offres.find(x => x.key === form.querySelector('input[name=offre]:checked').value);
      const today = form.querySelector('input[name=jour]:checked').value === 'today';
      const disc = today ? promo : 0;
      return {o, today, disc, total: Math.max(0, o.prix - disc)};
    };
    const update = () => {
      const s = state();
      $('tOff').textContent = s.o.label;
      $('tDay').textContent = (s.today ? "Aujourd'hui" : 'Demain') + ', ' + $('slot').value;
      $('tPromoRow').style.display = s.disc ? 'flex' : 'none';
      $('tPromo').textContent = '−' + money(s.disc, dev);
      $('tTotal').textContent = money(s.total, dev);
    };
    form.addEventListener('change', update);
    const villeVal = () => { const v = $('ville').value; return v === '__autre' ? $('villeAutre').value.trim() : v; };
    $('ville').addEventListener('change', () => { $('fAutre').classList.toggle('hidden', $('ville').value !== '__autre'); if ($('ville').value === '__autre') $('villeAutre').focus(); });
    /* Formulaire abandonné : on garde le numéro si la personne ne valide pas */
    let abTimer = null, abSent = '', ordered = false;
    const abData = () => {
      const s = state();
      return {type:'abandon', produit: P.id, pays: pays.code, offre: s.o.key, nom: $('nom').value.trim(),
        tel: $('tel').value.trim(), ville: villeVal(), adresse: $('adr').value.trim(), page: location.href.split('#')[0], attrib: attribution()};
    };
    const abReady = () => !ordered && !dejaPour(P.id) && $('tel').value.replace(/\D/g,'').length >= 8;
    const abSend = (beacon) => {
      if (!abReady()) return;
      const body = JSON.stringify(abData());
      if (body === abSent) return;
      abSent = body;
      try {
        if (beacon && navigator.sendBeacon) navigator.sendBeacon(API, new Blob([avecB(body)], {type:'text/plain'}));
        else fetch(API, {method:'POST', body: avecB(body), keepalive:true}).catch(()=>{});
      } catch(x){}
    };
    const abLater = () => { clearTimeout(abTimer); abTimer = setTimeout(() => abSend(false), 4000); };
    form.addEventListener('input', abLater);
    form.addEventListener('change', abLater);
    const abNow = () => { clearTimeout(abTimer); abSend(true); };
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') abNow(); });
    window.addEventListener('pagehide', abNow);
    form.__markOrdered = () => { ordered = true; clearTimeout(abTimer); brouillon(false); rappel(); };
    form.__unmarkOrdered = () => { ordered = false; abSent = ''; rappel(); };
    /* Rappel « validez votre commande » : dès que le client a commencé à remplir, et brouillon gardé sur son téléphone */
    const K_BR = 'brouillon_' + (BQ || '') + '_' + P.id;
    const commence = () => ($('nom').value.trim().length >= 2 || $('tel').value.replace(/\D/g,'').length >= 6 || $('adr').value.trim().length >= 3);
    const rappel = () => {
      const on = !ordered && !dejaPour(P.id) && commence();
      const v = $('valider'); if (v) v.hidden = !on;
      const st = $('sticky'); if (st) st.classList.toggle('brou', on);
      const c = $('stCta'); if (c) c.textContent = on ? 'Valider ma commande' : 'Je commande';
    };
    function brouillon(garder){ try { if (garder && commence() && !ordered) localStorage.setItem(K_BR, JSON.stringify({t: Date.now(), f: saveForm()})); else if (!garder) localStorage.removeItem(K_BR); } catch(x){} }
    form.addEventListener('input', () => { rappel(); brouillon(true); });
    form.addEventListener('change', () => { rappel(); brouillon(true); });
    if (!dejaPour(P.id)){
      try {
        const b = JSON.parse(localStorage.getItem(K_BR) || 'null');
        if (b && b.f && Date.now() - b.t < 7 * 864e5 && !$('nom').value && !$('tel').value){
          restoreForm(b.f); update();
          const bn = document.createElement('div'); bn.className = 'retour';
          bn.innerHTML = `<b>👋 Vous n'avez pas terminé votre commande.</b><span>Vos informations sont gardées : il ne reste qu'à la valider.</span><a href="#commande">Valider ma commande →</a>`;
          const pt = document.querySelector('.ptop'); if (pt) pt.parentNode.insertBefore(bn, pt);
        }
      } catch(x){}
    } else brouillon(false);
    rappel();

    form.addEventListener('input', () => {
      touched = true;
      if (!checkoutSent){
        checkoutSent = true;
        const s = state(), cur = pays.codeDevise || undefined;
        try { if (window.fbq) fbq('track', 'InitiateCheckout', {value: s.total, currency: cur, content_ids: [P.id], content_type: 'product'}); } catch(x){}
        try { if (window.ttq) ttq.track('InitiateCheckout', {value: s.total, currency: cur, content_id: P.id, content_type: 'product'}); } catch(x){}
      }
    });
    update();

    if ('IntersectionObserver' in window){
      new IntersectionObserver(e => { const st = $('sticky'); if (st) st.classList.toggle('hide', e[0].isIntersecting); }, {threshold:.05}).observe($('commande'));
    }
    pixels();
    if (!window.__vc){ window.__vc = 1;
    try { if (window.fbq) fbq('track', 'ViewContent', {value: px.offres[0].prix, currency: pays.codeDevise || undefined, content_ids: [P.id], content_name: P.nom, content_type: 'product'}); } catch(x){}
    try { if (window.ttq) ttq.track('ViewContent', {value: px.offres[0].prix, currency: pays.codeDevise || undefined, content_id: P.id, content_name: P.nom, content_type: 'product'}); } catch(x){}
    }

    const bad = (id, b) => { $(id).classList.toggle('bad', b); return b; };
    let sending = false;
    form.addEventListener('submit', async e => {
      e.preventDefault();
      if (sending) return;
      const nom = $('nom').value.trim(), tel = $('tel').value.trim(), adr = $('adr').value.trim();
      const ville = villeVal();
      const b = [bad('fVille', ville.length < 2), bad('fAdr', adr.length < 3), bad('fNom', nom.length < 2), bad('fTel', tel.replace(/\D/g,'').length < 8), bad('fOk', !$('ok').checked)];
      if (b.some(Boolean)){ document.querySelector('.field.bad').scrollIntoView({behavior:'smooth', block:'center'}); return; }
      const s = state();
      const btn = $('sendBtn'), err = $('sendErr');
      let prev = null; try { prev = (JSON.parse(store.get(K_CMD) || '{}') || {})[P.id] || null; } catch(x){}
      form.__markOrdered();
      sending = true; btn.disabled = true; btn.textContent = 'Envoi en cours…'; err.style.display = 'none';
      const payload = {produit: P.id, pays: pays.code, offre: s.o.key, nom, tel, ville, adresse: adr,
        jour: s.today ? 'today' : 'tomorrow', moment: $('slot').value, page: location.href.split('#')[0], attrib: attribution(), deja: prev && prev.numero ? prev.numero : ''};
      // Affichage immédiat de la confirmation : le client n'attend pas
      const modeMerci = !/whatsapp/i.test(R('Après la commande (MERCI = page de remerciement / WHATSAPP = le client envoie sur WhatsApp)'));
      const garde = saveForm();
      if (modeMerci) merci({numero: '', produit: P.nom, offre: s.o.label, livraison: (s.today ? "Aujourd'hui" : 'Demain') + ', ' + $('slot').value,
        adresse: ville + ' – ' + adr, total: s.total, devise: dev, tel: '+' + pays.indicatif + ' ' + tel, nom}, P);
      const retour = () => { if (modeMerci){ render(); restoreForm(garde); const f = $('form'); if (f) f.__markOrdered && f.__unmarkOrdered && f.__unmarkOrdered(); $('commande').scrollIntoView({block:'start'}); } };
      let r = null;
      for (let tries = 0; tries < 2 && !(r && r.ok); tries++){
        try {
          const res = await fetch(API, {method:'POST', body: avecB(JSON.stringify(payload))});
          r = await res.json();
        } catch(x){ r = null; }
      }
      sending = false; btn.disabled = false; btn.textContent = 'Je commande maintenant';
      if (r && r.doublon){ memo(P.id, r.numero); retour(); dejaCommande(r.numero, r.whatsapp); return; }
      if (r && r.bloque){ retour(); const er = $('sendErr'); er.textContent = r.erreur; er.style.display = 'block'; return; }
      if (!r || !r.ok){
        form.__unmarkOrdered(); retour();
        const err = $('sendErr');
        const msg = `Nouvelle commande (non numérotée)\nPays : ${pays.nom}\nProduit : ${P.nom}\nOffre : ${s.o.label}\nNom : ${nom}\nNuméro : +${pays.indicatif} ${tel}\nAdresse de la livraison : ${ville} – ${adr}\nLe prix à payer : ${money(s.total, dev)}\nHeure de la livraison : ${(s.today ? "Aujourd'hui" : 'Demain')}, ${$('slot').value}`;
        const wa = (pays.whatsapp || R('WhatsApp des commandes')).replace(/\D/g,'');
        err.innerHTML = `${esc(r && r.erreur ? r.erreur : 'Connexion difficile.')} Réessayez.<a href="https://wa.me/${wa}?text=${encodeURIComponent(msg)}">Ou commandez directement sur WhatsApp →</a>`;
        err.style.display = 'block';
        return;
      }
      const msg =
`Commande confirmée ✅ n°${r.numero}
Pays : ${r.pays}
Produit : ${r.produit}
Offre : ${r.offre}
Nom : ${r.nom}
Numéro : ${r.tel}
Adresse de la livraison : ${r.adresse}
Le prix à payer : ${money(r.total, r.devise)}${r.remise ? ' (promo appliquée)' : ''}
Heure de la livraison : ${r.livraison}`;
      const url = 'https://wa.me/' + r.whatsapp + '?text=' + encodeURIComponent(msg);
      const cur = pays.codeDevise || undefined;
      const evId = 'cmd-' + r.numero, digits = String(r.tel).replace(/\D/g, '');
      try { if (window.fbq){
        // Correspondance avancée manuelle : Meta reconnaît mieux l'acheteur (données hachées par Meta dans le navigateur)
        const mots = String(r.nom || '').trim().toLowerCase().split(/\s+/), am = {ph: digits, fn: mots[0] || '', ln: mots.length > 1 ? mots[mots.length - 1] : '', country: String(pays.code || '').toLowerCase(), external_id: digits};
        Object.keys(am).forEach(k => { if (!am[k]) delete am[k]; });
        try { localStorage.setItem('fb_am', JSON.stringify(am)); } catch(x){}
        fbq('init', R('Pixel Facebook (ID)'), am);
        fbq('track', 'Purchase', {value: r.total, currency: cur, content_ids: [P.id], content_type: 'product', num_items: r.qte}, {eventID: evId});
      } } catch(x){}
      try { if (window.ttq){
        sha256('+' + digits).then(h => { try { if (h) ttq.identify({phone_number: h}); } catch(e){}
          ttq.track('CompletePayment', {value: r.total, currency: cur, contents: [{content_id: P.id, quantity: r.qte}], content_type: 'product'}, {event_id: evId}); });
      } } catch(x){}
      memo(P.id, r.numero);
      try { if (!APERCU){ etape = 'achat'; beacon('ping'); } } catch(x){}
      // Lance tout de suite les notifications (WhatsApp, email, application) et l'envoi aux agences
      try { const bd = avecB(JSON.stringify({type: 'apres', numero: r.numero})); if (navigator.sendBeacon) navigator.sendBeacon(API, new Blob([bd], {type: 'text/plain'})); else fetch(API, {method: 'POST', body: bd, keepalive: true}); } catch(x){}
      if (modeMerci){ const n = $('numCmd'); if (n) n.textContent = r.numero; else merci(r, P); return; }
      $('mNum').textContent = r.numero;
      $('waLink').href = url;
      $('overlay').classList.add('show');
      form.reset(); update();
      setTimeout(() => { location.href = url; }, 1800);
    });
  }

  function merci(r, P){
    const st = $('sticky'); if (st) st.remove();
    document.body.classList.remove('has-sticky');
    const prenom = String(r.nom || '').split(/\s+/)[0];
    app.innerHTML = `<div class="wrap">${header([])}
      <div class="thanks"><div class="big">✅</div>
        <h1>Merci${prenom ? ' ' + esc(prenom) : ''} !</h1>
        <p class="lead">Votre commande de <b>${esc(r.produit)}</b> a bien été envoyée.</p>
        <p class="num">Commande n°<span id="numCmd">${r.numero ? esc(r.numero) : '…'}</span></p>
        <div class="ticket">
          <div class="row"><span>Produit</span><span>${esc(r.produit)}</span></div>
          <div class="row"><span>Offre</span><span>${esc(r.offre)}</span></div>
          <div class="row"><span>Livraison</span><span>${esc(r.livraison)}</span></div>
          <div class="row"><span>Adresse</span><span>${esc(r.adresse)}</span></div>
          <div class="row total"><span>À payer à la livraison</span><span>${money(r.total, r.devise)}</span></div>
        </div>
        <div class="call">📞 Notre équipe va vous appeler <b>dans les 24h</b> au <b>${esc(r.tel)}</b> pour la livraison. Gardez votre téléphone près de vous.</div>
        <a class="cta" href="./?c=${esc(country || '')}">Voir nos autres produits</a>
      </div>
      ${trust()}
      <footer>© ${new Date().getFullYear()} ${esc(R('Nom de la boutique'))}</footer></div>`;
    scrollTo({top: 0});
  }

  function oui(v){ return /^(oui|yes|o|1|true|vrai)$/i.test(String(v || '').trim()); }
  function memo(id, num){ try { const m = JSON.parse(store.get(K_CMD) || '{}') || {}; m[id] = {numero: num}; store.set(K_CMD, JSON.stringify(m)); } catch(e){} }
  function dejaPour(id){ try { return !!(JSON.parse(store.get(K_CMD) || '{}') || {})[id]; } catch(e){ return false; } }
  function dejaCommande(num, wa){
    const msg = `Bonjour, j'ai déjà passé la commande n°${num}. `;
    $('form').innerHTML = `<div class="done"><div class="big">📦</div><h3>Vous avez déjà une commande (n°${esc(num)})</h3>
      <p>Vous avez déjà commandé ce produit. Notre équipe va vous appeler pour la confirmer : gardez votre téléphone près de vous.</p>
      <a class="wa" href="https://wa.me/${esc(wa)}?text=${encodeURIComponent(msg)}">Une question ? Écrivez-nous</a></div>`;
    $('commande').scrollIntoView({behavior:'smooth', block:'start'});
  }

  const APERCU = params.get('apercu') === '1';
  function pixels(){
    if (APERCU) return;
    if (pixelsOn) return;
    const fb = R('Pixel Facebook (ID)'), tt = R('Pixel TikTok (ID)');
    if (!fb && !tt) return;
    pixelsOn = true;
    if (fb){
      !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,document,'script','https://connect.facebook.net/en_US/fbevents.js');
      let am = {}; try { am = JSON.parse(localStorage.getItem('fb_am') || '{}') || {}; } catch(x){}
      fbq('init', fb, am); fbq('track', 'PageView');
    }
    if (tt){
      !function(w,d,t){w.TiktokAnalyticsObject=t;var ttq=w[t]=w[t]||[];ttq.methods=["page","track","identify","instances","debug","on","off","once","ready","alias","group","enableCookie","disableCookie"];ttq.setAndDefer=function(t,e){t[e]=function(){t.push([e].concat(Array.prototype.slice.call(arguments,0)))}};for(var i=0;i<ttq.methods.length;i++)ttq.setAndDefer(ttq,ttq.methods[i]);ttq.instance=function(t){for(var e=ttq._i[t]||[],n=0;n<ttq.methods.length;n++)ttq.setAndDefer(e,ttq.methods[n]);return e};ttq.load=function(e,n){var i="https://analytics.tiktok.com/i18n/pixel/events.js";ttq._i=ttq._i||{};ttq._i[e]=[];ttq._i[e]._u=i;ttq._t=ttq._t||{};ttq._t[e]=+new Date;ttq._o=ttq._o||{};ttq._o[e]=n||{};var o=d.createElement("script");o.type="text/javascript";o.async=!0;o.src=i+"?sdkid="+e+"&lib="+t;var a=d.getElementsByTagName("script")[0];a.parentNode.insertBefore(o,a)};ttq.load(tt);ttq.page()}(window,document,'ttq');
    }
  }

  async function sha256(t){
    try { const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2,'0')).join(''); }
    catch(e){ return ''; }
  }

  /* ---------- Rendu ---------- */
  function render(){
    if (!D) return;
    const c = R('Couleur principale'); if (/^#[0-9a-f]{3,8}$/i.test(c)) document.documentElement.style.setProperty('--main', c);
    if (pid){
      const P = D.produits.find(x => x.id === pid);
      if (!P && !liveDone){
        // Produit tout neuf : pas encore dans la copie rapide, on attend les données en direct
        document.body.className = 'prod';
        app.innerHTML = `<div class="wrap">${header([])}<div class="empty">Chargement du produit…</div></div>`;
        return;
      }
      if (!P){
        document.body.className = 'prod';
        app.innerHTML = `<div class="wrap">${header([])}<div class="empty">Ce produit n'existe pas ou n'est plus disponible.<br><br><a href="${ACCUEIL}" style="color:var(--main);font-weight:700">Voir tous nos produits</a></div></div>`;
        return;
      }
      renderProduct(P);
    } else renderHome();
    if (!pid) pixels();
  }

  /* ---------- Visites et visiteurs en direct ---------- */
  let sid = '', etape = '', GEO = null;
  // Position approximative du visiteur (ville), comme Shopify : service gratuit, gardée 12 h
  try { const g = JSON.parse(store.get('geo') || 'null'); if (g && Date.now() - g.t < 432e5) GEO = g; } catch(e){}
  function lieuEnvoye(){ try { return sessionStorage.getItem('lieu') === '1'; } catch(e){ return true; } }
  async function chercherLieu(){
    if (GEO) return;
    const essai = async (u, f) => { const c = new AbortController(); const t = setTimeout(() => c.abort(), 4000);
      try { const r = await fetch(u, {signal: c.signal}); return f(await r.json()); } finally { clearTimeout(t); } };
    let g = null;
    try { g = await essai('https://get.geojs.io/v1/ip/geo.json', j => ({v: j.city || '', r: j.region || '', p: j.country || '', cc: j.country_code || '', la: +j.latitude, lo: +j.longitude})); } catch(e){}
    if (!g || !isFinite(g.la)){ try { g = await essai('https://ipwho.is/', j => j.success === false ? null : ({v: j.city || '', r: j.region || '', p: j.country || '', cc: j.country_code || '', la: +j.latitude, lo: +j.longitude})); } catch(e){} }
    if (!g || !isFinite(g.la) || !isFinite(g.lo)) return;
    g.t = Date.now(); GEO = g; try { store.set('geo', JSON.stringify(g)); } catch(e){}
    if (!lieuEnvoye()) beacon('ping');
  }
  function beacon(type){
    try {
      if (!sid){ sid = sessionStorage.getItem('sid') || (Date.now().toString(36) + Math.random().toString(36).slice(2, 8)); sessionStorage.setItem('sid', sid); }
    } catch(e){ if (!sid) sid = Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
    const ttUrl = params.get('tt') || '';
    let ttCode = ttUrl;
    if (!ttCode){ try { const a = JSON.parse(store.get('attrib') || '{}') || {}; if (a.tt && a.t && Date.now() - a.t < 7*864e5) ttCode = a.tt; } catch(e){} }
    const o = {type, sid, produit: pid, pays: country || '', tt: ttCode.slice(0, 20), ttNew: type === 'visite' && ttUrl ? 1 : 0, et: etape || (pid ? 'produit' : '')};
    if (GEO){ o.g = [Math.round(GEO.la * 100) / 100, Math.round(GEO.lo * 100) / 100, String(GEO.v).slice(0, 40), String(GEO.r).slice(0, 50), String(GEO.p).slice(0, 40), String(GEO.cc).slice(0, 3)];
      if (type !== 'quitte' && !lieuEnvoye()){ o.lieu = 1; try { sessionStorage.setItem('lieu', '1'); } catch(e){} } }
    const body = JSON.stringify(o);
    try {
      if (navigator.sendBeacon) navigator.sendBeacon(API, new Blob([avecB(body)], {type:'text/plain'}));
      else fetch(API, {method:'POST', body: avecB(body), keepalive:true}).catch(()=>{});
    } catch(e){}
  }
  function startTracking(){
    let first = true;
    try { first = !sessionStorage.getItem('vu'); sessionStorage.setItem('vu', '1'); } catch(e){}
    beacon(first ? 'visite' : 'ping');
    chercherLieu();
    // Étape « au paiement » dès que le client commence à remplir le formulaire
    document.addEventListener('focusin', e => { if (etape !== 'paiement' && etape !== 'achat' && e.target.closest && e.target.closest('form') && e.target.matches('#nom,#tel,#ville,#adr,#villeAutre')){ etape = 'paiement'; beacon('ping'); } });
    setInterval(() => { if (document.visibilityState === 'visible') beacon('ping'); }, 40000);
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') beacon('ping'); });
    window.addEventListener('pagehide', () => beacon('quitte'));
  }

  // Sécurité : un produit sans prix pour un pays actif reprend le prix d'un pays de même monnaie
  function completerPrix(d){
    const dev = {}; (d.pays || []).forEach(p => dev[p.code] = p.codeDevise || p.devise);
    const FCFA = {BJ:'XOF',BF:'XOF',CI:'XOF',ML:'XOF',NE:'XOF',SN:'XOF',TG:'XOF',GW:'XOF',CM:'XAF',CF:'XAF',CG:'XAF',GA:'XAF',GQ:'XAF',TD:'XAF'};
    const devDe = c => dev[c] || FCFA[c] || c;
    (d.produits || []).forEach(x => {
      x.prix = x.prix || {}; const codes = Object.keys(x.prix); if (!codes.length) return;
      (d.pays || []).forEach(p => { if (x.prix[p.code]) return; const src = codes.find(c => devDe(c) === devDe(p.code)); if (src) x.prix[p.code] = x.prix[src]; });
    });
  }
  let liveDone = false;
  async function load(){
    if (!/^https:\/\/script\.google(usercontent)?\.com\//.test(API)){
      app.innerHTML = '<div class="empty">⚠️ Colle l\'URL de ton Application Web Google Apps Script dans la ligne <b>const API</b> en haut du fichier index.html.</div>';
      return;
    }
    const same = (a, b) => JSON.stringify({...a, maj:0, imgs:0}) === JSON.stringify({...b, maj:0, imgs:0});
    let shown = false, ready = null;
    const imagesPage = d => {
      const urls = [];
      if (pid){
        const P = d.produits.find(x => x.id === pid);
        if (P && P.photos[0]) urls.push(P.photos[0]);
      } else d.produits.slice(0, 2).forEach(x => x.photos[0] && urls.push(x.photos[0]));
      return urls.map(imgM);
    };
    const precharger = (urls, ms) => Promise.race([
      Promise.all(urls.map(u => new Promise(ok => { const i = new Image(); i.onload = i.onerror = ok; i.src = u; if (i.decode) i.decode().then(ok, ok); }))),
      new Promise(ok => setTimeout(ok, ms))]);
    const use = (fresh, save) => {
      if (fresh && fresh.indisponible){ indispo = true; D = null; try { localStorage.removeItem(K_DATA); } catch(e){} app.innerHTML = '<div class="empty">Cette boutique est momentanément indisponible.</div>'; return; }
      if (!fresh || !fresh.produits) return;
      completerPrix(fresh);
      if (fresh.imgs){ Object.assign(IMG, fresh.imgs); try { localStorage.setItem('imgs', JSON.stringify(IMG)); } catch(e){} }
      if (fresh.imgsM){ Object.assign(IMGM, fresh.imgsM); try { localStorage.setItem('imgsM', JSON.stringify(IMGM)); } catch(e){} }
      if (save) store.set(K_DATA, JSON.stringify(fresh));
      if (D && same(D, fresh)) return;
      const first = !D; D = fresh;
      if (first) ready = precharger(imagesPage(D), 1200).then(() => { shown = true; render(); });
      else if (shown && !touched) render();
    };
    const cached = store.get(K_DATA);
    if (cached){ try { use(JSON.parse(cached)); } catch(e){} }
    // 1) copie rapide hébergée avec le site  2) données en direct du Google Sheets
    let liveOk = false, indispo = false;
    const fichier = VID ? 'data/v-' + VID + (BQ ? '-' + BQ : '') + '.json' : BQ ? 'data/' + BQ + '.json' : 'data.json';
    const snap = fetch(fichier, {cache: 'no-cache'}).then(r => r.ok ? r.json() : null).then(j => { if (!j && VID) indispo = true; if (!liveOk) use(j); }).catch(() => {});
    const live = fetch(API + (API.includes('?') ? '&' : '?') + (VID ? 'v=' + VID + '&' : '') + (BQ ? 'b=' + BQ + '&' : '') + 't=' + Date.now()).then(r => r.json()).then(j => { liveOk = true; use(j, true); }).catch(() => {})
      .finally(() => { liveDone = true; if (D && shown && pid && !D.produits.some(x => x.id === pid)) render(); });
    await Promise.race([live, snap.then(() => D ? null : live)]);
    if (!D) await live;
    if (ready) await ready;
    if (indispo && liveOk && !(D && D.produits)) D = null;
    if (!D) app.innerHTML = '<div class="empty">' + (indispo ? 'Cette boutique est momentanément indisponible.' : 'Impossible de charger la boutique. Vérifiez votre connexion et actualisez la page.') + '</div>';
  }
  // Toutes les 8 secondes : une vraie commande récente (« Awa K. vient de commander… »)
  function preuvesVentes(){
    const L = () => (D && D.preuves || []).filter(p => Date.now() - p.t < 21 * 864e5);
    if (document.querySelector('.preuve')) return;   // les ventes peuvent arriver après (données en direct) : on vérifie à chaque fois
    const el = document.createElement('div'); el.className = 'preuve'; el.setAttribute('role', 'status'); document.body.appendChild(el);
    const ilya = t => { const m = Math.max(1, Math.round((Date.now() - t) / 6e4)); return m < 60 ? 'il y a ' + m + ' min' : m < 1440 ? 'il y a ' + Math.round(m / 60) + ' h' : 'il y a ' + Math.round(m / 1440) + ' j'; };
    let i = 0;
    const montrer = () => {
      const l = L(); if (!l.length) return;
      const ae = document.activeElement;
      if (ae && /INPUT|TEXTAREA|SELECT/.test(ae.tagName)) return;   // jamais pendant que le client remplit le formulaire
      const p = l[i++ % l.length], prod = D.produits.find(x => x.nom === p.produit);
      el.innerHTML = `${prod && prod.photos[0] ? `<img src="${esc(imgM(prod.photos[0]))}" alt="">` : ''}<div><b>${esc(p.nom)}</b> ${p.livree ? 'a reçu sa commande' : 'a commandé'} <b>${esc((t => t.length > 34 ? t.slice(0, 32).trim() + '…' : t)(prod ? prod.nom : p.produit))}</b><small>${p.livree ? '<span class="ok">✔ Livré</span> · ' : ''}${ilya(p.t)}</small></div>`;
      el.classList.add('on'); setTimeout(() => el.classList.remove('on'), 5000);
      stkMoins();
    };
    setTimeout(() => { montrer(); setInterval(montrer, 8000); }, 5000);
  }
  load().then(() => { if (D && !APERCU){ startTracking(); preuvesVentes(); } });
})();
</script>
