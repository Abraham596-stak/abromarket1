<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boutique</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;700&display=swap" rel="stylesheet">
<script>
/* =====================================================================

   « Application Web » Google Apps Script (elle finit par /exec)
   ===================================================================== */
const API = "https://script.google.com/macros/s/AKfycbxMiEkA1C6NWCarUM113Z4cEegevDjFkNSgfJY05BJ2XmqHoUftEBw5BIRUkJ8DBFQp/exec";
</script>
<style>
:root{--main:#1736A6;--sun:#FFC93C;--ink:#141A2E;--soft:#5A6178;--line:#E3E6EF;--bg:#FFFFFF;--surface:#F3F5FB;--ok:#128C4A;--err:#C62828}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:var(--bg);line-height:1.55;font-size:16px}
body.has-sticky{padding-bottom:84px}
h1,h2,h3{font-family:"Bricolage Grotesque","Figtree",system-ui,sans-serif;line-height:1.12;letter-spacing:-.01em}
img{max-width:100%;display:block}
a{color:inherit}
.wrap{max-width:560px;margin:0 auto;background:var(--bg);min-height:100vh}
.home .wrap{max-width:960px}
.topbar{background:var(--main);color:#fff;text-align:center;font-size:14px;font-weight:500;padding:9px 16px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:15}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font:800 20px "Bricolage Grotesque",sans-serif;color:var(--main);min-width:0}
.brand img{height:34px;width:auto}
.brand span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.country{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--soft)}
.country select{border:2px solid var(--line);border-radius:10px;padding:7px 8px;font:600 14px "Figtree",sans-serif;background:#fff;color:var(--ink);max-width:150px}

/* Accueil */
.hero{padding:26px 16px 6px}
.hero h1{font-size:28px;font-weight:800}
.hero p{color:var(--soft);margin-top:6px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:16px}
@media(min-width:700px){.grid{grid-template-columns:repeat(3,1fr);gap:18px}}
.card{text-decoration:none;border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;background:#fff;transition:transform .15s,box-shadow .15s}
.card:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(20,26,46,.08)}
.card img{aspect-ratio:1/1;object-fit:cover;width:100%;background:var(--surface)}
.card .ci{padding:10px 12px 14px;display:flex;flex-direction:column;gap:4px;flex:1}
.card .cn{font-weight:700;font-size:15px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .cp{font:800 18px "Bricolage Grotesque",sans-serif;color:var(--main);margin-top:auto}
.card .co{color:var(--soft);text-decoration:line-through;font-size:13px}
.card .badge{align-self:flex-start;background:var(--sun);border-radius:999px;font-size:12px;font-weight:700;padding:2px 8px}
.empty{padding:40px 20px;text-align:center;color:var(--soft)}

/* Produit */
.gallery{position:relative;background:var(--surface)}
.slides{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.slides::-webkit-scrollbar{display:none}
.slides img{flex:0 0 100%;width:100%;aspect-ratio:1/1;object-fit:cover;scroll-snap-align:center}
.dots{display:flex;gap:6px;justify-content:center;padding:10px 0 0}
.dots span{width:8px;height:8px;border-radius:50%;background:var(--line);transition:background .2s}
.dots span.on{background:var(--main)}
.intro{padding:18px 18px 4px}
.intro h1{font-size:28px;font-weight:800}
.intro p{color:var(--soft);margin-top:8px;font-size:17px}
.stars{color:#E9A300;font-size:15px;margin-top:8px}
.stars small{color:var(--soft);margin-left:6px}
.pricetag{margin:16px 18px 0;background:var(--sun);border-radius:18px;padding:16px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;position:relative}
.pricetag::before{content:"";position:absolute;left:-7px;top:50%;width:14px;height:14px;margin-top:-7px;background:var(--bg);border-radius:50%}
.pricetag .now{font-family:"Bricolage Grotesque",sans-serif;font-size:32px;font-weight:800;line-height:1}
.pricetag .old{text-decoration:line-through;color:#6B5A1E;font-size:15px;margin-top:4px}
.pricetag .off{background:var(--ink);color:#fff;font-weight:700;border-radius:999px;padding:6px 12px;font-size:15px;white-space:nowrap}
.stock{margin:12px 18px 0;font-size:15px;color:var(--err);font-weight:600}
.unavail{margin:16px 18px;background:var(--surface);border-radius:14px;padding:16px;font-weight:600}
section{padding:26px 18px;border-top:1px solid var(--line)}
section h2{font-size:23px;font-weight:800;margin-bottom:14px}
.rich p{font-size:17px;margin-bottom:14px}
.rich h3{font-size:20px;margin:6px 0 10px}
.rich img{width:100%;border-radius:14px;margin:4px 0 16px;background:var(--surface)}
.perks{list-style:none;display:grid;gap:12px;margin-top:6px}
.perks li{display:flex;gap:12px;align-items:flex-start;font-size:17px}
.perks li::before{content:"✓";flex:0 0 26px;height:26px;border-radius:50%;background:var(--main);color:#fff;display:grid;place-items:center;font-weight:700;font-size:14px;margin-top:1px}
.box{margin-top:18px;background:var(--surface);border-radius:12px;padding:14px 16px}
.box h3{font-size:16px;margin-bottom:6px}
.box ul{padding-left:20px}
details{border-bottom:1px solid var(--line);padding:14px 0}
summary{font-weight:700;cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:10px}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";font-size:22px;line-height:1;color:var(--main)}
details[open] summary::after{content:"−"}
details p{color:var(--soft);margin-top:8px}

/* Avis */
.reviews{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;margin:0 -18px;padding:0 18px 4px}
.reviews::-webkit-scrollbar{display:none}
.review{flex:0 0 86%;scroll-snap-align:center;background:var(--surface);border-radius:16px;padding:16px}
.review .rs{color:#E9A300}
.review p{margin:8px 0}
.review .who{font-weight:700}
.review img{border-radius:10px;margin-top:8px;max-height:220px;object-fit:cover;width:100%}
.rdots{display:flex;gap:6px;justify-content:center;margin-top:12px}
.rdots span{width:7px;height:7px;border-radius:50%;background:var(--line)}
.rdots span.on{background:var(--main)}

/* Garanties */
.trust{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.trust div{background:var(--surface);border-radius:14px;padding:14px;text-align:center}
.trust .e{font-size:30px;line-height:1}
.trust b{display:block;margin:8px 0 4px;font-size:15px;line-height:1.25}
.trust small{color:var(--soft);font-size:12.5px;line-height:1.4;display:block}

/* Formulaire */
#commande{background:var(--surface);border-top:0;margin-top:18px}
#commande h2{margin-bottom:4px}
#commande .sub{color:var(--soft);margin-bottom:18px}
.field{margin-bottom:18px}
.field>label,.legend{display:block;font-weight:700;margin-bottom:8px}
input[type=tel],input[type=text],textarea,select.in{width:100%;border:2px solid var(--line);border-radius:12px;padding:14px;font:500 17px "Figtree",sans-serif;background:#fff;color:var(--ink)}
textarea{min-height:84px;resize:vertical}
input:focus,textarea:focus,select:focus{border-color:var(--main);outline:none}
.phone{display:flex;align-items:stretch;border:2px solid var(--line);border-radius:12px;background:#fff;overflow:hidden}
.phone span{display:flex;align-items:center;padding:0 12px;background:var(--surface);font-weight:700;border-right:2px solid var(--line)}
.phone input{border:0!important;border-radius:0}
.phone:focus-within{border-color:var(--main)}
.choices{display:grid;gap:10px}
.choice{position:relative}
.choice input{position:absolute;opacity:0;pointer-events:none}
.choice label{display:flex;justify-content:space-between;align-items:center;gap:10px;background:#fff;border:2px solid var(--line);border-radius:12px;padding:14px 16px;cursor:pointer;font-weight:600}
.choice label small{display:block;font-weight:500;color:var(--ok);font-size:14px}
.choice label .p{text-align:right;white-space:nowrap}
.choice label .p b{display:block;font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:19px}
.choice label .p s{color:var(--soft);font-size:13px;font-weight:500}
.choice input:checked+label{border-color:var(--main);box-shadow:inset 0 0 0 1px var(--main)}
.choice input:focus-visible+label,.cta:focus-visible,button:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.confirm{display:flex;gap:12px;align-items:flex-start;background:#fff;border:2px solid var(--line);border-radius:12px;padding:14px 16px;cursor:pointer;font-weight:700}
.confirm input{width:24px;height:24px;accent-color:var(--main);flex:0 0 24px;margin-top:1px}
.error{color:var(--err);font-size:14px;font-weight:600;margin-top:6px;display:none}
.field.bad .error{display:block}
.field.bad input,.field.bad textarea,.field.bad .confirm,.field.bad .phone{border-color:var(--err)}
.ticket{background:#fff;border:2px dashed var(--main);border-radius:14px;padding:16px;margin:6px 0 16px}
.ticket .row{display:flex;justify-content:space-between;gap:12px;padding:4px 0}
.ticket .row span:first-child{color:var(--soft)}
.ticket .row span:last-child{text-align:right;font-weight:600}
.ticket .total{border-top:2px dashed var(--line);margin-top:8px;padding-top:10px}
.ticket .total span:last-child{font-family:"Bricolage Grotesque",sans-serif;font-size:24px;font-weight:800;color:var(--main)}
.cta{display:block;width:100%;background:var(--main);color:#fff;border:0;border-radius:14px;padding:18px;font:700 19px "Figtree",sans-serif;text-align:center;text-decoration:none;cursor:pointer}
.cta[disabled]{opacity:.7;cursor:wait}
.reassure{text-align:center;color:var(--soft);font-size:14px;margin-top:10px}
.senderr{display:none;background:#FDECEC;color:var(--err);border-radius:12px;padding:12px;margin-top:12px;font-weight:600;text-align:center}
.senderr a{display:block;margin-top:6px;color:var(--ink)}
footer{text-align:center;color:var(--soft);font-size:13px;padding:24px 18px 30px;border-top:1px solid var(--line)}
footer a{display:inline-block;margin-bottom:10px;font-weight:700;color:var(--main)}
.sticky{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 14px;display:flex;gap:12px;align-items:center;z-index:20;transition:transform .25s}
.sticky.hide{transform:translateY(110%)}
.sticky .sp{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:20px;white-space:nowrap}
.sticky .cta{flex:1;padding:14px;font-size:17px}
.overlay{position:fixed;inset:0;background:rgba(20,26,46,.6);display:none;align-items:center;justify-content:center;padding:20px;z-index:50}
.overlay.show{display:flex}
.modal{background:#fff;border-radius:18px;padding:24px 20px;max-width:400px;width:100%;text-align:center}
.modal .big{font-size:44px}
.modal h3{font-size:22px;margin:8px 0}
.modal p{color:var(--soft);margin-bottom:16px}
.wa{display:block;background:#25D366;color:#fff;text-decoration:none;border-radius:12px;padding:16px;font-weight:700;font-size:17px}
.done{background:#fff;border-radius:16px;padding:22px 18px;text-align:center}
.done .big{font-size:42px}
.done h3{font-size:20px;margin:8px 0}
.done p{color:var(--soft);margin-bottom:16px}
.loading{padding:60px 20px;text-align:center;color:var(--soft)}
.spin{width:34px;height:34px;border:4px solid var(--line);border-top-color:var(--main);border-radius:50%;margin:0 auto 14px;animation:s 1s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important;animation:none!important}}
@media (min-width:600px){.prod .wrap{border-left:1px solid var(--line);border-right:1px solid var(--line)}.sticky{max-width:560px;margin:0 auto}}
</style>
</head>
<body>
<div id="app"><div class="loading"><div class="spin"></div>Chargement…</div></div>

<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="mTitle">
  <div class="modal">
    <div class="big">✅</div>
    <h3 id="mTitle">Commande n°<span id="mNum"></span> enregistrée</h3>
    <p>WhatsApp va s'ouvrir. Appuyez sur <b>Envoyer</b> pour nous transmettre votre commande.</p>
    <a class="wa" id="waLink" href="#">Envoyer ma commande sur WhatsApp</a>
  </div>
</div>

<script>
(function(){
  const $ = id => document.getElementById(id);
  const app = $('app');
  const params = new URLSearchParams(location.search);
  const pid = (params.get('p') || '').trim().toLowerCase();
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const store = {
    get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
    set(k,v){ try { localStorage.setItem(k,v); } catch(e){} }
  };
  let D = null, country = null, touched = false, pixelsOn = false, checkoutSent = false;

  /* ---------- Origine du client (quelle pub) ---------- */
  const ATT_KEYS = ['utm_source','utm_campaign','utm_term','utm_content','fbclid','ttclid'];
  (function saveAttribution(){
    const fresh = {}; ATT_KEYS.forEach(k => { const v = params.get(k); if (v) fresh[k] = v.slice(0, 200); });
    if (Object.keys(fresh).length){ fresh.t = Date.now(); store.set('attrib', JSON.stringify(fresh)); }
  })();
  function attribution(){
    let a = {};
    try { a = JSON.parse(store.get('attrib') || '{}') || {}; } catch(e){}
    if (a.t && Date.now() - a.t > 7*864e5) a = {};
    const ck = n => { const m = document.cookie.match('(?:^|; )' + n + '=([^;]*)'); return m ? decodeURIComponent(m[1]) : ''; };
    a.fbp = ck('_fbp'); a.fbc = ck('_fbc') || (a.fbclid ? 'fb.1.' + (a.t || Date.now()) + '.' + a.fbclid : '');
    a.ttp = ck('_ttp'); a.ua = navigator.userAgent.slice(0, 300);
    delete a.t;
    return a;
  }

  /* ---------- Outils ---------- */
  function money(n, dev){
    const v = Number(n) || 0;
    const s = v.toLocaleString('fr-FR', {maximumFractionDigits: 2}).replace(/[  ]/g, ' ');
    return s + ' ' + (dev || '');
  }
  function img(u){
    u = String(u || '').trim();
    const m = u.match(/drive\.google\.com\/(?:file\/d\/|open\?id=|uc\?(?:export=\w+&)?id=)([\w-]{20,})/);
    if (m) return 'https://drive.google.com/thumbnail?id=' + m[1] + '&sz=w1200';
    return u;
  }
  const isUrl = s => /^https?:\/\/\S+$/i.test(s);
  function rich(t){
    return String(t || '').split(/\r?\n|\s*\|\s*/).map(l => l.trim()).filter(Boolean).map(l => {
      if (isUrl(l)) return `<img src="${esc(img(l))}" alt="" loading="lazy">`;
      if (/^##\s*/.test(l)) return `<h3>${esc(l.replace(/^##\s*/, ''))}</h3>`;
      return `<p>${esc(l).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')}</p>`;
    }).join('');
  }
  const R = k => (D && D.reglages && D.reglages[k]) || '';

  const TZ = {'Africa/Porto-Novo':'BJ','Africa/Ouagadougou':'BF','Africa/Bujumbura':'BI','Africa/Douala':'CM','Africa/Bangui':'CF','Indian/Comoro':'KM','Africa/Brazzaville':'CG','Africa/Kinshasa':'CD','Africa/Lubumbashi':'CD','Africa/Abidjan':'CI','Africa/Djibouti':'DJ','Africa/Libreville':'GA','Africa/Conakry':'GN','Africa/Malabo':'GQ','Indian/Antananarivo':'MG','Africa/Bamako':'ML','Africa/Nouakchott':'MR','Africa/Niamey':'NE','Africa/Kigali':'RW','Africa/Dakar':'SN','Africa/Ndjamena':'TD','Africa/Lome':'TG','Africa/Casablanca':'MA','Africa/Algiers':'DZ','Africa/Tunis':'TN','Indian/Mauritius':'MU','Indian/Mahe':'SC'};

  function pickCountry(allowed){
    const codes = allowed.map(p => p.code);
    const cand = [(params.get('c') || '').toUpperCase(), store.get('pays')];
    try { cand.push(TZ[Intl.DateTimeFormat().resolvedOptions().timeZone]); } catch(e){}
    for (const c of cand) if (c && codes.includes(c)) return c;
    return codes[0] || null;
  }
  function setCountry(c){
    country = c; store.set('pays', c);
    const u = new URL(location.href); u.searchParams.set('c', c);
    history.replaceState(null, '', u);
    render();
  }
  function countrySelect(list){
    if (!list.length) return '';
    return `<label class="country">🌍 <select id="cSel" aria-label="Votre pays">${list.map(p => `<option value="${esc(p.code)}" ${p.code===country?'selected':''}>${esc(p.nom)}</option>`).join('')}</select></label>`;
  }
  function header(list){
    const logo = R('Logo (lien image, optionnel)');
    const name = R('Nom de la boutique') || 'Boutique';
    return `<div class="topbar">${esc(R('Bandeau du haut'))}</div>
      <header><a class="brand" href="./${country?'?c='+esc(country):''}">${logo?`<img src="${esc(img(logo))}" alt="">`:''}<span>${esc(name)}</span></a>${countrySelect(list)}</header>`;
  }
  function trust(){
    let h = '';
    for (let i = 1; i <= 4; i++){
      const t = R(`Garantie ${i} – titre`); if (!t) continue;
      h += `<div><div class="e">${esc(R(`Garantie ${i} – emoji`))}</div><b>${esc(t)}</b><small>${esc(R(`Garantie ${i} – texte`))}</small></div>`;
    }
    return h ? `<section><h2>Nos garanties</h2><div class="trust">${h}</div></section>` : '';
  }
  function bindCountry(){ const s = $('cSel'); if (s) s.onchange = () => setCountry(s.value); }

  /* ---------- Accueil ---------- */
  function renderHome(){
    document.body.className = 'home';
    const avail = D.pays.filter(p => D.produits.some(x => x.prix[p.code]));
    if (!country || !avail.some(p => p.code === country)) country = pickCountry(avail);
    const prods = D.produits.filter(x => x.prix[country]);
    document.title = R('Nom de la boutique') || 'Boutique';
    const pays = D.pays.find(p => p.code === country) || {};
    app.innerHTML = `<div class="wrap">${header(avail)}
      <div class="hero"><h1>Nos produits</h1><p>Livraison et paiement à la réception${pays.nom ? ' – ' + esc(pays.nom) : ''}.</p></div>
      ${prods.length ? `<div class="grid">${prods.map(x => {
        const o = x.prix[country].offres[0];
        const off = o.ancien > o.prix ? Math.round((1 - o.prix/o.ancien)*100) : 0;
        return `<a class="card" href="?p=${encodeURIComponent(x.id)}&c=${esc(country)}">
          <img src="${esc(img(x.photos[0] || ''))}" alt="${esc(x.nom)}" loading="lazy">
          <div class="ci">${off?`<span class="badge">−${off} %</span>`:''}<div class="cn">${esc(x.nom)}</div>
          ${o.ancien > o.prix ? `<div class="co">${money(o.ancien, pays.devise)}</div>` : ''}
          <div class="cp">${money(o.prix, pays.devise)}</div></div></a>`;
      }).join('')}</div>` : `<div class="empty">Aucun produit disponible pour ce pays pour le moment.</div>`}
      ${trust()}
      <footer>© ${new Date().getFullYear()} ${esc(R('Nom de la boutique'))}</footer></div>`;
    bindCountry();
  }

  /* ---------- Page produit ---------- */
  function renderProduct(P){
    document.body.className = 'prod has-sticky';
    const avail = D.pays.filter(p => P.prix[p.code]);
    if (!country || !avail.some(p => p.code === country)) country = pickCountry(avail);
    const pays = D.pays.find(p => p.code === country);
    const px = pays && P.prix[country];
    document.title = P.nom + ' | ' + (R('Nom de la boutique') || 'Boutique');
    const photos = P.photos.length ? P.photos : [''];
    const o1 = px ? px.offres[0] : null;
    const dev = pays ? pays.devise : '';

    let priceBlock = '', form = '';
    if (px){
      const off = o1.ancien > o1.prix ? Math.round((1 - o1.prix/o1.ancien)*100) : 0;
      priceBlock = `<div class="pricetag"><div><div class="now">${money(o1.prix, dev)}</div>${off?`<div class="old">${money(o1.ancien, dev)}</div>`:''}</div>${off?`<div class="off">−${off} %</div>`:''}</div>
        ${P.stock ? `<p class="stock">Plus que ${esc(P.stock)} pièces en stock</p>` : ''}`;
      const promo = Number(px.promoJour) || 0;
      form = `<section id="commande"><h2>Passer ma commande</h2><p class="sub">Remplissez ce formulaire, ça prend moins d'une minute.</p>
        <form id="form" novalidate>
          <div class="field"><span class="legend">Choisissez votre offre</span><div class="choices">
            ${px.offres.map((o,i) => {
              const save = o.ancien > o.prix ? o.ancien - o.prix : 0;
              return `<div class="choice"><input type="radio" name="offre" id="o${i}" value="${esc(o.key)}" ${i?'':'checked'}>
                <label for="o${i}"><span>${esc(o.label)}${save && o.qte > 1 ? `<small>Vous économisez ${money(save, dev)}</small>` : ''}</span>
                <span class="p"><b>${money(o.prix, dev)}</b>${o.ancien > o.prix ? `<s>${money(o.ancien, dev)}</s>` : ''}</span></label></div>`;
            }).join('')}</div></div>
          <div class="field" id="fNom"><label for="nom">Votre nom</label><input type="text" id="nom" autocomplete="name" placeholder="Nom et prénom">
            <div class="error">Indiquez votre nom.</div></div>
          <div class="field" id="fTel"><label for="tel">Votre numéro de téléphone (WhatsApp de préférence)</label>
            <div class="phone"><span>+${esc(pays.indicatif)}</span><input type="tel" id="tel" inputmode="tel" autocomplete="tel" placeholder="Votre numéro"></div>
            <div class="error">Entrez un numéro valide pour qu'on puisse vous appeler.</div></div>
          <div class="field" id="fAdr"><label for="adr">Adresse exacte de livraison</label>
            <textarea id="adr" placeholder="Ville, quartier, rue, repère (ex : à côté de la pharmacie…)"></textarea>
            <div class="error">Précisez votre ville et votre adresse pour que le livreur vous trouve.</div></div>
          <div class="field"><span class="legend">Quand voulez-vous être livré ?</span><div class="choices">
            <div class="choice"><input type="radio" name="jour" id="j0" value="today" checked><label for="j0"><span>Aujourd'hui${promo?`<small>Promo : −${money(promo, dev)}</small>`:''}</span></label></div>
            <div class="choice"><input type="radio" name="jour" id="j1" value="tomorrow"><label for="j1"><span>Demain</span></label></div></div></div>
          <div class="field"><label for="slot">Moment de la journée</label>
            <select class="in" id="slot"><option value="dès que possible">Dès que possible</option><option value="le matin">Le matin (8h – 12h)</option><option value="l'après-midi">L'après-midi (12h – 16h)</option><option value="le soir">Le soir (16h – 20h)</option></select></div>
          <div class="field" id="fOk"><label class="confirm"><input type="checkbox" id="ok"> Je veux vraiment ce produit et je serai disponible à la livraison</label>
            <div class="error">Cochez cette case pour confirmer votre commande.</div></div>
          <div class="ticket" aria-live="polite">
            <div class="row"><span>Offre</span><span id="tOff"></span></div>
            <div class="row"><span>Livraison</span><span id="tDay"></span></div>
            <div class="row" id="tPromoRow"><span>Promo livraison du jour</span><span id="tPromo"></span></div>
            <div class="row total"><span>À payer à la livraison</span><span id="tTotal"></span></div></div>
          <button type="submit" class="cta" id="sendBtn">Je commande maintenant</button>
          <p class="reassure">Aucun paiement en ligne. Vous payez au livreur.</p>
          <div class="senderr" id="sendErr"></div>
        </form></section>`;
    } else {
      priceBlock = `<div class="unavail">Ce produit n'est pas encore disponible dans votre pays.</div>`;
    }

    const desc = P.description || P.avantages.length || P.boite.length;
    const nAvis = P.avis.length;
    app.innerHTML = `<div class="wrap">${header(avail)}
      <div class="gallery"><div class="slides" id="slides">${photos.map((s,i)=>`<img src="${esc(img(s))}" alt="${esc(P.nom)} photo ${i+1}" ${i?'loading="lazy"':''}>`).join('')}</div></div>
      ${photos.length > 1 ? `<div class="dots" id="dots">${photos.map((_,i)=>`<span class="${i?'':'on'}"></span>`).join('')}</div>` : ''}
      <div class="intro"><h1>${esc(P.nom)}</h1>${P.accroche?`<p>${esc(P.accroche)}</p>`:''}
        ${nAvis ? `<div class="stars">★★★★★<small>(${nAvis} avis)</small></div>` : ''}</div>
      ${priceBlock}
      ${form}
      ${desc ? `<section><h2>Description</h2><div class="rich">${rich(P.description)}</div>
        ${P.avantages.length ? `<ul class="perks">${P.avantages.map(a=>`<li>${esc(a)}</li>`).join('')}</ul>` : ''}
        ${P.boite.length ? `<div class="box"><h3>Dans la boîte</h3><ul>${P.boite.map(a=>`<li>${esc(a)}</li>`).join('')}</ul></div>` : ''}</section>` : ''}
      ${nAvis ? `<section><h2>Ils l'ont déjà reçu</h2><div class="reviews" id="revs">${P.avis.map(a=>`<div class="review"><div class="rs">${'★'.repeat(a.note)}${'☆'.repeat(5-a.note)}</div><p>${esc(a.texte)}</p><div class="who">${esc(a.nom)}</div>${a.photo?`<img src="${esc(img(a.photo))}" alt="" loading="lazy">`:''}</div>`).join('')}</div>
        ${nAvis > 1 ? `<div class="rdots" id="rdots">${P.avis.map((_,i)=>`<span class="${i?'':'on'}"></span>`).join('')}</div>` : ''}</section>` : ''}
      ${P.faq.length ? `<section><h2>Questions fréquentes</h2>${P.faq.map(f=>`<details><summary>${esc(f.q)}</summary><p>${esc(f.r)}</p></details>`).join('')}</section>` : ''}
      ${trust()}
      <footer><a href="./?c=${esc(country||'')}">← Voir tous nos produits</a><br>© ${new Date().getFullYear()} ${esc(R('Nom de la boutique'))}</footer></div>
      ${px ? `<div class="sticky" id="sticky"><div class="sp">${money(o1.prix, dev)}</div><a href="#commande" class="cta">Je commande</a></div>` : ''}`;

    bindCountry();
    slider($('slides'), $('dots'), false);
    slider($('revs'), $('rdots'), true);
    if (px) bindForm(P, pays, px);
  }

  function slider(el, dots, auto){
    if (!el) return;
    const n = el.children.length;
    const idx = () => {
      const c = el.children[0]; if (!c) return 0;
      const step = c.getBoundingClientRect().width + (parseFloat(getComputedStyle(el).columnGap) || 0);
      return Math.round(el.scrollLeft / step);
    };
    if (dots) el.addEventListener('scroll', () => { const i = idx(); [...dots.children].forEach((d,k)=>d.classList.toggle('on', k===i)); }, {passive:true});
    if (auto && n > 1 && !matchMedia('(prefers-reduced-motion: reduce)').matches){
      let paused = false;
      ['touchstart','pointerdown','mouseenter'].forEach(ev => el.addEventListener(ev, () => paused = true, {passive:true}));
      setInterval(() => {
        if (paused || document.hidden) return;
        const i = (idx() + 1) % n;
        el.scrollTo({left: el.children[i].offsetLeft - el.children[0].offsetLeft, behavior:'smooth'});
      }, 4500);
    }
  }

  function bindForm(P, pays, px){
    const promo = Number(px.promoJour) || 0;
    const dev = pays.devise;
    const form = $('form');
    const state = () => {
      const o = px.offres.find(x => x.key === form.querySelector('input[name=offre]:checked').value);
      const today = form.querySelector('input[name=jour]:checked').value === 'today';
      const disc = today ? promo : 0;
      return {o, today, disc, total: Math.max(0, o.prix - disc)};
    };
    const update = () => {
      const s = state();
      $('tOff').textContent = s.o.label;
      $('tDay').textContent = (s.today ? "Aujourd'hui" : 'Demain') + ', ' + $('slot').value;
      $('tPromoRow').style.display = s.disc ? 'flex' : 'none';
      $('tPromo').textContent = '−' + money(s.disc, dev);
      $('tTotal').textContent = money(s.total, dev);
    };
    form.addEventListener('change', update);
    /* Formulaire abandonné : on garde le numéro si la personne ne valide pas */
    let abTimer = null, abSent = '', ordered = false;
    const abData = () => {
      const s = state();
      return {type:'abandon', produit: P.id, pays: pays.code, offre: s.o.key, nom: $('nom').value.trim(),
        tel: $('tel').value.trim(), adresse: $('adr').value.trim(), page: location.href.split('#')[0], attrib: attribution()};
    };
    const abReady = () => !ordered && !store.get('commande') && $('tel').value.replace(/\D/g,'').length >= 8;
    const abSend = (beacon) => {
      if (!abReady()) return;
      const body = JSON.stringify(abData());
      if (body === abSent) return;
      abSent = body;
      try {
        if (beacon && navigator.sendBeacon) navigator.sendBeacon(API, new Blob([body], {type:'text/plain'}));
        else fetch(API, {method:'POST', body, keepalive:true}).catch(()=>{});
      } catch(x){}
    };
    const abLater = () => { clearTimeout(abTimer); abTimer = setTimeout(() => abSend(false), 4000); };
    form.addEventListener('input', abLater);
    form.addEventListener('change', abLater);
    const abNow = () => { clearTimeout(abTimer); abSend(true); };
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') abNow(); });
    window.addEventListener('pagehide', abNow);
    form.__markOrdered = () => { ordered = true; clearTimeout(abTimer); };
    form.__unmarkOrdered = () => { ordered = false; abSent = ''; };

    form.addEventListener('input', () => {
      touched = true;
      if (!checkoutSent){
        checkoutSent = true;
        const s = state(), cur = pays.codeDevise || undefined;
        try { if (window.fbq) fbq('track', 'InitiateCheckout', {value: s.total, currency: cur, content_ids: [P.id], content_type: 'product'}); } catch(x){}
        try { if (window.ttq) ttq.track('InitiateCheckout', {value: s.total, currency: cur, content_id: P.id, content_type: 'product'}); } catch(x){}
      }
    });
    update();

    if ('IntersectionObserver' in window){
      new IntersectionObserver(e => { const st = $('sticky'); if (st) st.classList.toggle('hide', e[0].isIntersecting); }, {threshold:.05}).observe($('commande'));
    }
    pixels();
    if (!window.__vc){ window.__vc = 1;
    try { if (window.fbq) fbq('track', 'ViewContent', {value: px.offres[0].prix, currency: pays.codeDevise || undefined, content_ids: [P.id], content_name: P.nom, content_type: 'product'}); } catch(x){}
    try { if (window.ttq) ttq.track('ViewContent', {value: px.offres[0].prix, currency: pays.codeDevise || undefined, content_id: P.id, content_name: P.nom, content_type: 'product'}); } catch(x){}
    }

    const bad = (id, b) => { $(id).classList.toggle('bad', b); return b; };
    let sending = false;
    form.addEventListener('submit', async e => {
      e.preventDefault();
      if (sending) return;
      const nom = $('nom').value.trim(), tel = $('tel').value.trim(), adr = $('adr').value.trim();
      const b = [bad('fNom', nom.length < 2), bad('fTel', tel.replace(/\D/g,'').length < 8), bad('fAdr', adr.length < 5), bad('fOk', !$('ok').checked)];
      if (b.some(Boolean)){ document.querySelector('.field.bad').scrollIntoView({behavior:'smooth', block:'center'}); return; }
      const s = state();
      const btn = $('sendBtn'), err = $('sendErr');
      let prev = null; try { prev = JSON.parse(store.get('commande') || 'null'); } catch(x){}
      if (prev && prev.numero && !oui(R('Nouvelle commande permise si la précédente est livrée (OUI/NON)'))){
        dejaCommande(prev.numero, (pays.whatsapp || R('WhatsApp des commandes')).replace(/\D/g,'')); return;
      }
      form.__markOrdered();
      sending = true; btn.disabled = true; btn.textContent = 'Envoi en cours…'; err.style.display = 'none';
      const payload = {produit: P.id, pays: pays.code, offre: s.o.key, nom, tel, adresse: adr,
        jour: s.today ? 'today' : 'tomorrow', moment: $('slot').value, page: location.href.split('#')[0], attrib: attribution()};
      let r = null;
      for (let tries = 0; tries < 2 && !(r && r.ok); tries++){
        try {
          const res = await fetch(API, {method:'POST', body: JSON.stringify(payload)});
          r = await res.json();
        } catch(x){ r = null; }
      }
      sending = false; btn.disabled = false; btn.textContent = 'Je commande maintenant';
      if (r && r.doublon){ store.set('commande', JSON.stringify({numero: r.numero})); dejaCommande(r.numero, r.whatsapp); return; }
      if (r && r.bloque){ err.textContent = r.erreur; err.style.display = 'block'; return; }
      if (!r || !r.ok){
        form.__unmarkOrdered();
        const msg = `Nouvelle commande (non numérotée)\nPays : ${pays.nom}\nProduit : ${P.nom}\nOffre : ${s.o.label}\nNom : ${nom}\nNuméro : +${pays.indicatif} ${tel}\nAdresse de la livraison : ${adr}\nLe prix à payer : ${money(s.total, dev)}\nHeure de la livraison : ${(s.today ? "Aujourd'hui" : 'Demain')}, ${$('slot').value}`;
        const wa = (pays.whatsapp || R('WhatsApp des commandes')).replace(/\D/g,'');
        err.innerHTML = `${esc(r && r.erreur ? r.erreur : 'Connexion difficile.')} Réessayez.<a href="https://wa.me/${wa}?text=${encodeURIComponent(msg)}">Ou commandez directement sur WhatsApp →</a>`;
        err.style.display = 'block';
        return;
      }
      const msg =
`Commande confirmée ✅ n°${r.numero}
Pays : ${r.pays}
Produit : ${r.produit}
Offre : ${r.offre}
Nom : ${r.nom}
Numéro : ${r.tel}
Adresse de la livraison : ${r.adresse}
Le prix à payer : ${money(r.total, r.devise)}${r.remise ? ' (promo appliquée)' : ''}
Heure de la livraison : ${r.livraison}`;
      const url = 'https://wa.me/' + r.whatsapp + '?text=' + encodeURIComponent(msg);
      const cur = pays.codeDevise || undefined;
      const evId = 'cmd-' + r.numero, digits = String(r.tel).replace(/\D/g, '');
      try { if (window.fbq){
        fbq('init', R('Pixel Facebook (ID)'), {ph: digits, fn: String(r.nom).split(/\s+/)[0].toLowerCase(), country: pays.code.toLowerCase()});
        fbq('track', 'Purchase', {value: r.total, currency: cur, content_ids: [P.id], content_type: 'product', num_items: r.qte}, {eventID: evId});
      } } catch(x){}
      try { if (window.ttq){
        sha256('+' + digits).then(h => { try { if (h) ttq.identify({phone_number: h}); } catch(e){}
          ttq.track('CompletePayment', {value: r.total, currency: cur, contents: [{content_id: P.id, quantity: r.qte}], content_type: 'product'}, {event_id: evId}); });
      } } catch(x){}
      store.set('commande', JSON.stringify({numero: r.numero}));
      $('mNum').textContent = r.numero;
      $('waLink').href = url;
      $('overlay').classList.add('show');
      form.reset(); update();
      setTimeout(() => { location.href = url; }, 1800);
    });
  }

  function oui(v){ return /^(oui|yes|o|1|true|vrai)$/i.test(String(v || '').trim()); }
  function dejaCommande(num, wa){
    const msg = `Bonjour, j'ai déjà passé la commande n°${num}. `;
    $('form').innerHTML = `<div class="done"><div class="big">📦</div><h3>Vous avez déjà une commande (n°${esc(num)})</h3>
      <p>Une seule commande par personne. Notre équipe va vous appeler pour la confirmer : gardez votre téléphone près de vous.</p>
      <a class="wa" href="https://wa.me/${esc(wa)}?text=${encodeURIComponent(msg)}">Une question ? Écrivez-nous</a></div>`;
    $('commande').scrollIntoView({behavior:'smooth', block:'start'});
  }

  function pixels(){
    if (pixelsOn) return; pixelsOn = true;
    const fb = R('Pixel Facebook (ID)'), tt = R('Pixel TikTok (ID)');
    if (fb){
      !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,document,'script','https://connect.facebook.net/en_US/fbevents.js');
      fbq('init', fb); fbq('track', 'PageView');
    }
    if (tt){
      !function(w,d,t){w.TiktokAnalyticsObject=t;var ttq=w[t]=w[t]||[];ttq.methods=["page","track","identify","instances","debug","on","off","once","ready","alias","group","enableCookie","disableCookie"];ttq.setAndDefer=function(t,e){t[e]=function(){t.push([e].concat(Array.prototype.slice.call(arguments,0)))}};for(var i=0;i<ttq.methods.length;i++)ttq.setAndDefer(ttq,ttq.methods[i]);ttq.instance=function(t){for(var e=ttq._i[t]||[],n=0;n<ttq.methods.length;n++)ttq.setAndDefer(e,ttq.methods[n]);return e};ttq.load=function(e,n){var i="https://analytics.tiktok.com/i18n/pixel/events.js";ttq._i=ttq._i||{};ttq._i[e]=[];ttq._i[e]._u=i;ttq._t=ttq._t||{};ttq._t[e]=+new Date;ttq._o=ttq._o||{};ttq._o[e]=n||{};var o=d.createElement("script");o.type="text/javascript";o.async=!0;o.src=i+"?sdkid="+e+"&lib="+t;var a=d.getElementsByTagName("script")[0];a.parentNode.insertBefore(o,a)};ttq.load(tt);ttq.page()}(window,document,'ttq');
    }
  }

  async function sha256(t){
    try { const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2,'0')).join(''); }
    catch(e){ return ''; }
  }

  /* ---------- Rendu ---------- */
  function render(){
    if (!D) return;
    const c = R('Couleur principale'); if (/^#[0-9a-f]{3,8}$/i.test(c)) document.documentElement.style.setProperty('--main', c);
    if (pid){
      const P = D.produits.find(x => x.id === pid);
      if (!P){
        document.body.className = 'prod';
        app.innerHTML = `<div class="wrap">${header([])}<div class="empty">Ce produit n'existe pas ou n'est plus disponible.<br><br><a href="./" style="color:var(--main);font-weight:700">Voir tous nos produits</a></div></div>`;
        return;
      }
      renderProduct(P);
    } else renderHome();
    if (!pid) pixels();
  }

  async function load(){
    if (!/^https:\/\/script\.google(usercontent)?\.com\//.test(API)){
      app.innerHTML = '<div class="empty">⚠️ Colle l\'URL de ton Application Web Google Apps Script dans la ligne <b>const API</b> en haut du fichier index.html.</div>';
      return;
    }
    const cached = store.get('data:' + API);
    if (cached){ try { D = JSON.parse(cached); render(); } catch(e){} }
    try {
      const res = await fetch(API + (API.includes('?') ? '&' : '?') + 't=' + Date.now());
      const txt = await res.text();
      const fresh = JSON.parse(txt);
      store.set('data:' + API, txt);
      const changed = !D || JSON.stringify({...D, maj:0}) !== JSON.stringify({...fresh, maj:0});
      D = fresh;
      if (changed && !touched) render();
    } catch(e){
      if (!D) app.innerHTML = '<div class="empty">Impossible de charger la boutique. Vérifiez votre connexion et actualisez la page.</div>';
    }
  }
  load();
})();
</script>
