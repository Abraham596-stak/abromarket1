<script>
const API = "https://script.google.com/macros/s/AKfycbwgdtcXlXB9niD3hactnz4SLIrpY_q74iQQZwkr1vrUBjczfCCVWwamG69uqnUQZsba/exec";
// Vendoo : un abonné ouvre l'application avec ?vendoo=<son id> (gardé sur le téléphone ; ?vendoo=abro = revenir à ABROMARKET)
const VID = (() => { let v = ''; try { const u = new URLSearchParams(location.search).get('vendoo');
  if (u === 'abro') localStorage.removeItem('vendoo_v');
  else if (u && /^[a-f0-9]{10,16}$/.test(u)) localStorage.setItem('vendoo_v', u);
  v = localStorage.getItem('vendoo_v') || ''; } catch(e){} return v; })();
const VENDOO = !!VID;
const SITE = "https://abraham596-stak.github.io/abromarket1/boutique/";
if (VENDOO){
  document.title = 'Vendoo';
  document.querySelector('link[rel=manifest]').href = '../vendoo/manifest.webmanifest';
  const ic = document.querySelector('link[rel=apple-touch-icon]'); if (ic) ic.href = '../vendoo/icon-192.png';
  document.documentElement.classList.add('vendoo');
}
</script>
<style>
:root{
  --deep:#12308F; --main:#2350D8; --sun:#FFC93C; --ink:#141A2E; --soft:#5A6178; --line:#E3E6EF;
  --surface:#F3F5FB; --bg:#FFFFFF; --ok:#12A150; --okbg:#DDF5E7; --err:#C62828; --errbg:#FBE3E3;
  --onDeep:#FFFFFF; --onDeepSoft:rgba(255,255,255,.66);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:var(--deep);font-size:16px;line-height:1.45;overscroll-behavior-y:contain}
h1,h2,h3,.num{font-family:"Bricolage Grotesque","Figtree",system-ui,sans-serif;letter-spacing:-.01em}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.hidden{display:none!important}

/* Connexion */
.login{min-height:100%;display:flex;flex-direction:column;justify-content:center;padding:32px 24px;color:var(--onDeep);max-width:420px;margin:0 auto}
.login .logo{width:72px;height:72px;border-radius:20px;background:var(--sun);display:grid;place-items:center;font:800 34px "Bricolage Grotesque",sans-serif;color:var(--deep);margin-bottom:22px}
.login h1{font-size:32px;line-height:1.1}
.login p{color:var(--onDeepSoft);margin:10px 0 26px}
.login input{width:100%;padding:16px;border-radius:14px;border:2px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);color:#fff;font:600 20px "Figtree",sans-serif;letter-spacing:.2em;text-align:center}
.login input::placeholder{letter-spacing:normal;color:var(--onDeepSoft);font-weight:500;font-size:16px}
.login .btn{margin-top:14px}
.login .err{color:#FFB4B4;margin-top:12px;font-weight:600;min-height:22px}
.btn{display:block;width:100%;padding:16px;border-radius:14px;background:var(--sun);color:var(--deep);font-weight:700;font-size:17px;text-align:center}
.btn.blue{background:var(--main);color:#fff}
.btn.ghost{background:var(--surface);color:var(--ink)}

/* En-tête */
.top{color:var(--onDeep);padding:calc(env(safe-area-inset-top) + 14px) 16px 0}
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px}
.avatar{width:44px;height:44px;border-radius:50%;background:var(--sun);color:var(--deep);display:grid;place-items:center;font:800 17px "Bricolage Grotesque",sans-serif}
.store{display:flex;align-items:center;gap:10px;font:800 21px "Bricolage Grotesque",sans-serif}
.store i{width:34px;height:34px;border-radius:10px;background:var(--sun);display:grid;place-items:center;font-style:normal;font-size:18px}
.iconbtn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:20px;background:rgba(255,255,255,.08)}
.iconbtn.off{opacity:.5}

.kpis{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;margin:18px -16px 0;padding:0 16px 4px}
.kpis::-webkit-scrollbar{display:none}
.kpi{flex:0 0 auto;text-align:left;padding:10px 14px;border-radius:16px;border:1px solid transparent;min-width:118px}
.kpi.on{background:rgba(255,255,255,.10);border-color:rgba(255,255,255,.18)}
.kpi small{display:block;color:var(--onDeepSoft);font-size:14px;font-weight:500}
.kpi b{font:800 24px "Bricolage Grotesque",sans-serif;white-space:nowrap}
.kpi .d{font-size:13px;font-weight:700;margin-left:6px}
.up{color:#5BE39B}.down{color:#FF9D9D}
.pulse{position:relative;display:inline-block;width:10px;height:10px;border-radius:50%;background:#5BE39B;margin-right:6px}
.pulse::after{content:"";position:absolute;inset:0;border-radius:50%;background:#5BE39B;animation:p 1.8s infinite;will-change:transform,opacity}
@keyframes p{0%{transform:scale(1);opacity:.6}70%,100%{transform:scale(2.6);opacity:0}}
/* Défilement fluide : le navigateur saute ce qui est hors de l'écran */
.order{content-visibility:auto;contain-intrinsic-size:auto 96px}
.ab{content-visibility:auto;contain-intrinsic-size:auto 140px}
.prod{content-visibility:auto;contain-intrinsic-size:auto 120px}
.promo{content-visibility:auto;contain-intrinsic-size:auto 190px}
.nav,.toast,.sync,.savebadge,.vueflot{will-change:transform}
html{-webkit-text-size-adjust:100%}
body{touch-action:manipulation}
button,.btn,.chip,.nav button,.order,.prod{transition:transform .08s ease}
button:active,.btn:active,.chip:active,.order:active,.prod:active{transform:scale(.97)}

.chart{margin-top:10px;height:200px;position:relative}
.chart svg{width:100%;height:100%;display:block;overflow:visible}
.legend{display:flex;gap:16px;font-size:13px;color:var(--onDeepSoft);margin-top:2px}
.legend span::before{content:"";display:inline-block;width:16px;height:3px;border-radius:2px;background:var(--sun);vertical-align:middle;margin-right:6px}
.legend span.p::before{background:repeating-linear-gradient(90deg,rgba(255,255,255,.55) 0 4px,transparent 4px 7px)}
.periods{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:14px 0 22px}
.periods::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:9px 14px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);font-weight:600;font-size:15px;color:var(--onDeep)}
.chip.on{background:var(--sun);color:var(--deep);border-color:var(--sun)}

/* Feuille blanche */
.sheet{background:var(--bg);border-radius:26px 26px 0 0;min-height:60vh;padding:24px 16px calc(110px + env(safe-area-inset-bottom))}
.sheet h2{font-size:26px;line-height:1.15;margin-bottom:16px}
.sheet h2 span{color:var(--soft);font-weight:600}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:22px}
.tile{border:1px solid var(--line);border-radius:18px;padding:14px;text-align:left;background:#fff}
.tile small{color:var(--soft);font-weight:600;font-size:14px;display:block}
.tile b{font:800 24px "Bricolage Grotesque",sans-serif;display:block;margin-top:4px}
.tile.warn b{color:var(--err)}
.tile.yes b{color:var(--ok)}
.block{margin-bottom:24px}
.block h3{font-size:19px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:baseline}
.block h3 button{font:600 14px "Figtree",sans-serif;color:var(--main)}
.livelist{display:grid;gap:8px}
.liverow{display:flex;justify-content:space-between;gap:10px;padding:12px 14px;background:var(--surface);border-radius:14px;font-weight:600}
.empty{color:var(--soft);padding:18px;text-align:center;background:var(--surface);border-radius:14px}
.money{display:flex;flex-direction:column;gap:6px}
.money div{display:flex;justify-content:space-between;padding:10px 14px;background:var(--surface);border-radius:12px;font-weight:600}

/* Commandes */
.page{background:var(--bg);min-height:100vh;padding:calc(env(safe-area-inset-top) + 16px) 16px calc(110px + env(safe-area-inset-bottom))}
.page>h1{font-size:30px;margin-bottom:14px}
.search{width:100%;padding:14px 16px;border-radius:14px;border:0;background:var(--surface);font:500 16px "Figtree",sans-serif;color:var(--ink)}
.filters{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:12px 0}
.filters::-webkit-scrollbar{display:none}
.filters button{flex:0 0 auto;padding:8px 14px;border-radius:999px;font-weight:600;font-size:15px;color:var(--soft)}
.filters button.on{background:var(--surface);color:var(--ink)}
.order{display:block;width:100%;text-align:left;padding:16px 2px;border-bottom:1px solid var(--line)}
.order .l1{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.order .l1 b{font:800 21px "Bricolage Grotesque",sans-serif}
.order .l1 span{font-weight:600;white-space:nowrap}
.order .l2{color:var(--ink);margin:4px 0 8px}
.order .l3{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.daysep{background:var(--surface);color:var(--soft);font-weight:600;font-size:14px;padding:8px 12px;margin:10px -16px 0}
.badge{display:inline-block;padding:4px 10px;border-radius:999px;font-size:14px;font-weight:600;background:#FFF1BF;color:#6B4E00}
.b-Confirmée{background:#DCE6FF;color:#2350D8}.b-Livrée{background:var(--okbg);color:#0B6B35}
.b-À{background:#FFE9B8;color:#7A4B00}.b-Jarrive{background:#E3F2FF;color:#0B4F8A}.b-Nous{background:#F1E6FF;color:#5B2A99}
.b-Ne{background:#ECEDF2;color:#4A5068}.b-Lui{background:#DDF7E6;color:#0B6B35}
.b-Annulée,.b-Retournée{background:var(--errbg);color:#9B1C1C}.b-Injoignable{background:#ECEDF2;color:#4A5068}
.b-En{background:#E9E2FF;color:#4B2BA8}.b-Expédition{background:#FFE6D1;color:#8A3D00}
.tag{font-size:13px;color:var(--soft)}

/* Détail */
.overlay{position:fixed;inset:0;background:rgba(18,48,143,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.detail{background:#fff;width:100%;max-width:560px;border-radius:24px 24px 0 0;padding:20px 18px calc(24px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
.detail .grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 14px}
.detail h2{font-size:26px}
.detail .sub{color:var(--soft);margin-bottom:14px}
.ticket{border:2px dashed var(--main);border-radius:14px;padding:12px 14px;margin:12px 0}
.ticket .row{display:flex;justify-content:space-between;gap:14px;padding:5px 0}
.ticket .row span:first-child{color:var(--soft)}
.ticket .row span:last-child{text-align:right;font-weight:600}
.ticket .total{border-top:2px dashed var(--line);margin-top:6px;padding-top:9px}
.ticket .total span:last-child{font:800 22px "Bricolage Grotesque",sans-serif;color:var(--main)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.actions a{padding:14px;border-radius:14px;text-align:center;font-weight:700}
.a-call{background:var(--surface)}
.a-wa{background:#25D366;color:#fff}
label.lbl{display:block;font-weight:700;margin:14px 0 8px}
select.st{width:100%;padding:14px;border-radius:14px;border:2px solid var(--line);font:600 16px "Figtree",sans-serif;background:#fff;color:var(--ink)}

/* Abandons */
.ab{padding:14px 0;border-bottom:1px solid var(--line)}
.ab .l1{display:flex;justify-content:space-between;gap:10px}
.ab .l1 b{font-weight:700}
.ab p{color:var(--soft);font-size:15px;margin:2px 0 10px}
.ab .row{display:flex;gap:8px}
.ab .row a{flex:1;padding:11px;border-radius:12px;text-align:center;font-weight:700;font-size:15px}

/* Produits */
.prod{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.prod img{width:64px;height:64px;border-radius:12px;object-fit:cover;background:var(--surface);flex:0 0 64px}
.prod .info{flex:1;min-width:0}
.prod .info b{display:block;font-weight:700;line-height:1.3}
.prod .info small{color:var(--soft);display:block;margin:2px 0 8px}
.prod .links{display:flex;gap:8px;flex-wrap:wrap}
.prod .links a,.prod .links button{padding:7px 12px;border-radius:10px;background:var(--surface);font-weight:600;font-size:14px}

/* Réglages */
.set{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:16px 0;border-bottom:1px solid var(--line)}
.set p{color:var(--soft);font-size:14px}
.switch{width:52px;height:32px;border-radius:999px;background:var(--line);position:relative;flex:0 0 52px;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.switch.on{background:var(--ok)}
.switch.on::after{transform:translateX(20px)}
.help{background:var(--surface);border-radius:14px;padding:14px;margin-top:18px;color:var(--soft);font-size:15px}
.help b{color:var(--ink)}

/* Navigation */
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));display:flex;gap:4px;background:#fff;border-radius:999px;padding:6px;box-shadow:0 8px 30px rgba(18,48,143,.22);z-index:30}
.nav button{width:52px;height:50px;border-radius:999px;display:grid;place-items:center;position:relative;color:var(--soft)}
.nav button.on{background:var(--surface);color:var(--deep)}
.nav svg{width:24px;height:24px}
.nav .dot{position:absolute;top:7px;right:12px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--err);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center}

/* Alerte nouvelle commande */
.toast{position:fixed;left:12px;right:12px;top:calc(12px + env(safe-area-inset-top));z-index:60;max-width:520px;margin:0 auto;background:var(--sun);color:var(--deep);border-radius:18px;padding:14px 16px;display:flex;gap:12px;align-items:center;box-shadow:0 10px 30px rgba(18,48,143,.35);animation:drop .35s cubic-bezier(.2,1.4,.4,1)}
@keyframes drop{from{transform:translateY(-120%)}}
.toast .e{font-size:30px}
.toast b{display:block;font:800 18px "Bricolage Grotesque",sans-serif}
.loading{color:var(--onDeepSoft);text-align:center;padding:40px}
.ptr{position:fixed;top:calc(74px + env(safe-area-inset-top));left:50%;z-index:900;width:42px;height:42px;border-radius:50%;background:#fff;color:var(--main);display:grid;place-items:center;box-shadow:0 4px 16px rgba(0,0,0,.18);transform:translate(-50%,-70px);opacity:0;transition:transform .2s ease,opacity .2s ease;pointer-events:none}
.ptr.vu{opacity:1;transform:translate(-50%,0)}
.ptr.tire{transition:none}
.ptr svg{width:22px;height:22px}
.ptr.tourne svg{animation:ptr .7s linear infinite}
@keyframes ptr{to{transform:rotate(360deg)}}
.sync{position:fixed;top:calc(8px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:rgba(255,255,255,.14);color:#fff;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;z-index:20}
.pushban{display:flex;gap:12px;align-items:center;width:100%;text-align:left;margin-top:14px;background:var(--sun);color:var(--deep);border-radius:16px;padding:12px 14px;font-weight:600}
.pushban b{display:block;font-size:15px}
.pushban span{font-size:13px;font-weight:500}
.copy{display:block;width:100%;margin:0 0 12px;padding:13px;border-radius:14px;background:var(--surface);font-weight:700;text-align:center}
.ab .row button{flex:1;padding:11px;border-radius:12px;text-align:center;font-weight:700;font-size:15px;background:var(--surface)}
.refresh{font-size:13px;color:var(--onDeepSoft);text-align:right;margin-top:6px}
/* TikTok */
.tt-top{background:#0B0B10;color:#fff;padding:calc(env(safe-area-inset-top) + 18px) 16px 20px}
.tt-top h1{font-size:28px;display:flex;align-items:center;gap:10px}
.tt-logo{width:36px;height:36px;border-radius:10px;background:#000;display:grid;place-items:center;box-shadow:-2px -2px 0 #25F4EE,2px 2px 0 #FE2C55}
.tt-logo svg{width:20px;height:20px}
.tt-top .sub{color:rgba(255,255,255,.62);font-size:14px;margin-top:4px}
.tt-top .periods{padding:14px 0 16px}
.tt-top .chip.on{background:#FE2C55;border-color:#FE2C55;color:#fff}
.ttsum{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ttsum div{background:rgba(255,255,255,.07);border-radius:16px;padding:12px 14px}
.ttsum small{display:block;color:rgba(255,255,255,.62);font-size:13px;font-weight:600}
.ttsum b{font:800 22px "Bricolage Grotesque",sans-serif;white-space:nowrap}
.ttsum .big{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center}
.btn.tt{background:#FE2C55;color:#fff;margin-top:14px}
.promo{display:block;width:100%;text-align:left;border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px;background:#fff}
.promo .h{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.promo .h b{font-weight:700;font-size:17px;line-height:1.3}
.promo .meta{color:var(--soft);font-size:13px;margin-top:2px}
.pm{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:12px}
.pm small{display:block;color:var(--soft);font-size:12px;font-weight:600;line-height:1.2}
.pm b{font:800 16px "Bricolage Grotesque",sans-serif;white-space:nowrap}
.vd{display:inline-block;padding:4px 10px;border-radius:999px;font-size:13px;font-weight:700;white-space:nowrap}
.v-ok{background:var(--okbg);color:#0B6B35}.v-bad{background:var(--errbg);color:#9B1C1C}.v-mid{background:#FFE6D1;color:#8A3D00}.v-wait{background:#ECEDF2;color:#4A5068}
.st-on{color:#0B6B35;font-weight:700;font-size:13px}.st-wait{color:#B45309;font-weight:700;font-size:13px}
.btn.red{background:var(--errbg);color:#9B1C1C}.st-off{color:var(--soft);font-weight:700;font-size:13px}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.mgrid .tile{padding:12px}
.mgrid .tile b{font-size:20px}
.field{width:100%;padding:14px;border-radius:14px;border:2px solid var(--line);font:600 16px "Figtree",sans-serif;background:#fff;color:var(--ink)}
.frow{display:grid;grid-template-columns:1fr 110px;gap:8px}
.linkbox{background:var(--surface);border-radius:14px;padding:12px 14px;font-size:14px;word-break:break-all;margin:8px 0}
.steps{background:var(--surface);border-radius:14px;padding:14px 14px 14px 32px;color:var(--ink);font-size:15px}
.steps li{margin:4px 0}
.pays{display:flex;flex-wrap:wrap;gap:8px}
.pays label{display:flex;align-items:center;gap:6px;padding:9px 12px;border-radius:999px;border:2px solid var(--line);font-weight:600;font-size:15px;cursor:pointer}
.pays input{width:18px;height:18px;accent-color:#FE2C55}
.pays label:has(input:checked){border-color:#FE2C55;background:#FFF0F3}
.pays label.off{opacity:.45}
.prow{display:flex;justify-content:space-between;align-items:baseline;margin:14px 0 8px}
.prow .lbl{margin:0}
.prow button{font-weight:600;font-size:14px;color:var(--main)}
.usdbox{display:flex;gap:12px;align-items:center;background:var(--surface);border-radius:14px;padding:12px 14px;margin-top:4px}
.usdbox span{font-size:24px}.usdbox b{display:block;font-size:17px}.usdbox small{color:var(--soft);font-size:13px}
/* Plage de dates */
.pdsheet{max-height:86vh}
.pdrow{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:14px 4px}
.pdrow b{display:block;font-size:17px}.pdrow small{display:block;color:var(--soft);font-size:14px}
.pdic{font-size:20px}.pdchev{margin-left:auto;font-size:24px;color:var(--soft)}
.pdfixe{padding:4px 4px 12px}
.pdsep{height:8px;background:var(--surface);margin:4px -18px 4px}
.pdopt{display:flex;align-items:center;gap:14px;padding:15px 4px;border-bottom:1px solid var(--line);font-size:17px;cursor:pointer}
.pdopt input{width:22px;height:22px;accent-color:var(--deep);flex:0 0 22px}
.pdbtn{font-weight:700}
/* Vue en direct (comme Shopify) */
.dv{background:#F1F1F1;min-height:100vh;color:#303030;padding-bottom:calc(120px + env(safe-area-inset-bottom))}
.dvbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:16px;background:#fff;padding:calc(env(safe-area-inset-top) + 12px) 16px 12px}
.dvbar h1{font:700 20px "Figtree",system-ui,sans-serif;color:#303030}
.dvback{width:46px;height:46px;border-radius:50%;background:#EDEDED;font-size:22px;display:grid;place-items:center}
.dvglobe{position:relative;height:min(92vw,470px);background:linear-gradient(#EEF0F2,#F1F1F1);overflow:hidden;contain:strict}
.dvglobe canvas{position:absolute;inset:0;display:block}
#glB{touch-action:pan-y;cursor:grab}
.dvchips{position:absolute;left:16px;top:14px;right:126px;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;z-index:2}
.dvchips::-webkit-scrollbar{display:none}
.dvchip{flex:0 0 auto;display:flex;align-items:center;gap:9px;padding:9px 13px;border-radius:10px;background:rgba(255,255,255,.75);font-size:15px;color:#303030;opacity:.5}
.dvchip.on{opacity:1}
.dvchip i{width:13px;height:13px;border-radius:50%;background:#7B4DF0;box-shadow:0 0 0 3px #E6DDFE}
.dvchip i.pv{border-radius:3px;background:#18A9EE;box-shadow:0 0 0 3px #D3EFFC;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}
.dvmap{position:absolute;right:16px;top:12px;width:46px;height:46px;border-radius:14px;background:#fff;border:1px solid #E3E3E3;display:grid;place-items:center;color:#303030;z-index:2}
.dvmap.on{background:#303030;color:#fff}
.dvbody{padding:0 12px;margin-top:-6px;position:relative;z-index:1}
.dvgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;margin-bottom:8px}
.dvcard{background:#fff;border:1px solid #E3E3E3;border-radius:14px;padding:16px 16px;margin-bottom:8px;box-shadow:0 1px 0 rgba(0,0,0,.04)}
.dvgrid .dvcard{margin:0}
.dvl,.dvt{display:inline-block;font:600 17px "Figtree",system-ui,sans-serif;color:#303030;border-bottom:2px dotted #CCCCCC;padding-bottom:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.dvt{font-size:19px;margin-bottom:12px}
.dvk b{display:block;font:500 20px "Figtree",system-ui,sans-serif;margin-top:8px;color:#303030}
.dvk b .dvd{white-space:nowrap;display:inline-block}
.dvd{font-size:15px;font-weight:600;margin-left:4px}
.dvd.up{color:#0C8A4E}.dvd.down{color:#8E1F0B}
.dvfun{display:grid;grid-template-columns:repeat(3,1fr)}
.dvfun div{padding:0 10px;border-left:1px solid #EBEBEB}
.dvfun div:first-child{padding-left:0;border-left:0}
.dvfun span{display:block;font-size:15px;color:#303030;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dvfun b{display:block;font:500 19px "Figtree",sans-serif;margin-top:6px}
.dvfgraph{display:grid;grid-template-columns:repeat(3,1fr);height:200px;margin-top:20px}
.dvfcol{position:relative;border-left:1px solid #EBEBEB}
.dvfcol:first-child{border-left:0}
.dvfbar{position:absolute;left:0;bottom:0;width:62%;background:#3061E3;border-radius:3px 0 0 0}
.dvftrap{position:absolute;left:62%;bottom:0;width:38%;background:#A9BDF5}
.dvlieu{margin-bottom:14px}
.dvlieu span{display:block;font-size:15px;color:#616161;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dvlrow{display:flex;align-items:center;gap:12px;margin-top:6px}
.dvlrow i{display:block;height:20px;border-radius:3px;background:#13ABEB}
.dvlrow em{font-style:normal;font-size:15px;color:#616161}
.dvleg{display:flex;gap:30px;margin-bottom:16px}
.dvleg span{display:grid;grid-template-columns:auto auto;column-gap:10px;align-items:center;font-size:15px;color:#616161}
.dvleg i{width:12px;height:12px;border-radius:50%}
.dvleg b{grid-column:2;font:500 16px "Figtree",sans-serif;color:#303030;margin-top:4px}
.dvleg i.n,.dvstack i.n{background:#13ABEB}.dvleg i.r,.dvstack i.r{background:#6A3FE6}
.dvstack{display:flex;gap:4px;height:84px;margin:6px 0 4px}
.dvstack i{display:block;min-width:4px;border-radius:2px}
.dvstack i.z{flex:1;background:#EBEBEB}
.dvprod{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:10px;border-radius:10px}
.dvprod:nth-child(even){background:#F7F7F7}
.dvprod img,.dvpi{width:44px;height:44px;border-radius:8px;object-fit:cover;background:#F1F1F1;display:grid;place-items:center}
.dvprod u{font-size:16px;color:#303030;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;text-underline-offset:3px}
.dvprod b{font:600 17px "Figtree",sans-serif;white-space:nowrap}
.dvvide{color:#616161;font-size:15px;padding:6px 0}
.kpi.dvgo{cursor:pointer}
.kpi.dvgo small::after{content:" ›";font-weight:700}
html.ordi .dvglobe{height:460px}
html.ordi .dvbody{max-width:980px;margin-left:auto;margin-right:auto}
html.ordi .dvgrid{grid-template-columns:repeat(4,minmax(0,1fr))}
/* Adresse cliquable → Google Maps */
.maplink{display:flex;flex-direction:column;align-items:flex-end;text-align:right;color:var(--main);font-weight:600;text-decoration:underline;text-underline-offset:3px}
.maplink small{font-size:13px;color:var(--soft);text-decoration:none;margin-top:2px;font-weight:600}
.toast.relance{background:#F26B1D;color:#fff}
/* Logo 3D */
.brandlogo{width:40px;height:40px;border-radius:11px;box-shadow:0 4px 12px rgba(0,0,0,.25);display:block}
.login .logo{background:none;width:88px;height:88px;border-radius:24px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.login .logo img{width:100%;height:100%;display:block}
/* Passer d'une commande à l'autre */
.dnav{display:flex;align-items:center;justify-content:space-between;margin:-4px 0 6px;color:var(--soft);font-weight:600;font-size:14px}
.dnavb{width:44px;height:36px;border-radius:12px;background:var(--surface);font-size:24px;line-height:1;color:var(--ink)}
.dnavb:disabled{opacity:.3}
.detail{transition:transform .15s ease-out;touch-action:pan-y}
.detail.glisse-g{animation:glg .22s ease-out}.detail.glisse-d{animation:gld .22s ease-out}
@keyframes glg{from{transform:translateX(60px);opacity:.3}}@keyframes gld{from{transform:translateX(-60px);opacity:.3}}
/* Relances */
.absec{display:flex;align-items:center;gap:8px;font-size:18px;margin:18px 0 4px}
.absec span{background:var(--surface);border-radius:999px;padding:2px 10px;font-size:14px;color:var(--soft)}
.ab.fait{opacity:.6}
.okrel{color:var(--ok)}
/* Éditeur de description (comme Shopify) */
.rte{border:1.5px solid var(--line);border-radius:14px;overflow:hidden;margin-top:8px;background:#fff}
.rtebar,.rteimg,.rtetab{display:flex;flex-wrap:wrap;align-items:center;gap:2px;padding:6px;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:1}
.rtebar button,.rteimg button,.rtetab button{min-width:36px;height:36px;border-radius:9px;font-size:16px;padding:0 8px}
.rtebar button:active,.rteimg button:active{background:#DDE3F3}
.rtebar select{height:36px;border-radius:9px;border:1px solid var(--line);background:#fff;font:600 14px "Figtree",sans-serif;padding:0 6px}
.rteimg span,.rtetab span{font-size:13px;color:var(--soft);font-weight:700;margin-right:4px}
.rteimg,.rtetab{background:#FFF7E0}
.rtebar .sep{width:1px;height:22px;background:var(--line);margin:0 4px}
.rtezone{min-height:180px;padding:14px;font-size:16px;line-height:1.55;outline:none}
.rtezone:empty::before{content:"Décris ton produit…";color:var(--soft)}
.rtezone h2{font-size:22px;margin:6px 0}.rtezone h3{font-size:19px;margin:6px 0}.rtezone p{margin:0 0 10px}
.rtezone img{max-width:100%;height:auto;border-radius:10px;display:inline-block}
.rtezone img.sel{outline:3px solid var(--main);outline-offset:2px}
.rtezone a{color:var(--main);text-decoration:underline}
.rtezone table{width:100%;border-collapse:collapse;margin:6px 0 10px}.rtezone td,.rtezone th{border:1px solid var(--line);padding:6px 8px;min-width:40px}
.rtezone th{background:var(--surface)}
.rtezone .vid{background:#111;color:#fff;border-radius:10px;padding:18px;text-align:center;font-weight:700;margin:6px 0 10px;word-break:break-all}
.rtezone ul{padding-left:22px;margin:0 0 10px}
.phedit{position:absolute;top:4px;right:4px;width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.92);font-size:15px;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.ph img{object-fit:contain!important;background:#fff}
/* Retouche photo */
.retouche{position:fixed;inset:0;z-index:95;background:#111;display:flex;flex-direction:column;color:#fff}
.rtop{display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top) + 10px) 12px 10px}
.rtop button{padding:10px 14px;border-radius:12px;background:rgba(255,255,255,.12);color:#fff;font-weight:700}
.rtop .ok{background:var(--sun);color:#12308F}
.rzone{flex:1;min-height:0}.rzone img{display:block;max-width:100%}
.rbas{padding:10px 12px calc(14px + env(safe-area-inset-bottom))}
.rrow{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-bottom:8px}
.rrow button{flex:0 0 auto;padding:10px 14px;border-radius:12px;background:rgba(255,255,255,.12);color:#fff;font-weight:600;font-size:14px}
.rrow button.on{background:#fff;color:#111}
.rrow button:disabled{opacity:.5}
.rinfo{font-size:13px;color:rgba(255,255,255,.7);text-align:center}
/* Assistant IA */
.iabtn{position:fixed;right:16px;bottom:calc(92px + env(safe-area-inset-bottom));z-index:31;width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,#5B2EE6,#2350D8);color:#fff;display:grid;place-items:center;box-shadow:0 8px 24px rgba(35,80,216,.35)}
.iabtn svg{width:26px;height:26px}
.nav.hidden ~ .iabtn{display:none}
html.ordi .iabtn{bottom:24px;right:24px}
.iapan{position:fixed;inset:0;z-index:950;background:#fff;display:flex;flex-direction:column}
html.ordi .iapan{inset:auto 24px 24px auto;width:420px;height:min(680px,calc(100vh - 48px));border-radius:20px;box-shadow:0 20px 60px rgba(0,0,0,.25);overflow:hidden}
.iahd{display:flex;align-items:center;gap:10px;padding:calc(12px + env(safe-area-inset-top)) 14px 12px;border-bottom:1px solid var(--line)}
.iahd .av{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#5B2EE6,#2350D8);color:#fff;display:grid;place-items:center;font-size:18px}
.iahd b{flex:1;font-size:17px}.iahd small{display:block;color:var(--soft);font-weight:500;font-size:12px}
.iahd button{padding:8px 10px;border-radius:10px;font-weight:700;color:var(--soft)}
.iamsgs{flex:1;overflow-y:auto;padding:16px 14px;display:flex;flex-direction:column;gap:10px;overscroll-behavior:contain}
.iam{max-width:86%;padding:10px 13px;border-radius:16px;line-height:1.45;font-size:15px;white-space:pre-wrap;word-wrap:break-word}
.iam.moi{align-self:flex-end;background:var(--main);color:#fff;border-bottom-right-radius:5px}
.iam.ia{align-self:flex-start;background:var(--surface);color:var(--ink);border-bottom-left-radius:5px}
.iam.ia a{color:var(--main);font-weight:700}
.iam.att{color:var(--soft)}
.iasug{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.iasug button{text-align:left;padding:11px 13px;border-radius:14px;border:1.5px solid var(--line);font-weight:600;font-size:14px;color:var(--ink)}
.iabas{display:flex;gap:8px;align-items:flex-end;padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.iabas textarea{flex:1;resize:none;max-height:120px;min-height:46px;border:1.5px solid var(--line);border-radius:16px;padding:12px 14px;font:inherit;font-size:16px;outline:none}
.iabas textarea:focus{border-color:var(--main)}
.iabas button{flex:0 0 46px;height:46px;border-radius:50%;background:var(--main);color:#fff;font-size:20px;font-weight:900}
.iabas button:disabled{opacity:.4}
/* Tableau de bord du point hebdo */
.ptback{display:block;margin:-4px 0 6px;padding:6px 0;font-weight:700;color:var(--main)}
.ptper{display:flex;gap:6px;margin-bottom:10px}
.ptper button{padding:8px 12px;border-radius:12px;background:var(--surface);font-weight:700;font-size:13px}
.ptper button.on{background:var(--ink);color:#fff}
.pthero{padding:16px;border-radius:18px;background:var(--okbg)}
.pthero.neg{background:var(--errbg)}
.pthero small{display:block;font-weight:700;color:var(--soft);font-size:13px}
.pthero b{display:block;font-size:32px;letter-spacing:-.02em;margin:2px 0;color:var(--ok)}
.pthero.neg b{color:var(--err)}
.pthero span{font-size:13px;color:var(--soft)}
.pthero em{font-style:normal;font-weight:800}.pthero em.haut{color:var(--ok)}.pthero em.bas{color:var(--err)}
.ptk{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.ptk div{background:var(--surface);border-radius:14px;padding:10px;min-width:0}
.ptk small{display:block;color:var(--soft);font-size:11.5px;font-weight:600}
.ptk b{display:block;font-size:15px;margin-top:2px;overflow-wrap:anywhere}
.ptcard{border:1.5px solid var(--line);border-radius:18px;padding:14px;margin-top:12px}
.ptcard h3{font-size:16px;margin-bottom:4px}
.pttip{font-size:14px;margin:4px 0 8px}
.pttip small{display:block;color:var(--soft);font-size:12px}
.pttip .p{color:var(--ok);font-weight:800}.pttip .n{color:var(--err);font-weight:800}
.ptchart{width:100%;height:auto;display:block}
.ptbar{cursor:pointer}.ptbar path{opacity:.5;transition:opacity .15s}.ptbar.on path,.ptbar:hover path{opacity:1}
.ptax{display:flex;justify-content:space-around;font-size:11px;color:var(--soft);margin-top:4px}
.ptstack{display:flex;gap:2px;height:16px;border-radius:8px;overflow:hidden;margin:10px 0}
.ptstack i{display:block;height:100%}
.ptleg{display:grid;grid-template-columns:1fr auto 48px;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
.ptleg span{display:flex;align-items:center;gap:8px}
.ptleg span i{width:10px;height:10px;border-radius:3px;flex:0 0 10px}
.ptleg em{font-style:normal;color:var(--soft);text-align:right;font-size:13px}
.pterr{background:var(--errbg);color:var(--err);border-radius:12px;padding:10px;font-size:13px;font-weight:600;margin-top:6px}
/* Œil du mot de passe */
.login .pw{position:relative;width:100%}
.login .pw input{width:100%;padding-right:52px}
.pwb{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:44px;height:44px;display:grid;place-items:center;color:var(--soft);border-radius:10px}
.pwb svg{width:22px;height:22px}
/* Point hebdomadaire */
.ptile{display:flex;align-items:center;gap:12px;width:100%;margin-top:12px;padding:14px;border-radius:18px;background:linear-gradient(135deg,#EAF7EF,#F2F5FF);text-align:left;border:1.5px solid var(--line)}
.ptile span{font-size:26px}.ptile div{flex:1}.ptile b{display:block;font-size:16px}.ptile small{color:var(--soft);font-size:13px}.ptile i{font-style:normal;font-size:24px;color:var(--soft)}
.ptsem{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:6px -4px 10px;padding:0 4px}
.ptsem::-webkit-scrollbar{display:none}
.ptsem button{flex:0 0 auto;padding:9px 12px;border-radius:12px;background:var(--surface);font-weight:700;font-size:13px;white-space:nowrap}
.ptsem button.on{background:var(--main);color:#fff}
.ptsem button.fait:not(.on)::after{content:" ✓";color:var(--ok)}
.ptaide{background:var(--surface);border-radius:14px;padding:10px 12px;font-size:13px;color:var(--soft);margin-bottom:6px}
.ptaide b{color:var(--ink)}
.ptin{display:grid;grid-template-columns:1fr auto;align-items:center;gap:6px 10px;margin-top:10px}
.ptin label{font-weight:700;font-size:14px}.ptin label small{display:block;color:var(--soft);font-weight:500;font-size:12px}
.ptin input{width:150px;text-align:right;font-weight:800;font-size:17px}
.ptres{margin:16px 0 10px;padding:16px;border-radius:18px;text-align:center;background:var(--okbg)}
.ptres.neg{background:var(--errbg)}
.ptres small{display:block;font-weight:700;color:var(--soft)}
.ptres b{font-size:30px;letter-spacing:-.02em;color:var(--ok)}
.ptres.neg b{color:var(--err)}
.pthist{margin-top:18px}
.pthist h3{font-size:16px;margin-bottom:6px}
.pth{display:flex;justify-content:space-between;gap:10px;padding:11px 4px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.pth small{display:block;color:var(--soft);font-size:12px}
.pth b.p{color:var(--ok)}.pth b.n{color:var(--err)}

.vband{position:sticky;top:0;z-index:60;display:flex;align-items:center;gap:10px;padding:10px 14px;background:#FFF4E5;color:#7A3E00;font-size:14px;font-weight:600}
.vband span{flex:1}
.vband.essai{background:#EEEAFE;color:#3B1C9E}.vband.essai a{background:#5B2EE6}
.vband a{flex:0 0 auto;background:#7A3E00;color:#fff;border-radius:10px;padding:7px 12px;font-weight:800;text-decoration:none}
.vbloc{position:fixed;inset:0;z-index:1000;background:#fff;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center}
.vbloc>div{max-width:380px}
.vbloc img{border-radius:18px}
.vbloc h1{font-size:24px;margin:16px 0 8px}
.vbloc p{color:var(--soft);margin:0 0 20px}
.vbloc .btn{display:flex;align-items:center;justify-content:center;text-decoration:none}
.vstat{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:12px 0}
.vstat div{background:var(--surface);border-radius:14px;padding:10px;text-align:center}
.vstat b{display:block;font-size:20px}
.vstat small{color:var(--soft);font-size:12px}
.vpay{border:1.5px solid var(--line);border-radius:16px;padding:12px;margin-top:10px}
.vpay.av{border-color:#E0B200;background:#FFFBEB}
.vpay .l{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.vpay .tx{font-family:ui-monospace,monospace;background:var(--surface);border-radius:8px;padding:2px 6px}
.vpay .act{display:flex;gap:8px;margin-top:10px}
.vpay .act button{flex:1;padding:10px;border-radius:12px;font-weight:800}
.vbadge{font-size:12px;font-weight:800;padding:3px 9px;border-radius:99px;white-space:nowrap}
.vb-actif{background:var(--okbg);color:var(--ok)}.vb-essai{background:#EEEAFE;color:#3B1C9E}.vb-grace,.vb-attente{background:#FFF4E5;color:#B45309}.vb-expire,.vb-bloque{background:var(--errbg);color:var(--err)}
/* Mes boutiques */
.store{color:inherit;text-align:left}
.store .stn{max-width:52vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.store .stv{font-size:14px;opacity:.7;margin-left:-4px}
.bqsheet{max-height:90vh}
.bqrow{display:grid;grid-template-columns:1fr auto;gap:8px 10px;align-items:center;padding:12px;border:1.5px solid var(--line);border-radius:16px;margin-top:10px}
.bqrow.on{border-color:var(--main);background:#F2F5FF}
.bqi b{display:block;font-size:16px}.bqi small{color:var(--soft);font-size:13px}
.bqcur{font-size:13px;font-weight:700;color:var(--main)}
.bqa{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap}
.bqa a,.bqa button{font-size:13px;font-weight:700;padding:7px 10px;border-radius:10px;background:var(--surface)}
.bqa .bqdel{background:var(--errbg);color:#9B1C1C;margin-left:auto}
.pchips{display:flex;flex-wrap:wrap;gap:6px;max-height:190px;overflow:auto;padding:4px 0}

<body>

<script>
(function(){
  const app = document.getElementById('app'), nav = document.getElementById('nav');
  // Boutique en cours (Vendoo) : '' = boutique principale ; chaque boutique garde ses propres données sur le téléphone
  // Abonné Vendoo : tout ce qui est gardé sur le téléphone est séparé de celui du propriétaire
  const K_B = VID ? 'adm_b_v' + VID : 'adm_b', K_BQS = VID ? 'adm_bqs_v' + VID : 'adm_bqs';
  const BQ = (() => {
    const u = new URLSearchParams(location.search); let b = u.get('b');
    if (b === null && u.get('cmd')) b = '';
    try { if (b !== null) localStorage.setItem(K_B, b); else b = localStorage.getItem(K_B) || ''; } catch(e){ b = b || ''; }
    return String(b || '').toLowerCase().replace(/[^a-z0-9-]/g, '');

    const P = (a, b) => ({debut: isoJ(a), fin: isoJ(b)});

  /* Globe en hexagones : dessiné seulement quand il bouge, les repères animés à part */

    TERRE.r.forEach((runs, i) => {

      let j = 0, on = false;

        const s = Math.ceil(r * 2 * dpr) + 2, cv = document.createElement('canvas'); cv.width = cv.height = s;
        const x = cv.getContext('2d'); x.fillStyle = c; x.beginPath();

      [A, B].forEach(c => { c.width = W * dpr; c.height = H * dpr; c.style.width = W + 'px'; c.style.height = H + 'px'; });
      sale = true;
    }
    const R = () => Math.min(W * .46, (H - 64) * .47) * zoom, CY = () => zoom > 1.2 ? H / 2 : H / 2 + 30;
    function proj(la, lo){
      const sl = Math.sin(la), cl = Math.cos(la), d = lo - lon0, cd = Math.cos(d);
      const cosc = Math.sin(lat0) * sl + Math.cos(lat0) * cl * cd;

  // Réduit la photo sur le téléphone avant l'envoi (rapide, même en 3G)
  function lirePhoto(file){
    return new Promise((ok, ko) => {
      const fr = new FileReader();
      fr.onerror = ko;
      fr.onload = () => { const im = new Image(); im.onerror = ko; im.onload = () => {
        const k = Math.min(1, 2048 / Math.max(im.width, im.height)), c = document.createElement('canvas');
        c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
        const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(im, 0, 0, c.width, c.height);
        g.imageSmoothingQuality = 'high'; ok(c.toDataURL('image/jpeg', 0.92)); }; im.src = fr.result; };
      fr.readAsDataURL(file);
    });
  }
  async function photoInstantanee(file, nom){
    const b64 = await lirePhoto(file);
    const tok = 'upload:' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
    apercus[tok] = b64;
    const envoi = async essai => { try { return (await call({type: 'produits', action: 'image', b64, mime: 'image/jpeg', nom})).url; } catch(e){ if (essai < 4){ await new Promise(r => setTimeout(r, 3000)); return envoi(essai + 1); } throw e; } };
    uploads[tok] = envoi(0).then(url => { apercus[url] = b64; remplacerPartout(tok, url); return url; });
    uploads[tok].catch(() => {});
    return tok;
  }
  /* Retouche photo : recadrer, tourner, retourner, effacer l'arrière-plan (gratuit, dans le téléphone) */
  let cropperP = null;
  function chargerCropper(){
    return cropperP = cropperP || new Promise((ok, ko) => {
      const l = document.createElement('link'); l.rel = 'stylesheet'; l.href = 'https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.css'; document.head.appendChild(l);
      const sc = document.createElement('script'); sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.js'; sc.onload = () => ok(window.Cropper); sc.onerror = () => { cropperP = null; ko(new Error('Outil de retouche indisponible, vérifie ta connexion.')); }; document.head.appendChild(sc);
    });
  }
  async function blobDe(src){
    if (/^data:/.test(src)) return (await fetch(src)).blob();
    const r = await fetch(src, {mode: 'cors'}); if (!r.ok) throw new Error('photo inaccessible'); return r.blob();
  }
  function retoucher(src){
    return new Promise(async fin => {
      let blob, C;
      try { [C, blob] = await Promise.all([chargerCropper(), blobDe(src)]); }
      catch(e){ alert(/inaccessible|fetch/i.test(e.message) ? 'Cette photo ne peut pas être retouchée ici. Ajoute-la depuis ton téléphone, puis retouche-la.' : e.message); fin(null); return; }
      const ov = document.createElement('div'); ov.className = 'retouche';
      ov.innerHTML = `<div class="rtop"><button id="rtX">Annuler</button><b>Retoucher la photo</b><button id="rtOk" class="ok">Valider</button></div>
        <div class="rzone"><img id="rtImg" alt=""></div>
        <div class="rbas">
          <div class="rrow"><button data-r="NaN" class="on">Libre</button><button data-r="1">Carré</button><button data-r="0.8">4:5</button><button data-r="1.7778">16:9</button><button data-r="0.5625">9:16</button></div>
          <div class="rrow"><button id="rtG">↺ Tourner</button><button id="rtD">↻ Tourner</button><button id="rtM">⇋ Miroir</button><button id="rtF">✨ Effacer le fond</button></div>
          <p class="rinfo" id="rtInfo">Glisse les coins pour recadrer.</p></div>`;
      document.body.appendChild(ov);
      const im = ov.querySelector('#rtImg'); let url = URL.createObjectURL(blob), cr = null, sx = 1;
      const monter = () => { if (cr) cr.destroy(); im.src = url; cr = new C(im, {viewMode: 1, autoCropArea: 1, background: false, responsive: true}); };
      monter();
      const quitter = r => { if (cr) cr.destroy(); ov.remove(); URL.revokeObjectURL(url); fin(r); };
      ov.querySelector('#rtX').onclick = () => quitter(null);
      ov.querySelectorAll('[data-r]').forEach(b => b.onclick = () => { ov.querySelectorAll('[data-r]').forEach(x => x.classList.toggle('on', x === b)); cr.setAspectRatio(Number(b.dataset.r)); });
      ov.querySelector('#rtG').onclick = () => cr.rotate(-90);
      ov.querySelector('#rtD').onclick = () => cr.rotate(90);
      ov.querySelector('#rtM').onclick = () => { sx = -sx; cr.scaleX(sx); };
      ov.querySelector('#rtF').onclick = async e => {
        const b = e.currentTarget, info = ov.querySelector('#rtInfo'); b.disabled = true;
        info.textContent = 'Effacement du fond… La première fois, l’outil se télécharge (Wi-Fi conseillé, jusqu’à 1 minute).';
        try {
          const m = await import('https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.4.5/+esm');
          const out = await m.removeBackground(blob, {progress: (k, a, t) => { if (t) info.textContent = 'Préparation de l’outil… ' + Math.round(a / t * 100) + ' %'; }});
          blob = out; URL.revokeObjectURL(url); url = URL.createObjectURL(out); monter();
          info.textContent = 'Fond effacé ✓ (il sera blanc sur le site).';
        } catch(err){ info.textContent = 'Impossible d’effacer le fond pour l’instant : ' + (err.message || err); }
        b.disabled = false;
      };
      ov.querySelector('#rtOk').onclick = () => {
        const c = cr.getCroppedCanvas({maxWidth: 2048, maxHeight: 2048, fillColor: '#fff', imageSmoothingEnabled: true, imageSmoothingQuality: 'high'});
        if (!c){ quitter(null); return; }
        c.toBlob(b => quitter(b ? new File([b], 'photo.jpg', {type: 'image/jpeg'}) : null), 'image/jpeg', 0.92);
      };
    });
  }

      <div class="help" id="diag" style="margin-top:6px;font-size:13px;word-break:break-word">Diagnostic : appuie sur « Tester ».</div>
      <div class="set"><div><b>Tester le son des relances</b><p>Un « ding-dong » différent, 5 minutes après chaque abandon.</p></div><button class="chip" style="background:var(--surface);color:var(--ink);border-color:var(--line)" id="testRel">Écouter</button></div>
      <div class="set"><div><b>Sons pour les notifications</b><p>Télécharge-les, puis choisis-les comme sons de notification dans les réglages Android.</p></div><span style="display:flex;gap:6px"><a class="chip" style="background:var(--surface);color:var(--ink);border-color:var(--line)" href="commande.mp3" download="ABROMARKET-commande.mp3">Commande</a><a class="chip" style="background:var(--surface);color:var(--ink);border-color:var(--line)" href="relance.mp3" download="ABROMARKET-relance.mp3">Relance</a></span></div>
      <div class="set"><div><b>Google Sheets</b><p>Produits, prix, pays, agences et commandes.</p></div><a class="chip" style="background:var(--surface);color:var(--ink);border-color:var(--line)" href="${esc(D.sheetUrl)}" target="_blank" rel="noopener">Ouvrir</a></div>
      <div class="set"><div><b>Aperçu du site</b><p>Voir ta boutique comme sur ordinateur ou sur mobile.</p></div><button class="chip" style="background:var(--surface);color:var(--ink);border-color:var(--line)" data-go2="apercu">Voir</button></div>
      <div class="set"><div><b>Ma boutique</b><p>La page que voient tes clients.</p></div><a class="chip" style="background:var(--surface);color:var(--ink);border-color:var(--line)" href="${esc(lienSite(''))}" target="_blank" rel="noopener">Ouvrir</a></div>
      <div class="help"><b>Installer l'application sur ton téléphone</b><br>Android (Chrome) : menu ⋮ → « Ajouter à l'écran d'accueil » ou « Installer l'application ».<br>iPhone (Safari) : bouton Partager → « Sur l'écran d'accueil » (obligatoire sur iPhone pour les notifications).</div>
      <button class="btn ghost" id="out" style="margin-top:18px">Se déconnecter</button></div>`;
    document.getElementById('sw').onclick = () => { sound = !sound; S.set('adm_sound', sound ? '1' : '0'); if (sound) chime(); settings(); };
    document.getElementById('test').onclick = () => { const s = sound; sound = true; chime(); sound = s; };
    document.getElementById('testRel').onclick = () => { const s = sound; sound = true; chime('relance'); sound = s; };
    document.getElementById('out').onclick = () => logout();
    document.getElementById('bqSet').onclick = () => mesBoutiques();
    document.getElementById('ptSet').onclick = () => pointHebdo();
    document.getElementById('agSet').onclick = () => { const ov = document.createElement('div'); ov.className = 'overlay'; ov.onclick = e => { if (e.target === ov) ov.remove(); }; document.body.appendChild(ov); agences(ov, BQ, (D && D.boutique) || 'Ma boutique', () => ov.remove()); };
    const va = document.getElementById('vAdm'); if (va) va.onclick = () => vendooAdmin();
    app.querySelectorAll('[data-go2]').forEach(b => b.onclick = () => go(b.dataset.go2));
    document.getElementById('testPush').onclick = async e => {
      const b = e.target, dg = document.getElementById('diag'); b.textContent = '…';
      let regs = [];
      try { regs = (await navigator.serviceWorker.getRegistrations()).map(r => r.scope.replace(location.origin, '') + ' (' + ((r.active && r.active.scriptURL) || '').split('/').pop().split('?')[0] + ')'); } catch(x){}
      const os = window.OneSignal && OneSignal.User ? OneSignal.User.PushSubscription : null;
      const lignes = [
        'Permission du téléphone : ' + ('Notification' in window ? Notification.permission : 'non disponible'),
        'Module OneSignal : ' + (window.OneSignal && OneSignal.User ? 'chargé' : 'NON chargé') + (osErr ? ' – erreur : ' + osErr : ''),
        'Abonné : ' + (os ? (os.optedIn ? 'oui' : 'non') + (os.id ? ' (id ' + os.id.slice(0, 8) + '…)' : ' (aucun id)') : '?'),
        'Services : ' + (regs.join(', ') || 'aucun')
      ];
      try { const r = await call({type: 'testpush'}); lignes.push('Envoi : ' + (r.resultat || r.code)); if (r.whatsapp) lignes.push('WhatsApp (test) : ' + r.whatsapp); if (r.dernierWhatsapp) lignes.push('WhatsApp (dernière commande) : ' + r.dernierWhatsapp); if (r.dernierPush) lignes.push('Notification (dernière commande) : ' + r.dernierPush); if (r.green) lignes.push('WhatsApp perso (test) : ' + r.green); if (r.dernierGreen) lignes.push('WhatsApp perso (dernier envoi) : ' + r.dernierGreen); }
      catch(err){ lignes.push('Envoi : erreur ' + err.message); }
      dg.innerHTML = lignes.map(esc).join('<br>'); b.textContent = 'Tester';
    };
  }

  /* ---------- Assistant IA (comme Sidekick de Shopify) ---------- */
  let IA = []; try { IA = JSON.parse(S.get('adm_ia') || '[]') || []; } catch(e){ IA = []; }
  const iaTexte = t => esc(t).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')
    .replace(/(https?:\/\/[^\s<)]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>')
    .replace(/\+229 ?01 ?60 ?42 ?21 ?39/g, m => `<a href="https://wa.me/2290160422139" target="_blank" rel="noopener">${m}</a>`);
  const IA_SUG = ['Comment ajouter un produit ?', 'Comment activer les notifications ?', 'Comment marchent les relances ?', 'Comment ajouter une agence de livraison ?', 'Comment suivre mes pubs TikTok ?', 'Comment fonctionne l’abonnement ?'];
  function assistantIA(){
    if (document.getElementById('iaPan')) return;
    const pan = document.createElement('div'); pan.className = 'iapan'; pan.id = 'iaPan'; pan.setAttribute('role', 'dialog'); pan.setAttribute('aria-label', 'Assistant');
    pan.innerHTML = `<div class="iahd"><span class="av">✦</span><b>Assistant<small>Pose ta question sur l’application</small></b><button id="iaNew">Nouveau</button><button id="iaX" aria-label="Fermer" style="font-size:20px">✕</button></div>
      <div class="iamsgs" id="iaMsgs" aria-live="polite"></div>
      <form class="iabas" id="iaF"><textarea id="iaQ" rows="1" placeholder="Écris ta question…" aria-label="Ta question"></textarea><button id="iaGo" aria-label="Envoyer">➤</button></form>`;
    document.body.appendChild(pan); document.body.style.overflow = 'hidden';
    const msgs = pan.querySelector('#iaMsgs'), q = pan.querySelector('#iaQ'), go = pan.querySelector('#iaGo');
    let attente = false;
    const dessiner = () => {
      msgs.innerHTML = (IA.length ? '' : `<div class="iam ia">Bonjour 👋 Je connais tout le fonctionnement de l’application, du site et de Vendoo. Pose-moi ta question.</div><div class="iasug">${IA_SUG.map(t => `<button type="button">${esc(t)}</button>`).join('')}</div>`)
        + IA.map(m => `<div class="iam ${m.role === 'ia' ? 'ia' : 'moi'}">${m.role === 'ia' ? iaTexte(m.texte) : esc(m.texte)}</div>`).join('')
        + (attente ? '<div class="iam ia att">…</div>' : '');
      msgs.querySelectorAll('.iasug button').forEach(b => b.onclick = () => envoyer(b.textContent));
      msgs.scrollTop = msgs.scrollHeight;
    };
    const memo = () => { try { S.set('adm_ia', JSON.stringify(IA.slice(-40))); } catch(e){} };
    async function envoyer(t){
      t = String(t || '').trim(); if (!t || attente) return;
      IA.push({role: 'moi', texte: t}); memo(); q.value = ''; q.style.height = ''; attente = true; go.disabled = true; dessiner();
      try { const j = await call({type: 'assistant', messages: IA.slice(-12)}); IA.push({role: 'ia', texte: j.texte}); }
      catch(e){ IA.push({role: 'ia', texte: /assistant|inconnu/i.test(e.message) ? 'Mets à jour le code Apps Script (Code.gs) pour activer l’assistant.' : 'Connexion impossible. Vérifie ta connexion internet et réessaie.'}); }
      attente = false; go.disabled = false; memo(); dessiner();
    }
    pan.querySelector('#iaF').onsubmit = e => { e.preventDefault(); envoyer(q.value); };
    q.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey && matchMedia('(min-width: 1000px)').matches){ e.preventDefault(); envoyer(q.value); } });
    q.addEventListener('input', () => { q.style.height = 'auto'; q.style.height = Math.min(120, q.scrollHeight) + 'px'; });
    pan.querySelector('#iaX').onclick = () => { pan.remove(); document.body.style.overflow = ''; };
    pan.querySelector('#iaNew').onclick = () => { IA = []; memo(); dessiner(); };
    dessiner();
    if (!matchMedia('(pointer: coarse)').matches) q.focus();
  }
  document.getElementById('iaBtn').onclick = () => { unlock(); assistantIA(); };

  /* ---------- Démarrage ---------- */
  let swFait = false;
  function swCache(){ if (swFait || !D || D.onesignal || !('serviceWorker' in navigator)) return; swFait = true; navigator.serviceWorker.register('OneSignalSDKWorker.js', {scope: './'}).catch(() => {}); }
  if (key){
    nav.classList.remove('hidden');
    D = fromCache(periode);
    render();
    setBusy(true);
    refresh().then(() => { if (key) schedule(); });
  }
  else { login(); finDemarrage(); }
  setTimeout(finDemarrage, 4000);
  let largeurAvant = innerWidth;
  addEventListener('resize', () => { if (innerWidth === largeurAvant) return; largeurAvant = innerWidth; if (view === 'home' && D) drawChart(); });
})();
</script>
</body>
</html>
