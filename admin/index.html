<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E1F63">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ABROMARKET">
<title>ABROMARKET Gestion</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" media="print" onload="this.media='all'" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
<link rel="preload" href="kaching.mp3" as="audio">
<script>window.OneSignalDeferred = window.OneSignalDeferred || [];</script>
<script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
<script>
const API = "https://script.google.com/macros/s/AKfycbwgdtcXlXB9niD3hactnz4SLIrpY_q74iQQZwkr1vrUBjczfCCVWwamG69uqnUQZsba/exec";
const SITE = "https://abraham596-stak.github.io/abromarket1/boutique/";
</script>
<style>
:root{
  --deep:#0E1F63; --main:#1736A6; --sun:#FFC93C; --ink:#141A2E; --soft:#5A6178; --line:#E3E6EF;
  --surface:#F3F5FB; --bg:#FFFFFF; --ok:#12A150; --okbg:#DDF5E7; --err:#C62828; --errbg:#FBE3E3;
  --onDeep:#FFFFFF; --onDeepSoft:rgba(255,255,255,.66);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:var(--deep);font-size:16px;line-height:1.45;overscroll-behavior-y:contain}
h1,h2,h3,.num{font-family:"Bricolage Grotesque","Figtree",system-ui,sans-serif;letter-spacing:-.01em}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.hidden{display:none!important}

/* Connexion */
.login{min-height:100%;display:flex;flex-direction:column;justify-content:center;padding:32px 24px;color:var(--onDeep);max-width:420px;margin:0 auto}
.login .logo{width:72px;height:72px;border-radius:20px;background:var(--sun);display:grid;place-items:center;font:800 34px "Bricolage Grotesque",sans-serif;color:var(--deep);margin-bottom:22px}
.login h1{font-size:32px;line-height:1.1}
.login p{color:var(--onDeepSoft);margin:10px 0 26px}
.login input{width:100%;padding:16px;border-radius:14px;border:2px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);color:#fff;font:600 20px "Figtree",sans-serif;letter-spacing:.2em;text-align:center}
.login input::placeholder{letter-spacing:normal;color:var(--onDeepSoft);font-weight:500;font-size:16px}
.login .btn{margin-top:14px}
.login .err{color:#FFB4B4;margin-top:12px;font-weight:600;min-height:22px}
.btn{display:block;width:100%;padding:16px;border-radius:14px;background:var(--sun);color:var(--deep);font-weight:700;font-size:17px;text-align:center}
.btn.blue{background:var(--main);color:#fff}
.btn.ghost{background:var(--surface);color:var(--ink)}

/* En-tête */
.top{color:var(--onDeep);padding:calc(env(safe-area-inset-top) + 14px) 16px 0}
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px}
.avatar{width:44px;height:44px;border-radius:50%;background:var(--sun);color:var(--deep);display:grid;place-items:center;font:800 17px "Bricolage Grotesque",sans-serif}
.store{display:flex;align-items:center;gap:10px;font:800 21px "Bricolage Grotesque",sans-serif}
.store i{width:34px;height:34px;border-radius:10px;background:var(--sun);display:grid;place-items:center;font-style:normal;font-size:18px}
.iconbtn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:20px;background:rgba(255,255,255,.08)}
.iconbtn.off{opacity:.5}

.kpis{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;margin:18px -16px 0;padding:0 16px 4px}
.kpis::-webkit-scrollbar{display:none}
.kpi{flex:0 0 auto;text-align:left;padding:10px 14px;border-radius:16px;border:1px solid transparent;min-width:118px}
.kpi.on{background:rgba(255,255,255,.10);border-color:rgba(255,255,255,.18)}
.kpi small{display:block;color:var(--onDeepSoft);font-size:14px;font-weight:500}
.kpi b{font:800 24px "Bricolage Grotesque",sans-serif;white-space:nowrap}
.kpi .d{font-size:13px;font-weight:700;margin-left:6px}
.up{color:#5BE39B}.down{color:#FF9D9D}
.pulse{display:inline-block;width:10px;height:10px;border-radius:50%;background:#5BE39B;margin-right:6px;box-shadow:0 0 0 0 rgba(91,227,155,.6);animation:p 1.8s infinite}
@keyframes p{70%{box-shadow:0 0 0 8px rgba(91,227,155,0)}100%{box-shadow:0 0 0 0 rgba(91,227,155,0)}}

.chart{margin-top:10px;height:200px;position:relative}
.chart svg{width:100%;height:100%;display:block;overflow:visible}
.legend{display:flex;gap:16px;font-size:13px;color:var(--onDeepSoft);margin-top:2px}
.legend span::before{content:"";display:inline-block;width:16px;height:3px;border-radius:2px;background:var(--sun);vertical-align:middle;margin-right:6px}
.legend span.p::before{background:repeating-linear-gradient(90deg,rgba(255,255,255,.55) 0 4px,transparent 4px 7px)}
.periods{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:14px 0 22px}
.periods::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:9px 14px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);font-weight:600;font-size:15px;color:var(--onDeep)}
.chip.on{background:var(--sun);color:var(--deep);border-color:var(--sun)}

/* Feuille blanche */
.sheet{background:var(--bg);border-radius:26px 26px 0 0;min-height:60vh;padding:24px 16px calc(110px + env(safe-area-inset-bottom))}
.sheet h2{font-size:26px;line-height:1.15;margin-bottom:16px}
.sheet h2 span{color:var(--soft);font-weight:600}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:22px}
.tile{border:1px solid var(--line);border-radius:18px;padding:14px;text-align:left;background:#fff}
.tile small{color:var(--soft);font-weight:600;font-size:14px;display:block}
.tile b{font:800 24px "Bricolage Grotesque",sans-serif;display:block;margin-top:4px}
.tile.warn b{color:var(--err)}
.tile.yes b{color:var(--ok)}
.block{margin-bottom:24px}
.block h3{font-size:19px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:baseline}
.block h3 button{font:600 14px "Figtree",sans-serif;color:var(--main)}
.livelist{display:grid;gap:8px}
.liverow{display:flex;justify-content:space-between;gap:10px;padding:12px 14px;background:var(--surface);border-radius:14px;font-weight:600}
.empty{color:var(--soft);padding:18px;text-align:center;background:var(--surface);border-radius:14px}
.money{display:flex;flex-direction:column;gap:6px}
.money div{display:flex;justify-content:space-between;padding:10px 14px;background:var(--surface);border-radius:12px;font-weight:600}

/* Commandes */
.page{background:var(--bg);min-height:100%;padding:calc(env(safe-area-inset-top) + 16px) 16px calc(110px + env(safe-area-inset-bottom))}
.page>h1{font-size:30px;margin-bottom:14px}
.search{width:100%;padding:14px 16px;border-radius:14px;border:0;background:var(--surface);font:500 16px "Figtree",sans-serif;color:var(--ink)}
.filters{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:12px 0}
.filters::-webkit-scrollbar{display:none}
.filters button{flex:0 0 auto;padding:8px 14px;border-radius:999px;font-weight:600;font-size:15px;color:var(--soft)}
.filters button.on{background:var(--surface);color:var(--ink)}
.order{display:block;width:100%;text-align:left;padding:16px 2px;border-bottom:1px solid var(--line)}
.order .l1{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.order .l1 b{font:800 21px "Bricolage Grotesque",sans-serif}
.order .l1 span{font-weight:600;white-space:nowrap}
.order .l2{color:var(--ink);margin:4px 0 8px}
.order .l3{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.daysep{background:var(--surface);color:var(--soft);font-weight:600;font-size:14px;padding:8px 12px;margin:10px -16px 0}
.badge{display:inline-block;padding:4px 10px;border-radius:999px;font-size:14px;font-weight:600;background:#FFF1BF;color:#6B4E00}
.b-Confirmée{background:#DCE6FF;color:#1736A6}.b-Livrée{background:var(--okbg);color:#0B6B35}
.b-Annulée,.b-Retournée{background:var(--errbg);color:#9B1C1C}.b-Injoignable{background:#ECEDF2;color:#4A5068}
.b-En{background:#E9E2FF;color:#4B2BA8}.b-Expédition{background:#FFE6D1;color:#8A3D00}
.tag{font-size:13px;color:var(--soft)}

/* Détail */
.overlay{position:fixed;inset:0;background:rgba(14,31,99,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.detail{background:#fff;width:100%;max-width:560px;border-radius:24px 24px 0 0;padding:20px 18px calc(24px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
.detail .grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 14px}
.detail h2{font-size:26px}
.detail .sub{color:var(--soft);margin-bottom:14px}
.ticket{border:2px dashed var(--main);border-radius:14px;padding:12px 14px;margin:12px 0}
.ticket .row{display:flex;justify-content:space-between;gap:14px;padding:5px 0}
.ticket .row span:first-child{color:var(--soft)}
.ticket .row span:last-child{text-align:right;font-weight:600}
.ticket .total{border-top:2px dashed var(--line);margin-top:6px;padding-top:9px}
.ticket .total span:last-child{font:800 22px "Bricolage Grotesque",sans-serif;color:var(--main)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.actions a{padding:14px;border-radius:14px;text-align:center;font-weight:700}
.a-call{background:var(--surface)}
.a-wa{background:#25D366;color:#fff}
label.lbl{display:block;font-weight:700;margin:14px 0 8px}
select.st{width:100%;padding:14px;border-radius:14px;border:2px solid var(--line);font:600 16px "Figtree",sans-serif;background:#fff;color:var(--ink)}

/* Abandons */
.ab{padding:14px 0;border-bottom:1px solid var(--line)}
.ab .l1{display:flex;justify-content:space-between;gap:10px}
.ab .l1 b{font-weight:700}
.ab p{color:var(--soft);font-size:15px;margin:2px 0 10px}
.ab .row{display:flex;gap:8px}
.ab .row a{flex:1;padding:11px;border-radius:12px;text-align:center;font-weight:700;font-size:15px}

/* Produits */
.prod{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.prod img{width:64px;height:64px;border-radius:12px;object-fit:cover;background:var(--surface);flex:0 0 64px}
.prod .info{flex:1;min-width:0}
.prod .info b{display:block;font-weight:700;line-height:1.3}
.prod .info small{color:var(--soft);display:block;margin:2px 0 8px}
.prod .links{display:flex;gap:8px;flex-wrap:wrap}
.prod .links a,.prod .links button{padding:7px 12px;border-radius:10px;background:var(--surface);font-weight:600;font-size:14px}

/* Réglages */
.set{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:16px 0;border-bottom:1px solid var(--line)}
.set p{color:var(--soft);font-size:14px}
.switch{width:52px;height:32px;border-radius:999px;background:var(--line);position:relative;flex:0 0 52px;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.switch.on{background:var(--ok)}
.switch.on::after{transform:translateX(20px)}
.help{background:var(--surface);border-radius:14px;padding:14px;margin-top:18px;color:var(--soft);font-size:15px}
.help b{color:var(--ink)}

/* Navigation */
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));display:flex;gap:4px;background:#fff;border-radius:999px;padding:6px;box-shadow:0 8px 30px rgba(14,31,99,.22);z-index:30}
.nav button{width:52px;height:50px;border-radius:999px;display:grid;place-items:center;position:relative;color:var(--soft)}
.nav button.on{background:var(--surface);color:var(--deep)}
.nav svg{width:24px;height:24px}
.nav .dot{position:absolute;top:7px;right:12px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--err);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center}

/* Alerte nouvelle commande */
.toast{position:fixed;left:12px;right:12px;top:calc(12px + env(safe-area-inset-top));z-index:60;max-width:520px;margin:0 auto;background:var(--sun);color:var(--deep);border-radius:18px;padding:14px 16px;display:flex;gap:12px;align-items:center;box-shadow:0 10px 30px rgba(14,31,99,.35);animation:drop .35s cubic-bezier(.2,1.4,.4,1)}
@keyframes drop{from{transform:translateY(-120%)}}
.toast .e{font-size:30px}
.toast b{display:block;font:800 18px "Bricolage Grotesque",sans-serif}
.loading{color:var(--onDeepSoft);text-align:center;padding:40px}
.sync{position:fixed;top:calc(8px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:rgba(255,255,255,.14);color:#fff;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;z-index:20}
.pushban{display:flex;gap:12px;align-items:center;width:100%;text-align:left;margin-top:14px;background:var(--sun);color:var(--deep);border-radius:16px;padding:12px 14px;font-weight:600}
.pushban b{display:block;font-size:15px}
.pushban span{font-size:13px;font-weight:500}
.copy{display:block;width:100%;margin:0 0 12px;padding:13px;border-radius:14px;background:var(--surface);font-weight:700;text-align:center}
.ab .row button{flex:1;padding:11px;border-radius:12px;text-align:center;font-weight:700;font-size:15px;background:var(--surface)}
.refresh{font-size:13px;color:var(--onDeepSoft);text-align:right;margin-top:6px}
/* TikTok */
.tt-top{background:#0B0B10;color:#fff;padding:calc(env(safe-area-inset-top) + 18px) 16px 20px}
.tt-top h1{font-size:28px;display:flex;align-items:center;gap:10px}
.tt-logo{width:36px;height:36px;border-radius:10px;background:#000;display:grid;place-items:center;box-shadow:-2px -2px 0 #25F4EE,2px 2px 0 #FE2C55}
.tt-logo svg{width:20px;height:20px}
.tt-top .sub{color:rgba(255,255,255,.62);font-size:14px;margin-top:4px}
.tt-top .periods{padding:14px 0 16px}
.tt-top .chip.on{background:#FE2C55;border-color:#FE2C55;color:#fff}
.ttsum{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ttsum div{background:rgba(255,255,255,.07);border-radius:16px;padding:12px 14px}
.ttsum small{display:block;color:rgba(255,255,255,.62);font-size:13px;font-weight:600}
.ttsum b{font:800 22px "Bricolage Grotesque",sans-serif;white-space:nowrap}
.ttsum .big{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center}
.btn.tt{background:#FE2C55;color:#fff;margin-top:14px}
.promo{display:block;width:100%;text-align:left;border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px;background:#fff}
.promo .h{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.promo .h b{font-weight:700;font-size:17px;line-height:1.3}
.promo .meta{color:var(--soft);font-size:13px;margin-top:2px}
.pm{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:12px}
.pm small{display:block;color:var(--soft);font-size:12px;font-weight:600;line-height:1.2}
.pm b{font:800 16px "Bricolage Grotesque",sans-serif;white-space:nowrap}
.vd{display:inline-block;padding:4px 10px;border-radius:999px;font-size:13px;font-weight:700;white-space:nowrap}
.v-ok{background:var(--okbg);color:#0B6B35}.v-bad{background:var(--errbg);color:#9B1C1C}.v-mid{background:#FFE6D1;color:#8A3D00}.v-wait{background:#ECEDF2;color:#4A5068}
.st-on{color:#0B6B35;font-weight:700;font-size:13px}.st-wait{color:#B45309;font-weight:700;font-size:13px}
.btn.red{background:var(--errbg);color:#9B1C1C}.st-off{color:var(--soft);font-weight:700;font-size:13px}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.mgrid .tile{padding:12px}
.mgrid .tile b{font-size:20px}
.field{width:100%;padding:14px;border-radius:14px;border:2px solid var(--line);font:600 16px "Figtree",sans-serif;background:#fff;color:var(--ink)}
.frow{display:grid;grid-template-columns:1fr 110px;gap:8px}
.linkbox{background:var(--surface);border-radius:14px;padding:12px 14px;font-size:14px;word-break:break-all;margin:8px 0}
.steps{background:var(--surface);border-radius:14px;padding:14px 14px 14px 32px;color:var(--ink);font-size:15px}
.steps li{margin:4px 0}
.pays{display:flex;flex-wrap:wrap;gap:8px}
.pays label{display:flex;align-items:center;gap:6px;padding:9px 12px;border-radius:999px;border:2px solid var(--line);font-weight:600;font-size:15px;cursor:pointer}
.pays input{width:18px;height:18px;accent-color:#FE2C55}
.pays label:has(input:checked){border-color:#FE2C55;background:#FFF0F3}
.pays label.off{opacity:.45}
.prow{display:flex;justify-content:space-between;align-items:baseline;margin:14px 0 8px}
.prow .lbl{margin:0}
.prow button{font-weight:600;font-size:14px;color:var(--main)}
.usdbox{display:flex;gap:12px;align-items:center;background:var(--surface);border-radius:14px;padding:12px 14px;margin-top:4px}
.usdbox span{font-size:24px}.usdbox b{display:block;font-size:17px}.usdbox small{color:var(--soft);font-size:13px}
/* Plage de dates */
.pdsheet{max-height:86vh}
.pdrow{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:14px 4px}
.pdrow b{display:block;font-size:17px}.pdrow small{display:block;color:var(--soft);font-size:14px}
.pdic{font-size:20px}.pdchev{margin-left:auto;font-size:24px;color:var(--soft)}
.pdfixe{padding:4px 4px 12px}
.pdsep{height:8px;background:var(--surface);margin:4px -18px 4px}
.pdopt{display:flex;align-items:center;gap:14px;padding:15px 4px;border-bottom:1px solid var(--line);font-size:17px;cursor:pointer}
.pdopt input{width:22px;height:22px;accent-color:var(--deep);flex:0 0 22px}
.pdbtn{font-weight:700}
/* Confirmation */
.cfov{position:fixed;inset:0;z-index:90;background:rgba(14,31,99,.55);display:flex;align-items:center;justify-content:center;padding:20px;animation:fd .15s ease-out}
@keyframes fd{from{opacity:0}}
.cfbox{background:#fff;border-radius:22px;padding:22px 20px 18px;width:100%;max-width:400px;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.3);animation:up .2s ease-out}
.cfic{width:56px;height:56px;border-radius:50%;margin:0 auto 12px;display:grid;place-items:center;font-size:26px;background:#DCE6FF}
.cfic.d{background:var(--errbg)}
.cfbox h2{font-size:22px;margin-bottom:8px}
.cfbox p{color:var(--soft);font-size:15px;line-height:1.5}
.cfbox p b{color:var(--ink)}
.cfbtns{display:grid;gap:10px;margin-top:18px}
.btn.dang{background:var(--err);color:#fff}
/* Éditeur de produits */
.savebadge{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom));z-index:70;background:var(--deep);color:#fff;font-size:13px;font-weight:600;padding:8px 14px;border-radius:999px;box-shadow:0 6px 20px rgba(14,31,99,.3);white-space:nowrap}
.savebadge.err{background:#9B1C1C}
.prhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.prhead h1{font-size:30px}
.btn.small{display:inline-block;width:auto;padding:10px 16px;font-size:15px;border-radius:12px}
.prod .pimg{flex:0 0 64px;padding:0}
.prod .pname{text-align:left;padding:0}
.pst{color:#B45309;font-weight:700}.pst.on{color:#0B6B35}
.editor{position:fixed;inset:0;z-index:50;background:var(--surface);overflow-y:auto;-webkit-overflow-scrolling:touch}
.edbar{position:sticky;top:0;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:10px;background:#fff;padding:calc(env(safe-area-inset-top) + 10px) 12px 10px;border-bottom:1px solid var(--line)}
.edbar b{font-size:17px}
.iconbtn2{width:42px;height:42px;border-radius:50%;background:var(--surface);font-size:18px}
.edbody{max-width:600px;margin:0 auto;padding:12px 12px calc(40px + env(safe-area-inset-bottom))}
.card{background:#fff;border-radius:18px;padding:16px;margin-bottom:12px;border:1px solid var(--line)}
.card h3{font-size:18px;margin-bottom:4px}
.card .lbl:first-child{margin-top:0}
.okmsg{background:var(--okbg);color:#0B6B35;font-weight:700;border-radius:14px;padding:12px 14px;margin-bottom:12px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface);border-radius:14px;padding:4px}
.seg button{padding:12px;border-radius:11px;font-weight:700;color:var(--soft)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 4px rgba(14,31,99,.15)}
.phgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.ph{position:relative;aspect-ratio:1;border-radius:14px;overflow:hidden;background:var(--surface)}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.phb{position:absolute;left:4px;right:4px;bottom:4px;display:flex;justify-content:space-between;gap:4px}
.phb button{width:30px;height:30px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;font-size:13px}
.ph:first-child::before{content:"Principale";position:absolute;top:6px;left:6px;background:var(--sun);color:var(--deep);font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px}
.ph.add{border:2px dashed var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:28px;color:var(--main);background:#fff}
.ph.add::before{display:none}
.ph.add span{font-size:13px;font-weight:700}
.lnk{color:var(--main);font-weight:600;font-size:14px;margin-top:10px;padding:4px 0}
.blk{border:1px solid var(--line);border-radius:14px;padding:10px;margin-top:10px}
.blkh{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:700;color:var(--soft);margin-bottom:6px}
.blkh button{width:32px;height:32px;border-radius:8px;background:var(--surface);margin-left:4px;font-size:14px}
.blkimg{width:100%;max-height:260px;object-fit:contain;border-radius:10px;background:var(--surface);display:block}
textarea.field{resize:vertical;line-height:1.45;font-weight:500}
textarea.ttl{font-weight:800;font-size:18px}
.addrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.addrow button,.addrow a{padding:10px 14px;border-radius:12px;background:var(--surface);font-weight:700;font-size:14px}
.addrow .danger{background:var(--errbg);color:#9B1C1C}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.g2 label{font-size:13px;font-weight:600;color:var(--soft)}
.g2 label .field{margin-top:4px;padding:11px}
.pays1{border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:10px}
.pays1 summary{display:flex;justify-content:space-between;gap:8px;cursor:pointer;list-style:none}
.pays1 summary::-webkit-details-marker{display:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (min-width:700px){.app{max-width:560px;margin:0 auto}}
.nl{display:none}
.ordi-only{display:none!important}
/* Aperçu du site */
.aphead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.aphead h1{font-size:30px}
.apseg{min-width:260px}
.aptools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:6px}
.aptools .field{flex:1 1 220px;width:auto;padding:11px 12px}
.apstage{background:var(--surface);border-radius:18px;padding:14px}
.apframe{position:relative;overflow:hidden;background:#fff}
.apframe iframe{border:0;display:block;transform-origin:0 0;width:100%;height:100%}
.apstage.ordi .apframe{width:100%;height:calc(100vh - 290px);min-height:420px;border-radius:12px;border:1px solid var(--line)}
.apstage.mobile .apframe{width:min(390px,100%);height:min(780px,calc(100vh - 260px));min-height:480px;margin:0 auto;border:10px solid #111;border-radius:40px;box-shadow:0 18px 40px rgba(14,31,99,.25)}
/* Bascule d'affichage */
.vuebar{position:fixed;left:12px;bottom:16px;width:212px;z-index:31}
.vuebar small{display:block;color:var(--soft);font-weight:600;font-size:12px;margin:0 0 6px 4px}
.vuebar .seg button{padding:9px 6px;font-size:13px}
.vueflot{position:fixed;top:14px;right:14px;z-index:35;background:#fff;color:var(--deep);border-radius:999px;padding:10px 16px;font-weight:700;font-size:14px;box-shadow:0 6px 20px rgba(14,31,99,.25)}
/* ---------- Version ordinateur de l'application ---------- */
html.ordi body{background:var(--surface)}
html.ordi .app{max-width:none;margin:0 0 0 236px;min-height:100vh}
html.ordi .nav{left:0;top:0;bottom:0;transform:none;width:236px;flex-direction:column;align-items:stretch;border-radius:0;padding:22px 12px 120px;gap:4px;box-shadow:none;border-right:1px solid var(--line);overflow-y:auto}
html.ordi .nav::before{content:"🛍️ ABROMARKET";font:800 19px "Bricolage Grotesque",sans-serif;color:var(--deep);padding:2px 12px 20px}
html.ordi .nav button{width:100%;height:46px;border-radius:12px;display:flex;align-items:center;gap:12px;padding:0 12px;justify-content:flex-start}
html.ordi .nav button:hover{background:var(--surface)}
html.ordi .nav .nl{display:inline;font-weight:600;font-size:15px}
html.ordi .nav .dot{position:static;margin-left:auto}
html.ordi .ordi-only{display:flex!important}
html.ordi .top{padding:28px 40px 0;background:var(--deep)}
html.ordi .tt-top{background:#0B0B10}
html.ordi .chart{height:280px}
html.ordi .sheet{border-radius:0;padding:32px 40px 60px;min-height:calc(100vh - 420px)}
html.ordi .sheet .grid2{grid-template-columns:repeat(4,1fr)}
html.ordi .page{padding:32px 40px 60px;min-height:100vh}
html.ordi .page>*{max-width:1180px;margin-left:auto;margin-right:auto}
html.ordi .page>h1{font-size:34px}
html.ordi #pl{display:grid;grid-template-columns:1fr 1fr;column-gap:32px}
html.ordi .overlay{align-items:center;padding:24px}
html.ordi .detail{border-radius:24px;max-height:90vh}
html.ordi .tt-top{padding:32px 40px 26px}
html.ordi .ttsum{grid-template-columns:repeat(4,1fr)}
html.ordi .ttsum .big{grid-column:span 2}
html.ordi .tt-top .btn.tt{max-width:340px}
html.ordi .sheet .block{max-width:1180px}
html.ordi .editor{left:236px}
html.ordi .edbody{max-width:860px;padding:20px 24px 60px}
html.ordi .savebadge{bottom:24px;left:calc(50% + 118px)}
html.ordi .toast{left:auto;right:24px;max-width:420px}
html.ordi .apstage.ordi .apframe{height:calc(100vh - 230px)}
</style>
</head>
<body>
<div class="app" id="app"></div>
<nav class="nav hidden" id="nav" aria-label="Navigation">
  <button data-v="home" aria-label="Accueil" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span class="nl">Accueil</span></button>
  <button data-v="orders" aria-label="Commandes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16v16H4z"/><path d="M4 13h4l2 3h4l2-3h4"/></svg><span class="nl">Commandes</span><span class="dot hidden" id="dotNew"></span></button>
  <button data-v="abandons" aria-label="Abandons"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/></svg><span class="nl">Abandons</span><span class="dot hidden" id="dotAb"></span></button>
  <button data-v="tiktok" aria-label="Promotions TikTok"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3v11.5a3.5 3.5 0 1 1-3.5-3.5"/><path d="M14 3c.4 2.6 2.4 4.6 5 4.8"/></svg><span class="nl">Promotions TikTok</span></button>
  <button data-v="products" aria-label="Produits"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.6 13.4 13.4 20.6a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8z"/><circle cx="7.5" cy="7.5" r="1.5"/></svg><span class="nl">Produits</span></button>
  <button data-v="apercu" aria-label="Aperçu du site" class="ordi-only"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg><span class="nl">Aperçu du site</span></button>
  <button data-v="settings" aria-label="Réglages"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg><span class="nl">Réglages</span></button>
</nav>
<div class="vuebar hidden" id="vuebar" role="group" aria-label="Affichage de l'application"><small>Affichage</small><div class="seg"><button data-vue="ordi">🖥 Ordinateur</button><button data-vue="mobile">📱 Mobile</button></div></div>
<button class="vueflot hidden" id="vueflot" data-vue="ordi">🖥 Vue ordinateur</button>

<script>
(function(){
  const app = document.getElementById('app'), nav = document.getElementById('nav');
  const S = { get(k){ try{return localStorage.getItem(k)}catch(e){return null} }, set(k,v){ try{localStorage.setItem(k,v)}catch(e){} }, del(k){ try{localStorage.removeItem(k)}catch(e){} } };
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const fmt = (n, d) => (Number(n)||0).toLocaleString('fr-FR', {maximumFractionDigits: 2}).replace(/[  ]/g, ' ') + (d ? ' ' + d : '');
  const short = n => { n = Number(n)||0; return n >= 1e6 ? (n/1e6).toFixed(1).replace('.0','') + ' M' : n >= 1e3 ? Math.round(n/1e3) + ' k' : String(Math.round(n)); };

  const SS = { get(k){ try{return sessionStorage.getItem(k)}catch(e){return null} }, set(k,v){ try{sessionStorage.setItem(k,v)}catch(e){} } };
  const VUES = ['home','orders','abandons','tiktok','products','settings','apercu'];
  /* ---------- Affichage Ordinateur / Mobile (sur PC) ---------- */
  const grandEcran = matchMedia('(min-width: 1000px)');
  function appliquerVue(){
    const pref = S.get('adm_affichage') || 'ordi', ordi = grandEcran.matches && pref !== 'mobile';
    document.documentElement.classList.toggle('ordi', ordi);
    const vb = document.getElementById('vuebar'), vf = document.getElementById('vueflot');
    if (vb){ vb.classList.toggle('hidden', !ordi || !key); vb.querySelectorAll('[data-vue]').forEach(b => b.classList.toggle('on', b.dataset.vue === (ordi ? 'ordi' : 'mobile'))); }
    if (vf) vf.classList.toggle('hidden', ordi || !grandEcran.matches || !key);
  }
  document.addEventListener('click', e => { const b = e.target.closest('[data-vue]'); if (!b) return; S.set('adm_affichage', b.dataset.vue); appliquerVue(); if (typeof render === 'function' && D !== undefined) render(); });
  grandEcran.addEventListener ? grandEcran.addEventListener('change', () => { appliquerVue(); render(); }) : 0;
  const vueDemandee = new URLSearchParams(location.search).get('v');
  let key = S.get('adm_key') || '', D = null, view = VUES.includes(vueDemandee) ? vueDemandee : (VUES.includes(SS.get('adm_view')) ? SS.get('adm_view') : 'home'), metric = 'ventes', periode = SS.get('adm_periode') || 'jour', filtre = SS.get('adm_filtre') || 'Toutes', q = '';
  let scrollAReprendre = Number(SS.get('adm_scroll')) || 0;
  addEventListener('pagehide', () => { SS.set('adm_view', view); SS.set('adm_scroll', String(Math.round(scrollY))); SS.set('adm_filtre', filtre); SS.set('adm_periode', periode); });
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden'){ SS.set('adm_view', view); SS.set('adm_scroll', String(Math.round(scrollY))); } });
  let precharge = false, sound = S.get('adm_sound') !== '0', lastNum = S.get('adm_last') || '', pubData = null, timer = null, busy = false;

  /* ---------- Son de nouvelle commande ---------- */
  let ctx = null, buf = null, unlocked = false;
  function unlock(){
    try {
      ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
      if (ctx.state === 'suspended') ctx.resume();
      if (!buf && !unlocked){ unlocked = true; fetch('kaching.mp3').then(r => r.arrayBuffer()).then(a => ctx.decodeAudioData(a)).then(b => buf = b).catch(() => {}); }
    } catch(e){}
  }
  document.addEventListener('pointerdown', unlock, {passive:true});
  function chime(){
    if (!sound) return;
    unlock(); if (!ctx) return;
    try { navigator.vibrate && navigator.vibrate(70); } catch(e){}
    if (buf){
      const src = ctx.createBufferSource(), g = ctx.createGain(); g.gain.value = 1;
      src.buffer = buf; src.connect(g).connect(ctx.destination); src.start(ctx.currentTime + .14);
      return;
    }
    const t0 = ctx.currentTime + .02;
    [[1318.5,0],[1760,.11],[2637,.22]].forEach(([f, dt], i) => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = i === 2 ? 'triangle' : 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(0, t0 + dt); g.gain.linearRampToValueAtTime(.32, t0 + dt + .01);
      g.gain.exponentialRampToValueAtTime(.001, t0 + dt + (i === 2 ? .9 : .35));
      o.connect(g).connect(ctx.destination); o.start(t0 + dt); o.stop(t0 + dt + 1);
    });
  }
  async function notifyNew(o){
    chime();
    const t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role','status');
    t.innerHTML = `<div class="e">🛒</div><div><b>Nouvelle commande n°${esc(o.numero)}</b>${esc(fmt(o.total, o.devise))} · ${esc(o.pays)}</div>`;
    t.onclick = () => { t.remove(); go('orders'); };
    document.body.appendChild(t); setTimeout(() => t.remove(), 7000);
    try {
      if ('Notification' in window && Notification.permission === 'granted'){
        const reg = await navigator.serviceWorker?.getRegistration();
        if (document.visibilityState !== 'visible'){
          const opts = { body: `${fmt(o.total, o.devise)} · ${o.produit} · ${o.pays}`, icon: 'icon-192.png', badge: 'icon-192.png', tag: 'cmd-' + o.numero, vibrate: [70, 80, 200] };
          if (reg) reg.showNotification('🛒 Nouvelle commande n°' + o.numero, opts); else new Notification('🛒 Nouvelle commande n°' + o.numero, opts);
        }
      }
    } catch(e){}
  }

  /* ---------- Échanges avec le Google Sheets ---------- */
  async function call(body){
    const r = await fetch(API, {method:'POST', body: JSON.stringify(Object.assign({key}, body))});
    const j = await r.json();
    if (!j.ok) throw new Error(j.erreur || 'Erreur');
    return j;
  }
  async function refresh(silent){
    if (busy) return; busy = true;
    try {
      const demande = periode;
      const j = await call(dashBody());
      if (demande !== periode) return;
      const pareil = D && JSON.stringify(D) === JSON.stringify(j);
      D = j;
      try { S.set('adm_dash_' + periode, JSON.stringify(j)); } catch(e){}
      setBusy(false);
      initPush(); swCache();
      if (j.dernier){
        if (lastNum && j.dernier.numero !== lastNum) notifyNew(j.dernier);
        lastNum = j.dernier.numero; S.set('adm_last', lastNum);
      }
      const nouv = j.commandes.filter(o => o.statut === 'Nouvelle').length;
      const dn = document.getElementById('dotNew'); dn.textContent = nouv > 99 ? '99+' : nouv; dn.classList.toggle('hidden', !nouv);
      const ar = j.abandons.filter(a => !a.suivi || a.suivi === 'À relancer').length;
      const da = document.getElementById('dotAb'); da.textContent = ar > 99 ? '99+' : ar; da.classList.toggle('hidden', !ar);
      if (!pareil && !document.querySelector('.overlay') && !(view === 'orders' && document.activeElement && document.activeElement.id === 'q')) render();
      openFromLink();
      if (!precharge){ precharge = true; setTimeout(() => { traiterFile(); loadPub(); loadPR(); loadTT(); }, 400); }
    } catch(e){
      if (/mot de passe/i.test(e.message)){ logout('Mot de passe incorrect.'); }
      else if (!silent && !D){ app.innerHTML = `<div class="login"><h1>Connexion impossible</h1><p>Vérifie ta connexion internet, puis réessaie.</p><button class="btn" id="retry">Réessayer</button></div>`; document.getElementById('retry').onclick = () => refresh(); }
    } finally { busy = false; setBusy(false); }
  }
  function setBusy(on){ const el = document.getElementById('sync'); if (el) el.classList.toggle('hidden', !on); }
  function fromCache(p){ try { const c = S.get('adm_dash_' + p); return c ? JSON.parse(c) : null; } catch(e){ return null; } }
  let opened = false;
  function openFromLink(){
    if (opened || !D) return; opened = true;
    const n = new URLSearchParams(location.search).get('cmd');
    if (n && D.commandes.some(o => o.numero === n)){ history.replaceState(null, '', location.pathname); view = 'orders'; [...nav.children].forEach(b => b.classList.toggle('on', b.dataset.v === 'orders')); render(); detail(n); }
  }
  function schedule(){
    clearTimeout(timer);
    timer = setTimeout(async () => { if (view === 'tiktok') loadTT(); await refresh(true); schedule(); }, document.visibilityState === 'visible' ? 15000 : 60000);
  }
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && key){ refresh(true); schedule(); } });

  /* ---------- Connexion ---------- */
  function login(msg){
    nav.classList.add('hidden');
    app.innerHTML = `<form class="login" id="lf">
      <div class="logo">A</div>
      <h1>Ta boutique, en direct.</h1>
      <p>Entre le mot de passe de l'application. Tu le trouves dans ton Google Sheets, onglet « Réglages ».</p>
      <input id="pw" type="password" inputmode="numeric" autocomplete="current-password" placeholder="Mot de passe" aria-label="Mot de passe">
      <button class="btn" type="submit">Ouvrir mon tableau de bord</button>
      <div class="err" id="lerr">${esc(msg || '')}</div></form>`;
    document.getElementById('lf').onsubmit = async e => {
      e.preventDefault(); unlock();
      key = document.getElementById('pw').value.trim();
      const b = e.target.querySelector('.btn'); b.textContent = 'Connexion…';
      try { const j = await call(dashBody()); S.set('adm_key', key); D = j; try { S.set('adm_dash_' + periode, JSON.stringify(j)); } catch(x){} initPush(); lastNum = j.dernier ? j.dernier.numero : ''; S.set('adm_last', lastNum); start(); }
      catch(err){ b.textContent = 'Ouvrir mon tableau de bord'; document.getElementById('lerr').textContent = /mot de passe/i.test(err.message) ? 'Mot de passe incorrect.' : 'Connexion impossible. Vérifie ta connexion internet.'; }
    };
  }
  function logout(msg){ key = ''; S.del('adm_key'); appliquerVue(); clearTimeout(timer); login(msg); }
  function start(){ nav.classList.remove('hidden'); render(); schedule(); }

  /* ---------- Navigation ---------- */
  function go(v){ view = v; SS.set('adm_view', v); scrollAReprendre = 0; [...nav.children].forEach(b => b.classList.toggle('on', b.dataset.v === v)); render(); scrollTo({top:0}); }
  nav.addEventListener('click', e => { const b = e.target.closest('button'); if (b) go(b.dataset.v); });
  function render(){
    if (!D && view !== 'products' && view !== 'tiktok' && view !== 'apercu') { app.innerHTML = '<div class="loading">Chargement…</div>'; return; }
    appliquerVue();
    [...nav.children].forEach(b => b.classList.toggle('on', b.dataset.v === view));
    ({home, orders, abandons, products, settings, tiktok, apercu}[view])();
    if (scrollAReprendre){ const y = scrollAReprendre; requestAnimationFrame(() => scrollTo(0, y)); if (view !== 'tiktok' || TT) scrollAReprendre = 0; }
  }

  /* ---------- Accueil ---------- */
  /* ---------- Périodes (comme Shopify) ---------- */
  const PERIODES = [['jour', "Aujourd'hui"], ['hier', 'Hier'], ['m30', '30 dernières minutes'], ['h12', '12 dernières heures'],
    ['7j', '7 derniers jours'], ['30j', '30 derniers jours'], ['90j', '90 derniers jours'], ['365j', '365 derniers jours'],
    ['moisDernier', 'Mois dernier'], ['12mois', '12 derniers mois'], ['anneeDerniere', 'Année dernière'],
    ['semaine', 'Semaine à ce jour'], ['mois', 'Mois à ce jour'], ['trimestre', 'Trimestre à ce jour'], ['annee', 'Année à ce jour']];
  const isoJ = x => x.getFullYear() + '-' + String(x.getMonth() + 1).padStart(2, '0') + '-' + String(x.getDate()).padStart(2, '0');
  const MOISC = ['janv.', 'févr.', 'mars', 'avr.', 'mai', 'juin', 'juil.', 'août', 'sept.', 'oct.', 'nov.', 'déc.'];
  const jolieDate = s => { const [y, m, d] = s.split('-').map(Number); return d + ' ' + MOISC[m - 1] + (y !== new Date().getFullYear() ? ' ' + y : ''); };
  function plage(k){
    const t = new Date(); t.setHours(0, 0, 0, 0);
    const j = n => { const x = new Date(t); x.setDate(x.getDate() + n); return x; };
    const P = (a, b) => ({debut: isoJ(a), fin: isoJ(b)});
    if (/^f:/.test(k)){ const [, a, b] = k.split(':'); return {debut: a, fin: b}; }
    switch (k){
      case 'hier': return P(j(-1), j(-1));
      case 'm30': return {minutes: 30};
      case 'h12': return {minutes: 720};
      case '7j': return P(j(-6), t);
      case '30j': return P(j(-29), t);
      case '90j': return P(j(-89), t);
      case '365j': return P(j(-364), t);
      case 'moisDernier': return P(new Date(t.getFullYear(), t.getMonth() - 1, 1), new Date(t.getFullYear(), t.getMonth(), 0));
      case '12mois': return P(new Date(t.getFullYear() - 1, t.getMonth(), t.getDate() + 1), t);
      case 'anneeDerniere': return P(new Date(t.getFullYear() - 1, 0, 1), new Date(t.getFullYear() - 1, 11, 31));
      case 'semaine': return P(j(-((t.getDay() + 6) % 7)), t);
      case 'mois': return P(new Date(t.getFullYear(), t.getMonth(), 1), t);
      case 'trimestre': return P(new Date(t.getFullYear(), Math.floor(t.getMonth() / 3) * 3, 1), t);
      case 'annee': return P(new Date(t.getFullYear(), 0, 1), t);
      case 'tout': return {periode: 'tout'};
      default: return P(t, t);
    }
  }

  function drawChart(){
    const el = document.getElementById('chart'); if (!el) return;
    const b = D.serieP[metric], n = b.length;
    let a = D.serie[metric];
    if (D.partiel) a = a.slice(0, D.partiel); else if (periode === 'jour') a = a.slice(0, new Date().getHours() + 1);
    const W = el.clientWidth || 340, H = 200, L = 58, R = 6, T = 12, B = 26;
    const max = Math.max(1, ...a, ...b);
    const xn = n;
    const step = (v => { const m = Math.pow(10, Math.floor(Math.log10(v))); const k = v / m; return (k <= 1 ? 1 : k <= 2 ? 2 : k <= 5 ? 5 : 10) * m; })(max / 3);
    const top = step * Math.ceil(max / step);
    const x = i => L + (W - L - R) * (xn === 1 ? .5 : i / (xn - 1));
    const y = v => T + (H - T - B) * (1 - v / top);
    const path = arr => { let d = ''; arr.forEach((v,i) => { const X = x(i), Y = y(v); if (!i) d = `M${X},${Y}`; else { const X0 = x(i-1), Y0 = y(arr[i-1]), cx = (X0 + X) / 2; d += ` C${cx},${Y0} ${cx},${Y} ${X},${Y}`; } }); return d; };
    let grid = '';
    for (let v = 0; v <= top + 1e-9; v += step){
      grid += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="rgba(255,255,255,.12)"/>
        <text x="${L - 8}" y="${y(v) + 4}" text-anchor="end" fill="rgba(255,255,255,.66)" font-size="12" font-family="Figtree, sans-serif",sans-serif>${metric === 'ventes' ? short(v) : Math.round(v)}</text>`;
    }
    const labels = D.etiquettes ? [...new Set([0, Math.floor((n-1)/2), n-1])].map(i => ({i, t: D.etiquettes[i] || ''}))
      : D.parJour ? [0, Math.floor((n-1)/2), n-1].map(i => ({i, t: (() => { const [dd, mm] = D.debut.split('/').map(Number); const d = new Date(new Date().getFullYear(), mm-1, dd + i); return d.getDate() + '/' + (d.getMonth()+1); })()}))
      : [0, 10, 20].map(i => ({i, t: String(i).padStart(2,'0') + ':00'}));
    const xl = labels.map(l => `<text x="${x(l.i)}" y="${H - 6}" text-anchor="middle" fill="rgba(255,255,255,.66)" font-size="12" font-family="Figtree, sans-serif",sans-serif>${l.t}</text>`).join('');
    const unit = metric === 'ventes' ? D.devise : metric;
    el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Évolution des ${esc(metric)} (${esc(unit)})">${grid}
      <path d="${path(b)}" fill="none" stroke="rgba(255,255,255,.5)" stroke-width="2" stroke-dasharray="4 4"/>

  }

  /* File d'envoi : l'écran répond tout de suite, le Google Sheets est mis à jour en arrière-plan, dans l'ordre */
  let FILE = []; try { FILE = JSON.parse(S.get('adm_file') || '[]') || []; } catch(e){}
  const idMap = {}, uploads = {}, apercus = {};
  let envoiEnCours = false;
  const slugJS = v => String(v || '').trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9-]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 60);
  function idLibreLocal(base, sauf){
    base = slugJS(base) || 'produit'; const ids = (PR ? PR.produits : []).map(p => p.id);
    let id = base, n = 2; while (ids.includes(id) && id !== sauf) id = base + '-' + n++; return id;
  }
  function memoPR(){ try { S.set('adm_prods', JSON.stringify(PR)); } catch(e){} }
  function memoFile(){ try { S.set('adm_file', JSON.stringify(FILE)); } catch(e){} }
  function syncBadge(erreur){
    let b = document.getElementById('savebadge');
    if (!FILE.length){ if (b) b.remove(); return; }
    if (!b){ b = document.createElement('div'); b.id = 'savebadge'; b.className = 'savebadge'; b.setAttribute('role', 'status'); document.body.appendChild(b); }
    b.textContent = erreur ? '⚠️ Pas de connexion : nouvel essai automatique…' : '⏳ Enregistrement dans le Google Sheets…';
    b.classList.toggle('err', !!erreur);

  function enfiler(op){ FILE.push(op); memoFile(); syncBadge(); traiterFile(); }
  async function resoudre(v){
    if (typeof v !== 'string' || !v.startsWith('upload:')) return v;
    try { return uploads[v] ? await uploads[v] : ''; } catch(e){ return ''; }
  }
  async function preparer(op){
    const o = JSON.parse(JSON.stringify(op));
    if (o.ancienId && idMap[o.ancienId]) o.ancienId = idMap[o.ancienId];
    if (o.id && idMap[o.id]) o.id = idMap[o.id];
    if (o.produit){
      const P = o.produit;
      P.photos = (await Promise.all((P.photos || []).map(resoudre))).filter(Boolean);
      P.description = (await Promise.all(String(P.description || '').split('\n').map(resoudre))).filter(Boolean).join('\n');
      for (const a of P.avis || []) a.photo = await resoudre(a.photo);
    }
    return Object.assign({type: 'produits'}, o);
  }
  function remplacerPartout(de, vers){
    if (!PR) return;
    PR.produits.forEach(p => {
      p.photos = p.photos.map(u => u === de ? vers : u).filter(Boolean);
      p.description = String(p.description || '').split('\n').map(l => l === de ? vers : l).filter(Boolean).join('\n');
      (p.avis || []).forEach(a => { if (a.photo === de) a.photo = vers; });
    });
    memoPR();
  }
  async function traiterFile(){
    if (envoiEnCours || !FILE.length) return;
    envoiEnCours = true; syncBadge();
    while (FILE.length){
      const op = FILE[0];
      try {
        const r = await call(await preparer(op));
        if (op.action === 'sauver' && r.id){
          const voulu = op.produit.id;
          if (voulu && r.id !== voulu){ idMap[voulu] = r.id; const p = PR && PR.produits.find(x => x.id === voulu); if (p){ p.id = r.id; memoPR(); } }
        }
        FILE.shift(); memoFile();
      } catch(e){
        if (/mot de passe|obligatoire|introuvable|vide/i.test(e.message)){ FILE.shift(); memoFile(); alert('Non enregistré : ' + e.message); continue; }
        envoiEnCours = false; syncBadge(true); setTimeout(traiterFile, 4000); return;
      }
    }
    envoiEnCours = false; syncBadge();
    pubP = null; loadPub(); loadPR();
  }
  addEventListener('online', traiterFile);
  try { PR = JSON.parse(S.get('adm_prods') || 'null'); } catch(e){}

      if (!PR && view === 'products'){ const pl = document.getElementById('pl'); if (pl) pl.innerHTML = /introuvable|inconnu/i.test(e.message) ? 'Mets à jour le code Apps Script (Code.gs), puis crée une nouvelle version.' : 'Connexion impossible. Réessaie.'; }

  }
  function prixResume(p){

  function dupliquer(id){

  // Réduit la photo sur le téléphone avant l'envoi (rapide, même en 3G)
  function lirePhoto(file){
    return new Promise((ok, ko) => {
      const fr = new FileReader();
      fr.onerror = ko;
      fr.onload = () => { const im = new Image(); im.onerror = ko; im.onload = () => {
        const k = Math.min(1, 1400 / Math.max(im.width, im.height)), c = document.createElement('canvas');
        c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
        const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(im, 0, 0, c.width, c.height);
        ok(c.toDataURL('image/jpeg', 0.84)); }; im.src = fr.result; };
      fr.readAsDataURL(file);
    });
  }
  async function photoInstantanee(file, nom){
    const b64 = await lirePhoto(file);
    const tok = 'upload:' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
    apercus[tok] = b64;
    const envoi = async essai => { try { return (await call({type: 'produits', action: 'image', b64, mime: 'image/jpeg', nom})).url; } catch(e){ if (essai < 4){ await new Promise(r => setTimeout(r, 3000)); return envoi(essai + 1); } throw e; } };
    uploads[tok] = envoi(0).then(url => { apercus[url] = b64; remplacerPartout(tok, url); return url; });
    uploads[tok].catch(() => {});
    return tok;
  }
  function choisirPhotos(multiple){

  }

        ${t('Livrées', p.livrees, 'yes')}
        ${t('Annulées / injoignables', p.perdues, p.perdues ? 'warn' : '')}
        ${t('Montant commandé', F(p.ca))}
        ${t('Encaissé (livré)', F(p.caLivre), 'yes')}
        ${autre ? '' : t('Rentabilité', p.depense ? 'x' + ratio(p.caLivre, p.depense).toFixed(1).replace('.', ',') : '–')}
        ${autre ? '' : t('Coût par visite', p.visites && p.depense ? F(p.depense / p.visites) : '–')}
      </div>
      ${autre ? '' : `<div class="card" style="margin-top:12px"><h3>Budget de la promotion</h3>
        <p class="tag">${p.estimee ? `Dépense calculée automatiquement : <b>${esc(fmt(Math.round(p.depenseTotal), p.devise))}</b> sur ${esc(fmt(p.budget, p.devise))}${p.diffusion ? ' depuis le ' + esc(p.diffusion) : ''}.` : p.depenseTotal ? 'Dépense réelle saisie à la main.' : 'Mets le budget et la durée choisis dans TikTok : la dépense se calcule toute seule chaque jour.'}</p>
        <div class="frow" style="margin-top:10px"><input class="field" id="pdBud" type="number" inputmode="decimal" value="${esc(p.budget || '')}" placeholder="Budget total" aria-label="Budget total"><select class="field" id="pdDev">${['FCFA','USD','EUR'].map(d => `<option ${d === p.devise ? 'selected' : ''}>${d}</option>`).join('')}</select></div>
        <input class="field" id="pdDur" type="number" inputmode="numeric" value="${esc(p.duree || '')}" placeholder="Durée (jours)" aria-label="Durée en jours" style="margin-top:8px">
        <button class="btn blue" id="pdBudOk" style="margin-top:10px">Enregistrer le budget</button>
        <details class="pays1" style="margin-top:12px"><summary><b>Corriger avec la dépense réelle</b><span class="tag">facultatif</span></summary>
          <p class="tag" style="margin:8px 0">À la fin, si TikTok affiche un autre montant dépensé, mets-le ici : il remplacera le calcul automatique.</p>
          <input class="field" id="pdDep" type="number" inputmode="decimal" value="${esc(p.estimee ? '' : (p.depenseTotal || ''))}" placeholder="Montant dépensé selon TikTok">
          <button class="btn ghost" id="pdSave" style="margin-top:8px">Enregistrer la dépense réelle</button></details></div>
        <label class="lbl">Lien de la promotion</label>
        <div class="linkbox">${esc(p.lien)}</div>
        <button class="copy" data-copy="${esc(p.lien)}">📋 Copier le lien</button>`}
      <div class="block" style="margin-top:6px"><h3>Commandes (${p.liste.length})</h3>
        ${p.liste.length ? p.liste.map(o => `<button class="order" data-onum="${esc(o.numero)}"><div class="l1"><b>#${esc(o.numero)}</b><span>${esc(fmt(o.total, o.devise))}</span></div><div class="l2">${esc(o.nom || 'Sans nom')} · ${esc(dayName(o.date))} ${esc(o.heure)}</div><div class="l3">${badge(o.statut)}<span class="tag">${esc(o.pays)}</span></div></button>`).join('') : '<div class="empty">Aucune commande sur cette période.</div>'}
      </div>
      ${autre ? '' : `<button class="btn ghost" id="pdStat">${p.statut === 'Active' ? 'Marquer comme terminée' : p.statut === 'En attente' ? 'TikTok a approuvé : passer en active' : 'Réactiver la promotion'}</button>
        <button class="btn red" id="pdDel" style="margin-top:10px">🗑 Supprimer cette promotion</button>`}
      <button class="btn ghost" data-close style="margin-top:10px">Fermer</button>`);
    ov.querySelectorAll('[data-onum]').forEach(b => b.onclick = () => { if (D && D.commandes.some(o => o.numero === b.dataset.onum)){ ov.remove(); detail(b.dataset.onum); } });
    const sv = ov.querySelector('#pdSave');
    if (sv) sv.onclick = async () => {
      sv.textContent = 'Enregistrement…'; sv.disabled = true;
      try { await call({type: 'tiktok', action: 'depense', code: p.code, total: ov.querySelector('#pdDep').value || 0, devise: ov.querySelector('#pdDev').value}); sv.textContent = 'Dépense enregistrée ✓'; await loadTT(true); setTimeout(() => { ov.remove(); drawTT(); }, 600); }
      catch(e){ sv.disabled = false; sv.textContent = 'Échec : réessayer'; alert('Raison : ' + e.message); }
    };
    const bo = ov.querySelector('#pdBudOk');
    if (bo) bo.onclick = async () => {
      bo.textContent = 'Enregistrement…'; bo.disabled = true;
      try { await call({type: 'tiktok', action: 'budget', code: p.code, budget: ov.querySelector('#pdBud').value, duree: ov.querySelector('#pdDur').value, devise: ov.querySelector('#pdDev').value}); bo.textContent = 'Budget enregistré ✓'; await loadTT(true); setTimeout(() => { ov.remove(); drawTT(); }, 600); }
      catch(e){ bo.disabled = false; bo.textContent = 'Échec : réessayer'; alert('Raison : ' + e.message); }
    };
    const st = ov.querySelector('#pdStat');
    if (st) st.onclick = async () => {
      st.textContent = '…';
      try { await call({type: 'tiktok', action: 'statut', code: p.code, statut: p.statut === 'Active' ? 'Terminée' : 'Active'}); await loadTT(true); ov.remove(); drawTT(); }
      catch(e){ st.textContent = 'Échec : réessayer'; alert('Raison : ' + e.message); }
    };
    const del = ov.querySelector('#pdDel');
    if (del) del.onclick = async () => {
      if (!(await confirmer({titre: 'Supprimer cette promotion ?', texte: `Tu es sur le point de supprimer <b>« ${esc(p.nom)} »</b> (n°${esc(p.code)}) avec ses visites et ses dépenses.<br><br><b>Cette action est irréversible.</b>` + (p.commandes ? `<br>Ses ${p.commandes} commande(s) resteront dans tes commandes.` : ''), ok: 'Oui, supprimer définitivement'}))) return;
      // Disparaît tout de suite ; l'effacement dans le Google Sheets continue en arrière-plan, avec nouveaux essais
      TT.promos = TT.promos.filter(x => x.code !== p.code); try { S.set('adm_tt_' + ttPer, JSON.stringify(TT)); } catch(e){}
      ov.remove(); drawTT(); toast('🗑 Promotion supprimée');
      let err = null;
      for (let i = 0; i < 4; i++){
        try { await call({type: 'tiktok', action: 'supprimer', code: p.code}); err = null; break; }
        catch(e){ err = e; if (/mot de passe/i.test(e.message)) break; await new Promise(r => setTimeout(r, 2500)); }
      }
      if (err){ alert('La suppression n’a pas pu être enregistrée dans le Google Sheets.\nRaison : ' + err.message + '\n\nRéessaie dans un instant.'); }
      loadTT(true);
    };
  }

  /* ---------- Aperçu du site (comme Shopify) ---------- */
  let apVue = S.get('adm_apvue') || 'ordi', apProd = S.get('adm_approd') || '';
  function apercu(){
    const prods = PR ? PR.produits.filter(p => p.enLigne) : pubData ? pubData.produits : [];
    const lien = SITE + (apProd ? '?p=' + encodeURIComponent(apProd) : '');
    app.innerHTML = `<div class="page apage"><div class="aphead"><h1>Aperçu du site</h1>
        <div class="seg apseg" role="radiogroup" aria-label="Voir comme"><button data-av="ordi" class="${apVue === 'ordi' ? 'on' : ''}">🖥 Ordinateur</button><button data-av="mobile" class="${apVue === 'mobile' ? 'on' : ''}">📱 Mobile</button></div></div>
      <div class="aptools"><select class="field" id="apP" aria-label="Page à afficher"><option value="">Page d'accueil</option>${prods.map(p => `<option value="${esc(p.id)}" ${p.id === apProd ? 'selected' : ''}>${esc(p.nom)}</option>`).join('')}</select>
        <button class="btn ghost small" id="apR">↻ Recharger</button><a class="btn ghost small" href="${esc(lien)}" target="_blank" rel="noopener">Ouvrir ↗</a></div>
      <p class="tag" style="margin:2px 0 10px">L'aperçu ne compte ni visite ni pixel.</p>
      <div class="apstage ${apVue}" id="apStage"><div class="apframe" id="apFrame"><iframe id="apI" title="Aperçu du site" src="${esc(lien + (apProd ? '&' : '?') + 'apercu=1')}"></iframe></div></div></div>`;
    app.querySelectorAll('[data-av]').forEach(b => b.onclick = () => { apVue = b.dataset.av; S.set('adm_apvue', apVue); apercu(); });
    document.getElementById('apP').onchange = e => { apProd = e.target.value; S.set('adm_approd', apProd); apercu(); };
    document.getElementById('apR').onclick = () => { const i = document.getElementById('apI'); i.src = i.src; };
    ajusterApercu();
    if (!PR && !pubData) loadPub().then(() => { if (view === 'apercu') apercu(); });
  }
  function ajusterApercu(){
    const f = document.getElementById('apFrame'), i = document.getElementById('apI'); if (!f || !i) return;
    if (apVue === 'ordi'){
      const W = 1280, k = Math.min(1, f.clientWidth / W);
      i.style.width = W + 'px'; i.style.height = (f.clientHeight / k) + 'px'; i.style.transform = `scale(${k})`;
    } else { i.style.width = ''; i.style.height = ''; i.style.transform = ''; }
  }
  addEventListener('resize', () => { if (view === 'apercu') ajusterApercu(); });

  /* ---------- Réglages ---------- */
  function settings(){
    const perm = 'Notification' in window ? Notification.permission : 'unsupported';
    app.innerHTML = `<div class="page"><h1>Réglages</h1>
      <div class="set"><div><b>Son des nouvelles commandes</b><p>Un « ding » à chaque commande, quand l'application est ouverte.</p></div><button class="switch ${sound?'on':''}" id="sw" role="switch" aria-checked="${sound}" aria-label="Son des nouvelles commandes"></button></div>
      <div class="set"><div><b>Tester le son</b><p>Vérifie que le volume de ton téléphone est assez fort.</p></div><button class="chip" style="background:var(--surface);color:var(--ink);border-color:var(--line)" id="test">Écouter</button></div>
      <div class="set"><div><b>Notifications (même application fermée)</b><p>${!D.onesignal ? 'À configurer : ajoute l’App ID OneSignal dans ton Google Sheets.' : pushOn ? 'Activées sur ce téléphone ✓' : perm === 'denied' ? 'Bloquées : autorise les notifications pour ce site dans les réglages de Chrome.' : 'Reçois chaque commande même téléphone verrouillé.'}</p></div>${D.onesignal && !pushOn && perm !== 'denied' ? '<button class="chip" style="background:var(--main);border-color:var(--main)" id="notifOS">Activer</button>' : ''}</div>
      <div class="set"><div><b>Tester les notifications</b><p>Envoie une notification à l'application et un message WhatsApp de test. Verrouille ton téléphone juste après avoir appuyé.</p></div><button class="chip" style="background:var(--main);border-color:var(--main)" id="testPush">Tester</button></div>
      <div class="help" id="diag" style="margin-top:6px;font-size:13px;word-break:break-word">Diagnostic : appuie sur « Tester ».</div>
      <div class="set"><div><b>Son « caisse » pour les notifications</b><p>Télécharge-le, puis choisis-le comme son de notification de l’application dans les réglages Android.</p></div><a class="chip" style="background:var(--surface);color:var(--ink);border-color:var(--line)" href="kaching.mp3" download="ABROMARKET-commande.mp3">Télécharger</a></div>
      <div class="set"><div><b>Google Sheets</b><p>Produits, prix, pays, agences et commandes.</p></div><a class="chip" style="background:var(--surface);color:var(--ink);border-color:var(--line)" href="${esc(D.sheetUrl)}" target="_blank" rel="noopener">Ouvrir</a></div>
      <div class="set"><div><b>Aperçu du site</b><p>Voir ta boutique comme sur ordinateur ou sur mobile.</p></div><button class="chip" style="background:var(--surface);color:var(--ink);border-color:var(--line)" data-go2="apercu">Voir</button></div>
      <div class="set"><div><b>Ma boutique</b><p>La page que voient tes clients.</p></div><a class="chip" style="background:var(--surface);color:var(--ink);border-color:var(--line)" href="${SITE}" target="_blank" rel="noopener">Ouvrir</a></div>
      <div class="help"><b>Installer l'application sur ton téléphone</b><br>Android (Chrome) : menu ⋮ → « Ajouter à l'écran d'accueil » ou « Installer l'application ».<br>iPhone (Safari) : bouton Partager → « Sur l'écran d'accueil » (obligatoire sur iPhone pour les notifications).</div>
      <button class="btn ghost" id="out" style="margin-top:18px">Se déconnecter</button></div>`;
    document.getElementById('sw').onclick = () => { sound = !sound; S.set('adm_sound', sound ? '1' : '0'); if (sound) chime(); settings(); };
    document.getElementById('test').onclick = () => { const s = sound; sound = true; chime(); sound = s; };
    document.getElementById('out').onclick = () => logout();
    app.querySelectorAll('[data-go2]').forEach(b => b.onclick = () => go(b.dataset.go2));
    document.getElementById('testPush').onclick = async e => {
      const b = e.target, dg = document.getElementById('diag'); b.textContent = '…';
      let regs = [];
      try { regs = (await navigator.serviceWorker.getRegistrations()).map(r => r.scope.replace(location.origin, '') + ' (' + ((r.active && r.active.scriptURL) || '').split('/').pop().split('?')[0] + ')'); } catch(x){}
      const os = window.OneSignal && OneSignal.User ? OneSignal.User.PushSubscription : null;
      const lignes = [
        'Permission du téléphone : ' + ('Notification' in window ? Notification.permission : 'non disponible'),
        'Module OneSignal : ' + (window.OneSignal && OneSignal.User ? 'chargé' : 'NON chargé') + (osErr ? ' – erreur : ' + osErr : ''),
        'Abonné : ' + (os ? (os.optedIn ? 'oui' : 'non') + (os.id ? ' (id ' + os.id.slice(0, 8) + '…)' : ' (aucun id)') : '?'),
        'Services : ' + (regs.join(', ') || 'aucun')
      ];
      try { const r = await call({type: 'testpush'}); lignes.push('Envoi : ' + (r.resultat || r.code)); if (r.whatsapp) lignes.push('WhatsApp (test) : ' + r.whatsapp); if (r.dernierWhatsapp) lignes.push('WhatsApp (dernière commande) : ' + r.dernierWhatsapp); }
      catch(err){ lignes.push('Envoi : erreur ' + err.message); }
      dg.innerHTML = lignes.map(esc).join('<br>'); b.textContent = 'Tester';
    };
  }

  /* ---------- Démarrage ---------- */
  let swFait = false;
  function swCache(){ if (swFait || !D || D.onesignal || !('serviceWorker' in navigator)) return; swFait = true; navigator.serviceWorker.register('OneSignalSDKWorker.js', {scope: './'}).catch(() => {}); }
  if (key){
    nav.classList.remove('hidden');
    D = fromCache(periode);
    render();
    setBusy(true);
    refresh().then(() => { if (key) schedule(); });
  }
  else login();
  addEventListener('resize', () => { if (view === 'home' && D) drawChart(); });
})();
</script>
</body>
</html>
