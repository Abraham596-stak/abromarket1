<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Vendoo – Ta boutique en ligne, paiement à la livraison</title>
<meta name="description" content="Crée jusqu’à 30 boutiques en ligne avec paiement à la livraison, commandes sur WhatsApp et application de gestion.">
<meta name="theme-color" content="#5B2EE6">
<link rel="icon" href="favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--main:#5B2EE6;--main2:#4318C9;--ink:#14112B;--soft:#5E5A78;--line:#E6E2F5;--bg:#F6F4FF;--card:#fff;--ok:#12805C;--warn:#B45309;--bad:#B42318;--gold:#FFC53D}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--bg)}
a{color:var(--main)}
button,input,select{font:inherit}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
header{position:sticky;top:0;z-index:5;background:rgba(246,244,255,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;justify-content:space-between;height:60px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:21px;letter-spacing:-.02em;text-decoration:none;color:var(--ink)}
.brand img{width:34px;height:34px}
.lnk{background:none;border:0;color:var(--main);font-weight:700;padding:8px;cursor:pointer}
.hero{padding:40px 0 18px;text-align:center}
.hero h1{font-size:34px;line-height:1.12;letter-spacing:-.03em;margin:0 0 12px}
.hero h1 em{font-style:normal;color:var(--main)}
.hero p{color:var(--soft);font-size:17px;margin:0 auto 22px;max-width:440px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;border:0;border-radius:14px;background:var(--main);color:#fff;font-weight:800;font-size:17px;cursor:pointer;text-decoration:none;padding:0 18px}
.btn:active{transform:scale(.99)}
.btn.sec{background:#EEEAFE;color:var(--main2)}
.btn.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line)}
.btn[disabled]{opacity:.6}
.feat{display:grid;gap:10px;margin:26px 0}
.feat div{display:flex;gap:12px;align-items:flex-start;background:var(--card);border-radius:16px;padding:14px 16px;border:1px solid var(--line)}
.feat b{display:block}
.feat span{color:var(--soft);font-size:14px}
.feat i{font-style:normal;font-size:22px;line-height:1.2}
h2{font-size:24px;letter-spacing:-.02em;margin:34px 0 12px}
.prix{display:grid;gap:12px}
.plan{background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:18px;position:relative}
.plan.top{border-color:var(--main);box-shadow:0 8px 28px rgba(91,46,230,.14)}
.plan .tag{position:absolute;top:-11px;right:16px;background:var(--gold);color:#3A2A00;font-size:12px;font-weight:800;padding:3px 10px;border-radius:99px}
.plan .p{font-size:30px;font-weight:800;letter-spacing:-.02em}
.plan .p small{font-size:15px;color:var(--soft);font-weight:600}
.plan ul{margin:8px 0 0;padding-left:18px;color:var(--soft);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin:14px 0}
.card h3{margin:0 0 10px;font-size:18px}
label{display:block;font-weight:700;font-size:14px;margin:12px 0 6px}
.field{width:100%;min-height:50px;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;background:#fff;color:var(--ink);outline:none}
.field:focus{border-color:var(--main)}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:#EEEAFE;border-radius:14px;padding:4px;margin:20px 0 6px}
.tabs button{border:0;background:none;border-radius:10px;min-height:44px;font-weight:800;color:var(--soft);cursor:pointer}
.tabs button.on{background:#fff;color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.msg{border-radius:12px;padding:12px 14px;margin:12px 0;font-size:15px}
.msg.err{background:#FEECEB;color:var(--bad)}
.msg.ok{background:#E7F6EF;color:var(--ok)}
.msg.warn{background:#FFF4E5;color:var(--warn)}
.ou{display:flex;align-items:center;gap:10px;color:var(--soft);font-size:13px;margin:16px 0}
.ou:before,.ou:after{content:"";flex:1;height:1px;background:var(--line)}
#gbtn{display:flex;justify-content:center;min-height:44px}
.statut{display:flex;align-items:center;justify-content:space-between;gap:10px}
.badge{font-size:13px;font-weight:800;padding:4px 10px;border-radius:99px;white-space:nowrap}
.b-actif{background:#E7F6EF;color:var(--ok)}.b-essai{background:#EEEAFE;color:var(--main2)}.b-grace,.b-attente{background:#FFF4E5;color:var(--warn)}.b-expire,.b-bloque{background:#FEECEB;color:var(--bad)}
.gros{font-size:28px;font-weight:800;letter-spacing:-.02em;margin:6px 0 0}
.soft{color:var(--soft);font-size:14px}
.choix{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.choix label{margin:0;border:1.5px solid var(--line);border-radius:14px;padding:12px;cursor:pointer;font-weight:600}
.choix input{accent-color:var(--main)}
.choix label:has(input:checked){border-color:var(--main);background:#F3EFFF}
.choix b{display:block;font-size:18px}
.choix s{display:block;font-size:13px}
.momo{background:#FFF8E1;border:1px dashed #E0B200;border-radius:14px;padding:14px;margin:12px 0}
.momo .num{font-size:22px;font-weight:800;letter-spacing:.02em}
.etapes{counter-reset:e;list-style:none;padding:0;margin:0}
.etapes li{counter-increment:e;position:relative;padding:0 0 16px 42px}
.etapes li:before{content:counter(e);position:absolute;left:0;top:0;width:28px;height:28px;border-radius:50%;background:var(--main);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:14px}
.etapes>li>b{display:block}
.etapes code{background:#F3EFFF;border-radius:6px;padding:1px 6px;font-size:14px}
.row{display:flex;gap:10px}
.row>*{flex:1}
.hist{width:100%;border-collapse:collapse;font-size:14px}
.hist td{padding:8px 0;border-top:1px solid var(--line)}
.hist td:last-child{text-align:right}
.copie{display:flex;gap:8px;align-items:center;background:#F3EFFF;border-radius:12px;padding:10px 12px;font-size:14px;word-break:break-all}
.copie button{flex:0 0 auto}
/* Guide de bienvenue */
.gv{position:fixed;inset:0;z-index:100;background:rgba(20,17,43,.55);display:flex;align-items:flex-end;justify-content:center}
.gvbox{background:#fff;width:100%;max-width:520px;border-radius:24px 24px 0 0;padding:22px 20px calc(18px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto}
@media (min-width:700px){.gv{align-items:center}.gvbox{border-radius:24px}}
@keyframes gvm{from{transform:translateY(30px);opacity:0}}
.gvtop{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.gvtop small{color:var(--soft);font-weight:700}
.gvem{font-size:52px;line-height:1;margin:6px 0 10px}
.gvbox h2{margin:0 0 8px;font-size:23px;letter-spacing:-.02em}
.gvbox p{color:var(--soft);margin:0 0 10px}
.gvbox ul{margin:0 0 10px;padding-left:20px}
.gvbox li{margin:4px 0}
.gvdots{display:flex;gap:6px;justify-content:center;margin:14px 0}
.gvdots i{width:7px;height:7px;border-radius:99px;background:var(--line)}
.gvdots i.on{width:22px;background:var(--main)}
.gvbtns{display:flex;gap:10px}
.gvbtns .btn{flex:1}
.pw{position:relative}
.pw input{padding-right:52px}
.pwb{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:44px;height:44px;border:0;background:none;color:var(--soft);cursor:pointer;display:grid;place-items:center;border-radius:10px}
.pwb svg{width:22px;height:22px}
.plan[data-fo]{cursor:pointer}
footer{text-align:center;color:var(--soft);font-size:13px;padding:30px 0 40px}
.hidden{display:none!important}
.spin{width:18px;height:18px;border:2.5px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:t .7s linear infinite}
@keyframes t{to{transform:rotate(360deg)}}
@media (min-width:700px){.hero h1{font-size:44px}.prix{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<header><div class="wrap"><a class="brand" href="#"><img src="icon-192.png" alt="">Vendoo</a><button class="lnk" id="hBtn">Se connecter</button></div></header>
<main class="wrap" id="app"></main>
<footer>© <span id="an"></span> Vendoo · Paiement par Mobile Money · <a href="confidentialite.html">Confidentialité</a> · <a href="conditions.html">Conditions</a></footer>
<script>
(() => {
  const API = 'https://script.google.com/macros/s/AKfycbwgdtcXlXB9niD3hactnz4SLIrpY_q74iQQZwkr1vrUBjczfCCVWwamG69uqnUQZsba/exec';
  const app = document.getElementById('app'), hBtn = document.getElementById('hBtn');
  document.getElementById('an').textContent = new Date().getFullYear();
  const S = { get: k => { try { return localStorage.getItem(k); } catch(e){ return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch(e){} }, del: k => { try { localStorage.removeItem(k); } catch(e){} } };
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  /* ---------- Tout en français : erreurs réseau, réponses du serveur Google ---------- */
  const frErr = m => { m = String(m || '').replace(/^(Exception|Error|TypeError|SyntaxError):\s*/i, '');
    if (/failed to fetch|networkerror|load failed|network request failed|internet disconnected/i.test(m)) return navigator.onLine === false ? 'Pas de connexion internet. Vérifie ta connexion puis réessaie.' : 'Connexion au serveur impossible. Réessaie dans un instant.';
    if (/unexpected token|not valid json|json\.parse|unexpected end of json|is not valid json/i.test(m)) return 'Le serveur Google n’a pas répondu correctement. Réessaie dans un instant.';
    if (/too many times|invoked too many|quota|rate limit|simultaneous/i.test(m)) return 'Google est très sollicité en ce moment. Réessaie dans une minute.';
    if (/timed? ?out|timeout|maximum execution time|délai/i.test(m)) return 'Le serveur a mis trop de temps à répondre. Réessaie.';
    if (/lock|verrou/i.test(m) && /timeout|wait|attente/i.test(m)) return 'Le serveur est occupé. Réessaie dans un instant.';
    if (/permission|not authorized|authorization|access denied|unauthorized/i.test(m)) return 'Accès refusé par Google. Vérifie que le fichier est bien partagé.';
    if (/cannot read prop|undefined is not|is not a function|is not defined|null/i.test(m)) return 'Une erreur est survenue. Actualise l’application et réessaie.';
    return m || 'Erreur, réessaie.'; };
  try {
    const _f = window.fetch.bind(window);
    window.fetch = async (...a) => { try { return await _f(...a); } catch(e){ if (e && e.name === 'AbortError') throw e; throw new Error(frErr(e && e.message)); } };
    Response.prototype.json = async function(){ const t = await this.text(); try { return JSON.parse(t); } catch(e){ throw new Error('Le serveur Google n’a pas répondu correctement. Réessaie dans un instant.'); } };
    const _al = window.alert.bind(window); window.alert = m => _al(frErr(m));
  } catch(e){}
  const F = n => Number(n || 0).toLocaleString('fr-FR').replace(/ /g, ' ') + ' F';
  let choixFo = S.get('vendoo_fo') === 'an' ? 'an' : 'mois';
  let CFG = null, jeton = S.get('vendoo_jeton') || '', compte = null;
  try { compte = JSON.parse(S.get('vendoo_compte') || 'null'); } catch(e){}

  async function call(body){
    const r = await fetch(API, {method: 'POST', body: JSON.stringify(Object.assign({type: 'vendoo'}, body))});
    const j = await r.json();
    if (!j.ok){ if (j.erreur === 'SESSION'){ deconnexion(); throw new Error('Ta session a expiré. Reconnecte-toi.'); } throw new Error(frErr(j.erreur) || 'Erreur, réessaie.'); }
    return j;
  }
  const config = () => CFG ? Promise.resolve(CFG) : call({action: 'config'}).then(j => (CFG = j));
  function connecte(j){ jeton = j.jeton || jeton; compte = j.compte; S.set('vendoo_jeton', jeton); S.set('vendoo_compte', JSON.stringify(compte)); location.hash = '#compte'; route(); }
  function deconnexion(){ jeton = ''; compte = null; S.del('vendoo_jeton'); S.del('vendoo_compte'); }
  function occupe(btn, oui){ if (!btn) return; btn.disabled = oui; if (oui){ btn.dataset.t = btn.innerHTML; btn.innerHTML = '<span class="spin"></span>'; } else if (btn.dataset.t) btn.innerHTML = btn.dataset.t; }
  function message(el, txt, type){ el.innerHTML = txt ? `<div class="msg ${type || 'err'}">${txt}</div>` : ''; }

  /* ------------ Téléphone : un seul essai gratuit par appareil ------------ */
  // Identifiant gardé à 3 endroits (stockage, cookie, base locale) + empreinte de l'appareil
  const idb = (op, v) => new Promise(ok => { try { const q = indexedDB.open('vendoo', 1); q.onupgradeneeded = () => q.result.createObjectStore('k');
    q.onsuccess = () => { try { const t = q.result.transaction('k', op ? 'readwrite' : 'readonly').objectStore('k'); const g = op ? t.put(v, 'id') : t.get('id'); g.onsuccess = () => ok(g.result || ''); g.onerror = () => ok(''); } catch(e){ ok(''); } }; q.onerror = () => ok(''); } catch(e){ ok(''); } });
  async function sha(t){ const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join(''); }
  async function appareil(){
    let id = S.get('vendoo_app') || (document.cookie.match(/(?:^|; )vapp=([\w-]+)/) || [])[1] || await idb(0);
    if (!id) id = (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
    S.set('vendoo_app', id); document.cookie = 'vapp=' + id + '; max-age=315360000; path=/; SameSite=Lax'; idb(1, id);
    const p = [screen.width + 'x' + screen.height, devicePixelRatio, navigator.hardwareConcurrency, navigator.deviceMemory, navigator.platform, navigator.maxTouchPoints,
      Intl.DateTimeFormat().resolvedOptions().timeZone, (navigator.languages || []).join(',')];
    try { const h = navigator.userAgentData && await navigator.userAgentData.getHighEntropyValues(['model', 'platformVersion']); if (h) p.push(h.model, h.platformVersion); } catch(e){}
    try { const c = document.createElement('canvas'); c.width = 240; c.height = 60; const x = c.getContext('2d'); x.textBaseline = 'top'; x.font = '16px Arial'; x.fillStyle = '#f60'; x.fillRect(10, 10, 100, 30); x.fillStyle = '#069'; x.fillText('Vendoo ✓ 3 jours', 4, 18); x.strokeStyle = 'rgba(120,40,200,.7)'; x.arc(160, 30, 22, 0, 6); x.stroke(); p.push(c.toDataURL()); } catch(e){}
    try { const g = document.createElement('canvas').getContext('webgl'); const d = g.getExtension('WEBGL_debug_renderer_info'); p.push(g.getParameter(d.UNMASKED_RENDERER_WEBGL), g.getParameter(d.UNMASKED_VENDOR_WEBGL)); } catch(e){}
    let empreinte = ''; try { empreinte = await sha(p.join('|')); } catch(e){}
    return {id, empreinte};
  }

  /* ------------ Accueil ------------ */
  function accueil(){
    hBtn.textContent = jeton ? 'Mon compte' : 'Se connecter';
    hBtn.onclick = () => { location.hash = jeton ? '#compte' : '#connexion'; };
    const P = CFG ? CFG.prix : {mois: 14000, an: 100000};
    const eco = P.mois * 12 - P.an;
    app.innerHTML = `
      <section class="hero">
        <h1>Ta boutique en ligne,<br><em>paiement à la livraison</em></h1>
        <p>Crée ton site, reçois tes commandes sur WhatsApp et gère tout depuis ton téléphone. Jusqu’à 30 boutiques sur un seul compte.</p>
        <a class="btn" href="#inscription">Essayer gratuitement 7 jours</a>
        <p class="soft" style="margin-top:12px">Un essai par personne · Tes données restent dans ton Google</p>
      </section>
      <div class="feat">
        <div><i>🏪</i><p style="margin:0"><b>30 boutiques par compte</b><span>Une boutique par agence ou par pays : les commandes ne se mélangent jamais.</span></p></div>
        <div><i>📲</i><p style="margin:0"><b>Commandes sur WhatsApp et en notification</b><span>Chaque commande arrive tout de suite, même application fermée.</span></p></div>
        <div><i>📊</i><p style="margin:0"><b>Application de gestion</b><span>Statuts des commandes, relance des paniers abandonnés, chiffre d’affaires, visiteurs en direct.</span></p></div>
        <div><i>🎯</i><p style="margin:0"><b>Pixels Facebook et TikTok</b><span>Suivi des ventes par publicité pour savoir laquelle rapporte.</span></p></div>
        <div><i>🚚</i><p style="margin:0"><b>Agences de livraison reliées</b><span>Chaque agence a son fichier, les statuts reviennent tout seuls dans ton application.</span></p></div>
        <div><i>⭐</i><p style="margin:0"><b>Avis clients riches</b><span>Texte, captures WhatsApp, notes vocales et vidéos de tes clients.</span></p></div>
      </div>
      <h2>Tarifs</h2>
      <p class="soft" style="margin-top:-4px">🎁 7 jours d’essai gratuit pour découvrir Vendoo. Ensuite, tu choisis ta formule.</p>
      <div class="prix">
        <div class="plan" data-fo="mois" role="button" tabindex="0"><div class="soft">Mensuel</div><div class="p">${F(P.mois)} <small>/ mois</small></div><ul><li>Toutes les fonctions</li><li>30 boutiques</li><li>Prix réduit avec un code promo</li></ul><span class="btn sec" style="margin-top:12px">Choisir le mensuel</span></div>
        <div class="plan top" data-fo="an" role="button" tabindex="0">${eco > 0 ? `<span class="tag">${F(eco)} économisés</span>` : ''}<div class="soft">Annuel</div><div class="p">${F(P.an)} <small>/ an</small></div><ul><li>Toutes les fonctions</li><li>30 boutiques</li><li>Un seul paiement pour l’année</li></ul><span class="btn" style="margin-top:12px">Choisir l’annuel</span></div>
      </div>
      <div class="card"><h3>Comment ça marche ?</h3><ol class="etapes">
        <li><b>Crée ton compte</b><span class="soft">Avec ton e-mail ou ton compte Google : 7 jours d’essai gratuit.</span></li>
        <li><b>Installe ta boutique</b><span class="soft">Un Google Sheets à toi, partagé avec Vendoo : tes commandes restent chez toi.</span></li>
        <li><b>Vends</b><span class="soft">Ajoute tes produits depuis l’application et partage le lien de ta boutique.</span></li>
        <li><b>Abonne-toi</b><span class="soft">Par Mobile Money, quand tu es convaincu.</span></li>
      </ol></div>
      <a class="btn" href="#inscription" style="margin:8px 0 10px">Commencer mon essai gratuit</a>`;
    app.querySelectorAll('[data-fo]').forEach(c => c.onclick = () => { choixFo = c.dataset.fo; S.set('vendoo_fo', choixFo); location.hash = jeton ? '#payer' : '#inscription'; });
  }

  /* ------------ Connexion / inscription ------------ */
  // Œil pour afficher / cacher le mot de passe
  function oeil(root){
    (root || document).querySelectorAll('input[type=password]:not([data-oeil])').forEach(i => {
      i.dataset.oeil = '1';
      const w = document.createElement('div'); w.className = 'pw'; i.parentNode.insertBefore(w, i); w.appendChild(i);
      const b = document.createElement('button'); b.type = 'button'; b.className = 'pwb'; b.setAttribute('aria-label', 'Afficher le mot de passe');
      const ico = vu => vu ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 3l18 18"/><path d="M10.6 5.1A10 10 0 0 1 12 5c6 0 9.5 7 9.5 7a17 17 0 0 1-3 3.9M6.3 6.3A17 17 0 0 0 2.5 12S6 19 12 19a9.6 9.6 0 0 0 4.2-.9"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>'
        : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2.5 12S6 5 12 5s9.5 7 9.5 7-3.5 7-9.5 7-9.5-7-9.5-7z"/><circle cx="12" cy="12" r="3"/></svg>';
      b.innerHTML = ico(false);
      b.onclick = () => { const vu = i.type === 'password'; i.type = vu ? 'text' : 'password'; b.innerHTML = ico(vu); b.setAttribute('aria-label', vu ? 'Cacher le mot de passe' : 'Afficher le mot de passe'); i.focus(); };
      w.appendChild(b);
    });
  }
  function auth(mode){
    hBtn.textContent = 'Accueil'; hBtn.onclick = () => { location.hash = ''; };
    app.innerHTML = `
      <div class="tabs"><button data-m="inscription" class="${mode === 'inscription' ? 'on' : ''}">Créer un compte</button><button data-m="connexion" class="${mode === 'connexion' ? 'on' : ''}">Se connecter</button></div>
      <div class="card">
        <div id="gzone" class="hidden"><div id="gbtn"></div><div class="ou">ou avec ton e-mail</div></div>
        <form id="f" autocomplete="on">
          ${mode === 'inscription' ? `<label for="nom">Ton nom</label><input class="field" id="nom" autocomplete="name" required>
          <label for="tel">Ton numéro WhatsApp</label><input class="field" id="tel" type="tel" autocomplete="tel" inputmode="tel" required>` : ''}
          <label for="email">E-mail</label><input class="field" id="email" type="email" autocomplete="email" required>
          <label for="mdp">Mot de passe</label><input class="field" id="mdp" type="password" autocomplete="${mode === 'inscription' ? 'new-password' : 'current-password'}" minlength="6" required>
          <div id="m"></div>
          <button class="btn" style="margin-top:16px">${mode === 'inscription' ? 'Commencer mon essai gratuit' : 'Se connecter'}</button>
        </form>
        ${mode === 'connexion' ? '<p style="text-align:center;margin:14px 0 0"><button class="lnk" id="oubli">Mot de passe oublié ?</button></p>' : ''}
      </div>`;
    app.querySelectorAll('[data-m]').forEach(b => b.onclick = () => { location.hash = '#' + b.dataset.m; });
    oeil(app);
    const m = document.getElementById('m');
    document.getElementById('f').onsubmit = async e => {

    ['📄', 'Installe ta boutique', `<ul><li>Appuie sur <b>« Créer mon Google Sheets »</b> (un fichier vide dans ton Google).</li><li>Dans ce fichier : <b>Partager</b> → ajoute l’e-mail affiché sur ton compte, en <b>Éditeur</b>.</li><li>Copie le lien du fichier, colle-le ici et appuie sur <b>« Installer ma boutique »</b> (environ 1 minute).</li></ul><p>Tes données restent dans ton Google : Vendoo travaille dessus pour toi.</p>`],
    ['📱', 'Ouvre ton application', `<ul><li>Appuie sur <b>« Ouvrir mon application »</b> et entre le <b>mot de passe</b> affiché sur ton compte.</li><li>Installe-la sur ton téléphone : Chrome → menu ⋮ → <b>« Ajouter à l’écran d’accueil »</b> (iPhone : Partager → « Sur l’écran d’accueil »).</li><li>Dans Réglages, active les <b>notifications</b> : chaque commande arrive tout de suite, même application fermée.</li></ul>`],
    ['🛍️', 'Ajoute tes produits', `<p>Dans l’application : <b>Produits → + Ajouter</b>.</p><ul><li>Photos (recadrer, enlever le fond…), nom, accroche, belle description.</li><li><b>Prix par pays</b> et offres (1, 2, 3 pièces…).</li><li>Avis clients : texte, capture WhatsApp, note vocale, vidéo.</li><li>Mets-le <b>en ligne</b> quand il est prêt (sinon il reste en brouillon).</li></ul><p>Le bouton <b>⋮</b> de chaque produit permet de le modifier, dupliquer, copier son lien ou le supprimer.</p>`],
    ['⚙️', 'Règle ta boutique', `<p>Dans ton Google Sheets, onglet <b>Réglages</b> :</p><ul><li>Nom de la boutique, couleur, logo, bandeau, garanties.</li><li><b>WhatsApp</b> qui reçoit les commandes (CallMeBot, gratuit).</li><li><b>Pixels Facebook et TikTok</b> pour tes publicités.</li></ul><p>Onglet <b>Pays</b> : choisis les pays où tu vends (OUI/NON).</p>`],
    ['🚀', 'Vends', `<ul><li>Copie le <b>lien de ta boutique</b> (sur ton compte) ou d’un produit (⋮ → Copier le lien) et mets-le dans tes pubs, statuts et groupes.</li><li>Pour TikTok : onglet <b>TikTok</b> de l’application → crée une promotion par pub. Tu sauras combien chaque pub te rapporte.</li><li>Jusqu’à <b>30 boutiques</b> : Réglages → Mes boutiques (une par pays ou par agence).</li></ul>`],
    ['📦', 'Gère tes commandes', `<ul><li>Onglet <b>Commandes</b> : appelle le client, change le statut (Confirmée, En livraison, Livrée…).</li><li>Onglet <b>Relances</b> : les clients qui n’ont pas fini leur commande. Une alerte arrive 5 minutes après, avec le message de relance déjà écrit.</li><li><b>Agences</b> (facultatif) : Réglages → Mes boutiques → 🚚 Agences. L’agence reçoit les commandes de son pays et met à jour les statuts.</li></ul>`],
    ['✦', 'Besoin d’aide ?', `<ul><li>Dans l’application, le bouton rond <b>✦ Assistant</b> en bas à droite répond à toutes tes questions, à tout moment.</li><li>Avant la fin de ton essai, abonne-toi ici : <b>14 000 F/mois</b> ou <b>100 000 F/an</b>.</li></ul><p>Tu peux revoir ce guide quand tu veux avec le bouton <b>📘 Guide</b> de ton compte.</p>`]
  ];
  function guide(){
    let i = 0;
    const ov = document.createElement('div'); ov.className = 'gv';
    const fin = () => { ov.remove(); if (compte) S.set('vendoo_guide_' + compte.email, '1'); };
    const dess = () => {
      const [em, t, html] = GUIDE[i];
      ov.innerHTML = `<div class="gvbox" role="dialog" aria-modal="true" aria-label="Guide"><div class="gvtop"><small>Étape ${i + 1} sur ${GUIDE.length}</small><button class="lnk" id="gvX">Passer</button></div>
        <div class="gvem">${em}</div><h2>${t}</h2>${html}
        <div class="gvdots">${GUIDE.map((_, k) => `<i class="${k === i ? 'on' : ''}"></i>`).join('')}</div>
        <div class="gvbtns">${i ? '<button class="btn ghost" id="gvP">Précédent</button>' : ''}<button class="btn" id="gvN">${i === GUIDE.length - 1 ? 'C’est parti !' : 'Suivant'}</button></div></div>`;
      ov.querySelector('#gvX').onclick = fin;
      ov.querySelector('#gvN').onclick = () => { if (i === GUIDE.length - 1) return fin(); i++; dess(); };
      const pv = ov.querySelector('#gvP'); if (pv) pv.onclick = () => { i--; dess(); };
    };
    dess(); document.body.appendChild(ov);
  }

  function route(){
    const h = location.hash.replace('#', '');
    if (h === 'compte' || h === 'payer'){ compteVue(); if (h === 'payer') setTimeout(() => { const p = document.getElementById('payer'); if (p) p.scrollIntoView({behavior: 'smooth'}); }, 300); return; }
    if (h === 'connexion' || h === 'inscription') return jeton ? (location.hash = '#compte') : auth(h);
    accueil();
  }
  addEventListener('hashchange', () => { route(); scrollTo(0, 0); });
  route();
  config().then(() => { if (!location.hash || location.hash === '#') accueil(); }).catch(() => {});
})();
</script>
</body>
</html>
