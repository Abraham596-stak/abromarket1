<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rappels de commandes</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#2350D8">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<script>window.OneSignalDeferred = window.OneSignalDeferred || [];</script>
<script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
<style>
:root{--main:#2350D8;--ink:#141A2E;--soft:#5A6178;--line:#E3E6EF;--surface:#F3F5FB;--ok:#12A150;--okbg:#DDF5E7;--err:#C62828;--sun:#FFC93C}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:#fff;line-height:1.45;font-size:16px}
.wrap{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 18px) 16px 40px}
.top{display:flex;gap:12px;align-items:center}
.top img{width:48px;height:48px;border-radius:12px}
h1{font-size:22px;line-height:1.2}
.sub{color:var(--soft);font-size:14px}
.card{border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:16px}
.etat{display:flex;gap:10px;align-items:flex-start;border-radius:14px;padding:14px;margin-top:16px;background:var(--surface)}
.etat.ok{background:var(--okbg)}
.etat b{display:block}
.btn{display:block;width:100%;border:0;border-radius:999px;padding:15px;font-size:17px;font-weight:800;text-align:center;text-decoration:none;cursor:pointer;margin-top:12px}
.btn.bleu{background:var(--main);color:#fff}
.btn.gris{background:var(--surface);color:var(--ink)}
.btn:disabled{opacity:.5}
h2{font-size:17px;margin-bottom:6px}
.item{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.item:first-of-type{border-top:0}
.item b{display:block;font-size:15px}
.item small{color:var(--soft);font-size:13px}
.item a{flex:0 0 auto;background:var(--okbg);color:#0B6B35;font-weight:800;text-decoration:none;border-radius:999px;padding:8px 12px;font-size:14px}
.tag{display:inline-block;background:#FFF3CD;color:#7A5A00;border-radius:999px;padding:1px 8px;font-size:12px;font-weight:700;margin-left:4px}
.ios{background:#FFF8E1;border-radius:14px;padding:14px;margin-top:14px;font-size:15px}
.ios ol{margin:6px 0 0 20px}
.vide{color:var(--soft);font-size:14px}
.err{background:#FBE3E3;color:var(--err);border-radius:14px;padding:14px;margin-top:16px;font-weight:700}
</style>
</head>
<body>
<div class="wrap" id="app"><p class="sub">Chargement…</p></div>
<script>
const API = "https://script.google.com/macros/s/AKfycbwgdtcXlXB9niD3hactnz4SLIrpY_q74iQQZwkr1vrUBjczfCCVWwamG69uqnUQZsba/exec";
(function(){
  const app = document.getElementById('app');
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
  // Le lien personnel (…?k=…) est gardé : sur iPhone, l'appli ouverte depuis l'écran d'accueil n'a plus le lien
  let k = (new URLSearchParams(location.search).get('k') || '').replace(/[^a-f0-9]/g, '');
  try { if (k) localStorage.setItem('agence_k', k); else k = localStorage.getItem('agence_k') || ''; } catch(e){}
  const ios = /iphone|ipad|ipod/i.test(navigator.userAgent), installe = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone;
  let D = null, osOk = false, osErr = '';
  const appel = async o => { const r = await fetch(API, {method: 'POST', body: JSON.stringify(Object.assign({type: 'agence', k}, o || {}))}); const j = await r.json(); if (!j.ok) throw new Error(j.erreur || 'Erreur'); return j; };
  const tel = t => 'tel:' + String(t || '').replace(/[^\d+]/g, '');
  function dessiner(msg){
    const A = D.aFaire || {rappeler: [], statut: []};
    const liste = (L, vide) => L.length ? L.map(x => `<div class="item"><div><b>${esc(x.nom || 'Sans nom')}${x.relance ? '<span class="tag">Relance</span>' : ''}</b><small>n°${esc(x.numero)} · ${esc(x.produit)}${x.statut ? ' · ' + esc(x.statut) : ''}</small></div>${x.tel ? `<a href="${esc(tel(x.tel))}">📞 Appeler</a>` : ''}</div>`).join('') : `<p class="vide">${vide}</p>`;
    const peut = 'Notification' in window && 'serviceWorker' in navigator;
    app.innerHTML = `<div class="top"><img src="icon-192.png" alt=""><div><h1>Rappels de commandes</h1><p class="sub">${esc(D.boutique)} · ${esc(D.pays)}</p></div></div>
      ${D.actif && osOk ? `<div class="etat ok"><span>✅</span><div><b>Rappels activés sur ce téléphone</b><span class="sub">Toutes les 30 min : statuts à changer. Chaque heure : clients à rappeler (de 7 h à 21 h).</span></div></div>`
        : `<div class="etat"><span>🔔</span><div><b>Active les rappels (une seule fois)</b><span class="sub">Tu recevras sur ce téléphone, même verrouillé : toutes les 30 min les commandes dont tu dois changer le statut, et chaque heure les clients à rappeler.</span></div></div>
        ${ios && !installe ? `<div class="ios"><b>Sur iPhone, d’abord :</b><ol><li>Touche le bouton <b>Partager</b> (carré avec une flèche) en bas de Safari.</li><li>Choisis <b>« Sur l’écran d’accueil »</b>, puis <b>Ajouter</b>.</li><li>Ouvre <b>Rappels</b> depuis ton écran d’accueil et touche « Activer les rappels ».</li></ol></div>` : ''}
        ${peut ? `<button class="btn bleu" id="act">🔔 Activer les rappels</button>` : `<div class="err">Ce navigateur ne peut pas recevoir de notifications. Ouvre ce lien avec Chrome (Android) ou Safari (iPhone).</div>`}`}
      ${msg ? `<div class="err">${esc(msg)}</div>` : ''}
      <div class="card"><h2>✍️ Statut à changer (${A.statut.length})</h2><p class="sub" style="margin-bottom:6px">Encore « Nouvelle » depuis plus de 30 min : mets le statut et ce que le client a dit.</p>${liste(A.statut, 'Rien à changer pour le moment 👍')}</div>
      <div class="card"><h2>📞 Clients à rappeler (${A.rappeler.length})</h2><p class="sub" style="margin-bottom:6px">Ils n’ont pas annulé : à rappeler, demain, WhatsApp, ne décroche pas…</p>${liste(A.rappeler, 'Personne à rappeler pour le moment 👍')}</div>
      ${D.fichier ? `<a class="btn bleu" href="${esc(D.fichier)}" target="_blank" rel="noopener">📄 Ouvrir ma feuille des commandes</a>` : ''}
      <button class="btn gris" id="maj">↻ Actualiser</button>`;
    const a = document.getElementById('act'); if (a) a.onclick = activer;
    document.getElementById('maj').onclick = () => charger();
  }
  function initOS(){
    return new Promise(ok => {
      if (!D.onesignal){ osErr = 'Notifications pas encore configurées par la boutique.'; ok(false); return; }
      window.OneSignalDeferred.push(async OneSignal => {
        try {
          await OneSignal.init({ appId: D.onesignal, serviceWorkerPath: 'abromarket1/agence/OneSignalSDKWorker.js', serviceWorkerParam: { scope: '/abromarket1/agence/' }, notifyButton: { enable: false },
            welcomeNotification: { title: 'Rappels activés ✅', message: 'Tu seras prévenu pour les clients à rappeler et les statuts à changer.' } });
          osOk = !!(OneSignal.Notifications.permission && OneSignal.User.PushSubscription.optedIn);
          if (osOk){ try { await OneSignal.User.addTags({vendoo: 'ag', agence: k}); } catch(x){} if (!D.actif) try { await appel({action: 'abonne'}); D.actif = true; } catch(x){} }
          ok(true);
        } catch(e){ osErr = e && e.message || String(e); ok(false); }
      });
      setTimeout(() => ok(false), 12000);
    });
  }
  async function activer(e){
    const b = e.currentTarget; b.disabled = true; b.textContent = 'Activation…';
    try {
      await new Promise((ok, ko) => window.OneSignalDeferred.push(async OneSignal => {
        try { await OneSignal.Notifications.requestPermission(); await OneSignal.User.PushSubscription.optIn(); await OneSignal.User.addTags({vendoo: 'ag', agence: k}); ok(); } catch(x){ ko(x); } }));
      if (!(window.OneSignal && OneSignal.Notifications.permission)) throw new Error('Tu as refusé les notifications. Autorise-les dans les réglages du navigateur pour ce site, puis réessaie.');
      await appel({action: 'abonne'}); D.actif = true; osOk = true; dessiner();
    } catch(x){ b.disabled = false; b.textContent = '🔔 Activer les rappels'; dessiner(x.message || 'Activation impossible. Réessaie.'); }
  }
  async function charger(){
    if (!k){ app.innerHTML = '<div class="err">Lien incomplet. Ouvre le lien reçu par e-mail (« Active tes rappels de commandes »).</div>'; return; }
    try { D = await appel(); } catch(e){ app.innerHTML = `<div class="err">${esc(e.message)}</div>`; return; }
    dessiner(); await initOS(); dessiner(osErr && !osOk && D.actif ? '' : '');
  }
  charger();
})();
</script>
</body>
</html>
