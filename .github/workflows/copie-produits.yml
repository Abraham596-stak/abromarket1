name: Copie rapide des produits
# Copie les produits du Google Sheets dans boutique/data.json et prépare des images légères (WebP)
# dans boutique/img/ pour que la boutique s'affiche instantanément, texte et images ensemble.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency: copie-produits
jobs:
  copie:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Outils
        run: pip install --quiet pillow
      - name: Récupérer les produits et optimiser les images
        run: |
          API=$(grep -oE 'https://script\.google\.com/macros/s/[A-Za-z0-9_-]+/exec' boutique/index.html | head -1)
          curl -sSL --max-time 60 "$API" -o /tmp/d.json
          python3 - <<'PY'
          import json, re, hashlib, io, os, urllib.request
          from PIL import Image, ImageOps
          d = json.load(open('/tmp/d.json'))
          assert isinstance(d.get('produits'), list) and d.get('pays'), 'réponse invalide'
          d.pop('maj', None)
          os.makedirs('boutique/img', exist_ok=True)

          def source(u):
              m = re.search(r'drive\.google\.com/(?:file/d/|open\?id=|uc\?(?:export=\w+&)?id=)([\w-]{20,})', u)
              return 'https://drive.google.com/thumbnail?id=%s&sz=w1200' % m.group(1) if m else u

          urls = []
          for p in d['produits']:
              urls += p.get('photos', [])
              urls += [l.strip() for l in re.split(r'\r?\n|\s*\|\s*', p.get('description', '')) if re.match(r'^https?://\S+$', l.strip())]
              urls += [a.get('photo') for a in p.get('avis', []) if a.get('photo')]
          logo = d.get('reglages', {}).get('Logo (lien image, optionnel)')
          if logo: urls.append(logo)

          imgs = {}
          for u in dict.fromkeys(u.strip() for u in urls if u and u.strip()):
              nom = 'img/' + hashlib.sha1(u.encode()).hexdigest()[:14] + '.webp'
              chemin = 'boutique/' + nom
              if not os.path.exists(chemin):
                  try:
                      req = urllib.request.Request(source(u), headers={'User-Agent': 'Mozilla/5.0'})
                      data = urllib.request.urlopen(req, timeout=30).read()
                      im = ImageOps.exif_transpose(Image.open(io.BytesIO(data)))
                      im = im.convert('RGBA' if im.mode in ('RGBA', 'LA', 'P') else 'RGB')
                      im.thumbnail((800, 800))
                      im.save(chemin, 'WEBP', quality=72, method=6)
                      print('optimisée :', u, '->', os.path.getsize(chemin) // 1024, 'Ko')
                  except Exception as e:
                      print('ignorée :', u, e)
                      continue
              imgs[u] = nom
          d['imgs'] = imgs
          json.dump(d, open('boutique/data.json', 'w'), ensure_ascii=False, separators=(',', ':'), sort_keys=True)
          PY
      - name: Enregistrer si quelque chose a changé
        run: |
          git config user.name "abromarket-bot"
          git config user.email "actions@users.noreply.github.com"
          git add boutique/data.json boutique/img
          git diff --cached --quiet || (git commit -m "Mise à jour de la copie des produits" && git pull --rebase -q && git push)
