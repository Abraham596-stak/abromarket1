name: Copie rapide des produits
# Copie les produits du Google Sheets dans boutique/data.json et prépare des images légères (WebP)
# dans boutique/img/ pour que la boutique s'affiche instantanément, texte et images ensemble.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency: copie-produits
jobs:
  copie:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Outils
        run: pip install --quiet pillow
      - name: Récupérer les produits et optimiser les images
        run: |
          API=$(grep -oE 'https://script\.google\.com/macros/s/[A-Za-z0-9_-]+/exec' boutique/index.html | head -1)
          API="$API" python3 - <<'PY'
          import json, re, hashlib, io, os, urllib.request
          from PIL import Image, ImageOps
          API = os.environ['API']
          os.makedirs('boutique/img', exist_ok=True)
          os.makedirs('boutique/data', exist_ok=True)

          def lire(url):
              req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
              return urllib.request.urlopen(req, timeout=60).read()

          def source(u):
              m = re.search(r'drive\.google\.com/(?:file/d/|open\?id=|uc\?(?:export=\w+&)?id=)([\w-]{20,})', u)
              return 'https://drive.google.com/thumbnail?id=%s&sz=w2000' % m.group(1) if m else u

          def optimiser(d):
              urls = []
              for p in d['produits']:
                  urls += p.get('photos', [])
                  desc = p.get('description', '') or ''
                  if desc.lstrip().startswith('<'):
                      urls += re.findall(r'<img[^>]+src="(https?://[^"]+)"', desc)
                  else:
                      urls += [l.strip() for l in re.split(r'\r?\n|\s*\|\s*', desc) if re.match(r'^https?://\S+$', l.strip())]
                  urls += [a.get(k) for a in p.get('avis', []) for k in ('photo', 'avatar') if a.get(k)]
              logo = d.get('reglages', {}).get('Logo (lien image, optionnel)')
              if logo: urls.append(logo)
              imgs = {}
              for u in dict.fromkeys(u.strip() for u in urls if u and u.strip()):
                  # v2 : images nettes (1600 px, qualité 88) et jamais rognées
                  nom = 'img/' + hashlib.sha1(u.encode()).hexdigest()[:14] + '-v2.webp'
                  chemin = 'boutique/' + nom
                  if not os.path.exists(chemin):
                      try:
                          im = ImageOps.exif_transpose(Image.open(io.BytesIO(lire(source(u)))))
                          im = im.convert('RGBA' if im.mode in ('RGBA', 'LA', 'P') else 'RGB')
                          im.thumbnail((1600, 1600), Image.LANCZOS)
                          im.save(chemin, 'WEBP', quality=88, method=6)
                          print('optimisée :', u, '->', os.path.getsize(chemin) // 1024, 'Ko')
                      except Exception as e:
                          print('ignorée :', u, e)
                          continue
                  imgs[u] = nom
              d['imgs'] = imgs
              return set(imgs.values())

          # Boutique principale (data.json) puis chaque boutique Vendoo (data/<code>.json)
          gardees, codes = set(), ['']
          try:
              codes += json.loads(lire(API + '?liste=1')).get('boutiques', [])
          except Exception as e:
              print('liste des boutiques indisponible :', e)
          for code in codes:
              try:
                  d = json.loads(lire(API + ('?b=' + code if code else '')))
                  assert isinstance(d.get('produits'), list) and d.get('pays'), 'réponse invalide'
              except Exception as e:
                  print('boutique ignorée :', code or 'principale', e)
                  if code == '': raise
                  continue
              d.pop('maj', None)
              gardees |= optimiser(d)
              cible = 'boutique/data/' + code + '.json' if code else 'boutique/data.json'
              json.dump(d, open(cible, 'w'), ensure_ascii=False, separators=(',', ':'), sort_keys=True)
              print('copiée :', code or 'principale', len(d['produits']), 'produits')
          # Boutiques des abonnés Vendoo (chacun dans son propre Google) : data/v-<id>[-<code>].json
          import time
          debut, ecrits, liste_ok = time.time(), set(), False
          def garder(prefixe):
              global gardees
              for f in os.listdir('boutique/data'):
                  if f.startswith(prefixe):
                      ecrits.add(f)
                      try: gardees |= set(json.load(open('boutique/data/' + f)).get('imgs', {}).values())
                      except Exception: pass
          try:
              abonnes = json.loads(lire(API + '?vendoo=liste')).get('abonnes', [])
              liste_ok = True
          except Exception as e:
              abonnes = []
              print('liste Vendoo indisponible :', e)
          for ab in abonnes:
              vid, api = re.sub(r'[^a-f0-9]', '', ab.get('id', ''))[:16], ab.get('api', '')
              if not vid or not re.match(r'^https://script\.google\.com/macros/s/[\w-]+/exec$', api): continue
              if time.time() - debut > 300:
                  print('temps écoulé, abonnés restants au prochain passage')
                  garder('v-' + vid + '.json'); garder('v-' + vid + '-')
                  continue
              try:
                  sous = [''] + json.loads(lire(api + '?liste=1')).get('boutiques', [])
              except Exception as e:
                  print('abonné ignoré :', vid, e)
                  garder('v-' + vid + '.json'); garder('v-' + vid + '-')
                  continue
              for code in sous:
                  nom = 'v-' + vid + ('-' + code if code else '') + '.json'
                  try:
                      d = json.loads(lire(api + ('?b=' + code if code else '')))
                      assert isinstance(d.get('produits'), list), 'réponse invalide'
                  except Exception as e:
                      print('boutique ignorée :', nom, e)
                      garder(nom)
                      continue
                  d.pop('maj', None)
                  d['api'] = api
                  gardees |= optimiser(d)
                  json.dump(d, open('boutique/data/' + nom, 'w'), ensure_ascii=False, separators=(',', ':'), sort_keys=True)
                  ecrits.add(nom)
                  print('copiée :', nom, len(d['produits']), 'produits')
          # Abonnés coupés ou partis : leur copie est retirée
          if liste_ok:
              for f in os.listdir('boutique/data'):
                  if f.startswith('v-') and f not in ecrits:
                      os.remove('boutique/data/' + f)
                      print('retirée :', f)
          # Retire les anciennes images qui ne servent plus à aucune boutique
          for f in os.listdir('boutique/img'):
              if 'img/' + f not in gardees and f.endswith('.webp'):
                  os.remove('boutique/img/' + f)
          PY
      - name: Enregistrer si quelque chose a changé
        run: |
          git config user.name "abromarket-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A boutique/data.json boutique/data boutique/img
          git diff --cached --quiet || (git commit -m "Mise à jour de la copie des produits" && git pull --rebase -q && git push)
