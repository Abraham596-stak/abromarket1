# Garde le serveur Google « réveillé » : sans ça, la 1re demande après un moment de calme prend plus de 10 secondes.
name: Réveil du serveur
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: |
          D=$(date +%s%N); curl -sL --max-time 60 "https://script.google.com/macros/s/AKfycbwgdtcXlXB9niD3hactnz4SLIrpY_q74iQQZwkr1vrUBjczfCCVWwamG69uqnUQZsba/exec?ping=1" -o r.txt || true
          echo "Réponse en $(( ($(date +%s%N) - D) / 1000000 )) ms : $(head -c 60 r.txt)"
