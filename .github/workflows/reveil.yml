# Garde le serveur Google « réveillé » : sans ça, la 1re demande après un moment de calme prend plus de 10 secondes.
name: Réveil du serveur
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: |
          API="https://script.google.com/macros/s/AKfycbwgdtcXlXB9niD3hactnz4SLIrpY_q74iQQZwkr1vrUBjczfCCVWwamG69uqnUQZsba/exec"
          # Réveille le serveur et prépare les données de chaque boutique (le site les reçoit ensuite tout de suite)
          for b in "" "abromarket-benin" "abromarket-togo"; do
            D=$(date +%s%N); curl -sL --max-time 60 "$API?${b:+b=$b&}t=$(date +%s)" -o r.txt || true
            echo "${b:-principale} : $(( ($(date +%s%N) - D) / 1000000 )) ms, $(wc -c < r.txt) octets"
          done
